<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Inventory — Garden Faery</title>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<link rel="apple-touch-icon" href="/icon-admin.png">
<link rel="icon" type="image/png" href="/icon-admin.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="shared.css?v=2026-07-18">

<style>
  body { font-family: var(--font-body); background: var(--cream); color: var(--plum); min-height: 100vh; padding-bottom: 80px; }
  h1, h2, h3 { font-family: var(--font-heading); font-weight: 500; color: var(--plum); }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 18px; }

  .nh-header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 4px 0 18px; flex-wrap: wrap; }
  .nh-title { font-family: var(--font-heading); font-size: 2rem; font-weight: 500; }
  .nh-sub { font-size: 0.9rem; color: var(--gray-600); margin-top: 2px; }
  .nh-tools { display: flex; gap: 8px; align-items: center; }
  .logout-btn { background: transparent; border: 1px solid var(--gray-200); border-radius: 8px; padding: 6px 12px; color: var(--plum); cursor: pointer; font-family: inherit; font-size: 0.85rem; }

  /* Strip */
  .strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .strip .card { background: var(--white); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); }
  .strip .label { font-size: 0.72rem; color: var(--gray-600); text-transform: uppercase; letter-spacing: 0.6px; }
  .strip .val { font-family: var(--font-heading); font-size: 1.6rem; font-weight: 500; margin-top: 2px; }
  .strip .card.alert { background: var(--butter); }
  .strip .card.alert .val { color: var(--plum); }

  /* Filters */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
  .filters select, .filters input[type=search] {
    background: var(--white); border: 1px solid var(--gray-200); border-radius: 8px;
    padding: 8px 10px; font-family: var(--font-body); font-size: 0.85rem; color: var(--plum);
  }
  .filters input[type=search] { min-width: 220px; }
  .filters .spacer { flex: 1; }

  /* Buttons */
  .btn { background: var(--plum); color: var(--white); border: none; border-radius: 8px; padding: 9px 14px; font-family: var(--font-body); font-weight: 600; font-size: 0.86rem; cursor: pointer; }
  .btn:hover { background: #45102f; }
  .btn-ghost { background: transparent; color: var(--plum); border: 1px solid var(--gray-200); }
  .btn-ghost:hover { background: var(--gray-100); }
  .btn-sm { padding: 6px 10px; font-size: 0.78rem; }

  /* Table */
  .table-wrap { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); overflow-x: auto; }
  table.nh { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
  table.nh th, table.nh td { padding: 10px 12px; text-align: left; vertical-align: top; }
  table.nh thead th { background: var(--gray-100); font-weight: 700; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--gray-600); border-bottom: 1px solid var(--gray-200); }
  table.nh tbody tr { border-top: 1px solid var(--gray-100); cursor: pointer; }
  table.nh tbody tr:hover { background: var(--gray-100); }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 0.72rem; font-weight: 600; }
  .pill-low { background: var(--red-light); color: var(--red); }
  .pill-ok { background: var(--sage-light); color: #3f5a32; }
  .pill-cat { background: var(--cream); color: var(--plum); border: 1px solid var(--gray-200); }

  /* Modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(90, 18, 48, 0.45); z-index: 200; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 30px 14px; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow-hover); max-width: 580px; width: 100%; padding: 22px; }
  .modal h2 { margin-bottom: 14px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .row.full { grid-template-columns: 1fr; }
  .modal label { display: block; font-size: 0.74rem; font-weight: 600; color: var(--gray-600); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
  .modal input[type=text], .modal input[type=number], .modal input[type=date], .modal select, .modal textarea {
    width: 100%; background: var(--white); border: 1px solid var(--gray-200); border-radius: 8px;
    padding: 9px 11px; font-family: var(--font-body); font-size: 0.9rem; color: var(--plum);
  }
  .modal textarea { min-height: 60px; resize: vertical; }
  .modal-foot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--gray-100); }

  /* Quick-action chips for transactions */
  .quick-tx { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .qtx-chip { padding: 4px 10px; border-radius: 99px; font-size: 0.74rem; font-weight: 600; cursor: pointer; background: var(--cream); border: 1px solid var(--gray-200); color: var(--plum); }
  .qtx-chip.active { background: var(--plum); color: var(--white); border-color: var(--plum); }

  /* Login */
  .login { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-card { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 30px; max-width: 360px; width: 100%; }
  .login-card h1 { font-size: 1.6rem; margin-bottom: 4px; }
  .login-card p { color: var(--gray-600); font-size: 0.86rem; margin-bottom: 18px; }
  .login-card input { width: 100%; padding: 11px 13px; border: 1px solid var(--gray-200); border-radius: 8px; margin-bottom: 12px; font-size: 1rem; font-family: var(--font-body); }
  .login-card .btn { width: 100%; padding: 12px; }
  .login-error { background: var(--red-light); color: var(--red); padding: 10px; border-radius: 8px; font-size: 0.82rem; margin-bottom: 12px; display: none; }
  .login-error.show { display: block; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--plum); color: var(--white); padding: 10px 18px; border-radius: 8px; box-shadow: var(--shadow-hover); font-size: 0.86rem; opacity: 0; transition: opacity 0.2s; z-index: 300; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="login-screen" class="login">
  <div class="login-card">
    <h1>Inventory</h1>
    <p>Garden Faery supplies tracker.</p>
    <div id="login-error" class="login-error"></div>
    <input type="email" id="login-email" placeholder="Admin email" autocomplete="username">
    <input type="password" id="login-pw" placeholder="Password" autocomplete="current-password">
    <button class="btn" id="login-btn" onclick="doLogin()">Sign in</button>
  </div>
</div>

<div id="app" class="wrap" style="display:none">
  <div class="nh-header">
    <div>
      <div class="nh-title">Inventory</div>
      <div class="nh-sub">Seeds, fertilizer, mulch, tools, supplies</div>
    </div>
    <div class="nh-tools">
      <a href="admin-planner.html" class="logout-btn" style="text-decoration:none">Planner</a>
      <button class="logout-btn" onclick="logout()">Sign out</button>
    </div>
  </div>

  <div class="strip" id="summary-strip"></div>

  <div class="filters">
    <input type="search" id="filter-search" placeholder="Search items...">
    <select id="filter-cat">
      <option value="">All categories</option>
      <option value="seed">Seed</option>
      <option value="transplant">Transplant</option>
      <option value="fertilizer">Fertilizer</option>
      <option value="soil_amendment">Soil amendment</option>
      <option value="mulch">Mulch</option>
      <option value="compost">Compost</option>
      <option value="soil_mix">Soil mix</option>
      <option value="pest_control">Pest control</option>
      <option value="disease_control">Disease control</option>
      <option value="tool">Tool</option>
      <option value="irrigation">Irrigation</option>
      <option value="pot_container">Pot / container</option>
      <option value="support">Support / trellis</option>
      <option value="fabric_cover">Fabric / cover</option>
      <option value="misc">Misc</option>
    </select>
    <select id="filter-stock">
      <option value="">All stock</option>
      <option value="low">Low stock only</option>
      <option value="ok">In stock</option>
      <option value="used_up">Used up</option>
    </select>
    <div class="spacer"></div>
    <button class="btn" onclick="openItemModal()">Add item</button>
  </div>

  <div class="table-wrap">
    <table class="nh" id="items-table">
      <thead><tr>
        <th>Item</th><th>Category</th><th>On hand</th><th>Reorder at</th>
        <th>Location</th><th>Last purchased</th><th></th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<!-- Item modal -->
<div class="modal-overlay" id="item-modal">
  <div class="modal">
    <h2 id="im-title">Add inventory item</h2>
    <input type="hidden" id="im-id">
    <div class="row">
      <div><label>Name</label><input type="text" id="im-name" required></div>
      <div><label>Brand</label><input type="text" id="im-brand"></div>
    </div>
    <div class="row">
      <div><label>Category</label>
        <select id="im-cat">
          <option value="seed">Seed</option>
          <option value="transplant">Transplant</option>
          <option value="fertilizer">Fertilizer</option>
          <option value="soil_amendment">Soil amendment</option>
          <option value="mulch">Mulch</option>
          <option value="compost">Compost</option>
          <option value="soil_mix">Soil mix</option>
          <option value="pest_control">Pest control</option>
          <option value="disease_control">Disease control</option>
          <option value="tool">Tool</option>
          <option value="irrigation">Irrigation</option>
          <option value="pot_container">Pot / container</option>
          <option value="support">Support / trellis</option>
          <option value="fabric_cover">Fabric / cover</option>
          <option value="misc">Misc</option>
        </select>
      </div>
      <div><label>Status</label>
        <select id="im-status">
          <option value="active">Active</option>
          <option value="discontinued">Discontinued</option>
          <option value="used_up">Used up</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div><label>Current quantity</label><input type="number" id="im-qty" step="0.01" min="0"></div>
      <div><label>Units</label><input type="text" id="im-units" placeholder="oz, lbs, cu ft, packets..."></div>
    </div>
    <div class="row">
      <div><label>Reorder threshold</label><input type="number" id="im-reorder" step="0.01" min="0"></div>
      <div><label>Location</label><input type="text" id="im-loc" placeholder="garage shelf B"></div>
    </div>
    <div class="row">
      <div><label>Supplier</label><input type="text" id="im-supplier"></div>
      <div><label>Last cost ($)</label><input type="number" id="im-cost" step="0.01" min="0"></div>
    </div>
    <div class="row">
      <div><label>Last purchased</label><input type="date" id="im-purchased"></div>
      <div><label>Expires</label><input type="date" id="im-expires"></div>
    </div>
    <div class="row full"><div><label>Notes</label><textarea id="im-notes"></textarea></div></div>
    <div class="modal-foot">
      <button class="btn-ghost" onclick="closeModal('item-modal')">Cancel</button>
      <button class="btn" id="im-delete" style="display:none;background:var(--red)" onclick="deleteItem()">Delete</button>
      <button class="btn-ghost" id="im-log-btn" style="display:none" onclick="openTxnFromItem()">Log transaction</button>
      <button class="btn" onclick="saveItem()">Save</button>
    </div>
  </div>
</div>

<!-- Transaction modal -->
<div class="modal-overlay" id="txn-modal">
  <div class="modal">
    <h2>Log transaction</h2>
    <input type="hidden" id="tx-id">
    <input type="hidden" id="tx-item-id">
    <div style="font-size:0.86rem;color:var(--gray-600);margin-bottom:10px"><strong id="tx-item-name"></strong> · current: <span id="tx-current"></span></div>
    <div class="quick-tx">
      <span class="qtx-chip" data-tx="purchase" data-sign="+">Purchase (+)</span>
      <span class="qtx-chip" data-tx="use" data-sign="-">Use (−)</span>
      <span class="qtx-chip" data-tx="transfer" data-sign="-">Transfer (−)</span>
      <span class="qtx-chip" data-tx="adjustment" data-sign="0">Adjust</span>
      <span class="qtx-chip" data-tx="spoilage" data-sign="-">Spoiled (−)</span>
      <span class="qtx-chip" data-tx="gift" data-sign="-">Gift (−)</span>
    </div>
    <div class="row">
      <div><label>Date</label><input type="date" id="tx-date"></div>
      <div><label>Quantity</label><input type="number" id="tx-qty" step="0.01" min="0"></div>
    </div>
    <div class="row">
      <div><label>Garden (if applicable)</label>
        <select id="tx-garden"><option value="">—</option></select>
      </div>
      <div><label>Cost ($, for purchases)</label><input type="number" id="tx-cost" step="0.01" min="0"></div>
    </div>
    <div class="row full"><div><label>Notes</label><textarea id="tx-notes"></textarea></div></div>
    <div class="modal-foot">
      <button class="btn-ghost" onclick="closeModal('txn-modal')">Cancel</button>
      <button class="btn" onclick="saveTxn()">Save transaction</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const PB_URL = (() => {
  const h = location.hostname;
  if (h === 'localhost' || h === '127.0.0.1' || h === '' || location.protocol === 'file:') {
    return 'http://127.0.0.1:8091';
  }
  return 'https://bookings.gardenfaery.love';
})();
const PB_TOKEN_KEY = 'gf_pb_token';
let PB_TOKEN = localStorage.getItem(PB_TOKEN_KEY) || '';

const state = { items: [], txns: [], gardens: [] };

function tokenValid(tok) {
  if (!tok || tok.split('.').length !== 3) return false;
  try {
    const payload = JSON.parse(atob(tok.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
    return payload.exp && (payload.exp * 1000) > (Date.now() - 30000);
  } catch (_) { return false; }
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pw = document.getElementById('login-pw').value;
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  errEl.classList.remove('show');
  if (!email || !pw) return;
  btn.disabled = true;
  let networkError = false;
  try {
    for (const endpoint of ['_superusers', 'users']) {
      try {
        const resp = await fetch(PB_URL + '/api/collections/' + endpoint + '/auth-with-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identity: email, password: pw }),
        });
        if (resp.ok) {
          const data = await resp.json();
          PB_TOKEN = data.token; localStorage.setItem(PB_TOKEN_KEY, PB_TOKEN);
          boot();
          return;
        }
        // non-ok HTTP = server reachable but credentials rejected
      } catch (_) {
        // thrown = network/connectivity failure, not a credential rejection
        networkError = true;
      }
    }
    errEl.textContent = networkError
      ? 'Could not reach the server. Check your connection and try again.'
      : 'Sign-in failed. Check your email and password.';
    errEl.classList.add('show');
  } finally {
    btn.disabled = false;
  }
}
function logout() {
  PB_TOKEN = ''; localStorage.removeItem(PB_TOKEN_KEY);
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

async function pb(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (PB_TOKEN) opts.headers['Authorization'] = 'Bearer ' + PB_TOKEN;
  if (body) opts.body = JSON.stringify(body);
  const resp = await fetch(PB_URL + path, opts);
  if (resp.status === 401) { logout(); throw new Error('Auth expired'); }
  if (!resp.ok) { const t = await resp.text().catch(() => ''); throw new Error('PB ' + resp.status + ': ' + t); }
  return resp.json();
}

// Page through all records (PocketBase caps perPage at 500).
async function pbAll(collection, query) {
  const out = []; let page = 1;
  for (;;) {
    const sep = query ? '&' : '';
    const data = await pb('GET', `/api/collections/${collection}/records?perPage=500&page=${page}${sep}${query || ''}`);
    const items = data.items || [];
    out.push(...items);
    if (items.length < 500 || page >= (data.totalPages || 1)) break;
    page++;
  }
  return out;
}

async function boot() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  try {
    const [items, txns, gardens] = await Promise.all([
      pbAll('inventory_items', 'sort=name'),
      pbAll('inventory_transactions', 'sort=-transaction_date'),
      pbAll('gardens', 'sort=name'),
    ]);
    state.items = items;
    state.txns = txns;
    state.gardens = gardens;
  } catch (err) { toast('Load failed: ' + err.message); return; }
  renderAll();
}

function renderAll() {
  renderSummary();
  renderItems();
}

function renderSummary() {
  const total = state.items.length;
  const active = state.items.filter(i => i.status === 'active').length;
  const low = state.items.filter(i => i.status === 'active' && i.reorder_threshold && i.current_qty <= i.reorder_threshold).length;
  const cats = new Set(state.items.map(i => i.category)).size;
  document.getElementById('summary-strip').innerHTML = [
    ['Total items', total, ''],
    ['Active', active, ''],
    ['Low stock', low, low > 0 ? 'alert' : ''],
    ['Categories', cats, ''],
  ].map(([l, v, cls]) => `<div class="card ${cls}"><div class="label">${l}</div><div class="val">${v}</div></div>`).join('');
}

function renderItems() {
  const q = (document.getElementById('filter-search').value || '').toLowerCase();
  const fCat = document.getElementById('filter-cat').value;
  const fStock = document.getElementById('filter-stock').value;
  const rows = state.items.filter(i => {
    if (fCat && i.category !== fCat) return false;
    if (fStock === 'low' && !(i.reorder_threshold && i.current_qty <= i.reorder_threshold && i.status === 'active')) return false;
    if (fStock === 'ok' && !(i.status === 'active' && i.current_qty > 0 && (!i.reorder_threshold || i.current_qty > i.reorder_threshold))) return false;
    if (fStock === 'used_up' && i.status !== 'used_up') return false;
    if (q) {
      const hay = ((i.name||'') + ' ' + (i.brand||'') + ' ' + (i.notes||'') + ' ' + (i.location||'')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const tbody = document.querySelector('#items-table tbody');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--gray-600)">No items match — try clearing filters or add one.</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(i => {
    const low = i.reorder_threshold && i.current_qty <= i.reorder_threshold && i.status === 'active';
    const stockPill = low ? '<span class="pill pill-low">low</span>' : (i.status === 'used_up' ? '<span class="pill pill-low">used up</span>' : '<span class="pill pill-ok">ok</span>');
    return `<tr data-open-item="${escapeHtml(i.id)}">
      <td><strong>${escapeHtml(i.name||'')}</strong>${i.brand ? '<div style="font-size:0.74rem;color:var(--gray-600)">'+escapeHtml(i.brand)+'</div>' : ''}</td>
      <td><span class="pill pill-cat">${escapeHtml((i.category||'').replace(/_/g,' '))}</span></td>
      <td>${stockPill} ${i.current_qty != null ? (i.current_qty + ' ' + escapeHtml(i.units||'')) : '—'}</td>
      <td>${i.reorder_threshold ? i.reorder_threshold + ' ' + escapeHtml(i.units||'') : '—'}</td>
      <td>${escapeHtml(i.location||'—')}</td>
      <td>${(i.last_purchased||'—').slice(0,10)}</td>
      <td><button class="btn-ghost btn-sm" data-log-txn="${escapeHtml(i.id)}">Log</button></td>
    </tr>`;
  }).join('');
}

function openItemModal(id) {
  const i = id ? state.items.find(x => x.id === id) : null;
  document.getElementById('im-title').textContent = i ? 'Edit item' : 'Add inventory item';
  document.getElementById('im-id').value = i ? i.id : '';
  document.getElementById('im-name').value = i?.name || '';
  document.getElementById('im-brand').value = i?.brand || '';
  document.getElementById('im-cat').value = i?.category || 'seed';
  document.getElementById('im-status').value = i?.status || 'active';
  document.getElementById('im-qty').value = i?.current_qty ?? '';
  document.getElementById('im-units').value = i?.units || '';
  document.getElementById('im-reorder').value = i?.reorder_threshold ?? '';
  document.getElementById('im-loc').value = i?.location || '';
  document.getElementById('im-supplier').value = i?.supplier || '';
  document.getElementById('im-cost').value = i?.last_cost_cents ? (i.last_cost_cents / 100) : '';
  document.getElementById('im-purchased').value = i?.last_purchased ? i.last_purchased.slice(0,10) : '';
  document.getElementById('im-expires').value = i?.expires ? i.expires.slice(0,10) : '';
  document.getElementById('im-notes').value = i?.notes || '';
  document.getElementById('im-delete').style.display = i ? '' : 'none';
  document.getElementById('im-log-btn').style.display = i ? '' : 'none';
  document.getElementById('item-modal').classList.add('open');
}

async function saveItem() {
  const id = document.getElementById('im-id').value;
  const body = {
    name: document.getElementById('im-name').value.trim(),
    brand: document.getElementById('im-brand').value.trim(),
    category: document.getElementById('im-cat').value,
    status: document.getElementById('im-status').value,
    current_qty: parseFloat(document.getElementById('im-qty').value) || 0,
    units: document.getElementById('im-units').value.trim(),
    reorder_threshold: parseFloat(document.getElementById('im-reorder').value) || null,
    location: document.getElementById('im-loc').value.trim(),
    supplier: document.getElementById('im-supplier').value.trim(),
    last_cost_cents: Math.round((parseFloat(document.getElementById('im-cost').value) || 0) * 100) || null,
    last_purchased: document.getElementById('im-purchased').value || null,
    expires: document.getElementById('im-expires').value || null,
    notes: document.getElementById('im-notes').value.trim(),
  };
  if (!body.name) { toast('Name required'); return; }
  if (!id) body.created = new Date().toISOString();
  try {
    let r;
    if (id) r = await pb('PATCH', '/api/collections/inventory_items/records/' + id, body);
    else    r = await pb('POST',  '/api/collections/inventory_items/records', body);
    const idx = state.items.findIndex(x => x.id === r.id);
    if (idx >= 0) state.items[idx] = r; else state.items.push(r);
    closeModal('item-modal');
    renderAll();
    toast('Saved');
  } catch (err) { toast('Save failed: ' + err.message); }
}

async function deleteItem() {
  const id = document.getElementById('im-id').value;
  if (!id) return;
  if (!confirm('Delete this item and all its transactions?')) return;
  try {
    await pb('DELETE', '/api/collections/inventory_items/records/' + id);
    state.items = state.items.filter(x => x.id !== id);
    closeModal('item-modal');
    renderAll();
    toast('Deleted');
  } catch (err) { toast('Delete failed: ' + err.message); }
}

function openTxnFromItem() {
  const id = document.getElementById('im-id').value;
  if (!id) return;
  closeModal('item-modal');
  openTxnModal(id);
}

function openTxnModal(itemId) {
  const item = state.items.find(i => i.id === itemId);
  if (!item) return;
  state._txItem = item;
  state._txSign = '-';  // default "use"
  state._txType = 'use';
  document.getElementById('tx-id').value = '';
  document.getElementById('tx-item-id').value = itemId;
  document.getElementById('tx-item-name').textContent = item.name;
  document.getElementById('tx-current').textContent = (item.current_qty || 0) + ' ' + (item.units || '');
  document.getElementById('tx-date').value = new Date().toLocaleDateString('en-CA');
  document.getElementById('tx-qty').value = '';
  document.getElementById('tx-cost').value = '';
  document.getElementById('tx-notes').value = '';
  // Garden dropdown
  document.getElementById('tx-garden').innerHTML = '<option value="">—</option>' +
    state.gardens.map(g => `<option value="${g.id}">${escapeHtml(g.name)}</option>`).join('');
  document.getElementById('tx-garden').value = '';
  // Chip state
  document.querySelectorAll('.qtx-chip').forEach(c => c.classList.toggle('active', c.dataset.tx === 'use'));
  document.getElementById('txn-modal').classList.add('open');
}

document.querySelectorAll('.qtx-chip').forEach(c => {
  c.addEventListener('click', () => {
    document.querySelectorAll('.qtx-chip').forEach(x => x.classList.remove('active'));
    c.classList.add('active');
    state._txType = c.dataset.tx;
    state._txSign = c.dataset.sign;
  });
});

let _txInFlight = false;
async function saveTxn() {
  const item = state._txItem;
  if (!item) return;
  if (_txInFlight) return;  // guard against double-submit
  const rawQty = parseFloat(document.getElementById('tx-qty').value);
  // Adjustments may legitimately set the quantity to 0; only +/- transactions
  // require a positive amount.
  if (isNaN(rawQty) || rawQty < 0) { toast('Enter a quantity (0 or more)'); return; }
  if (state._txSign !== '0' && rawQty <= 0) { toast('Quantity required'); return; }
  _txInFlight = true;
  try {
    // For an adjustment ("there are actually N"), compute the delta against the
    // AUTHORITATIVE current quantity (re-fetched), not the possibly-stale cache,
    // so the ledger doesn't bake in drift.
    let delta = rawQty;
    if (state._txSign === '-') delta = -rawQty;
    else if (state._txSign === '0') {
      let trueQty = item.current_qty || 0;
      try { const fresh = await pb('GET', '/api/collections/inventory_items/records/' + item.id); trueQty = fresh.current_qty || 0; } catch (_) {}
      delta = rawQty - trueQty;
    }
    const body = {
      item_id: item.id,
      transaction_type: state._txType,
      transaction_date: document.getElementById('tx-date').value,
      quantity_delta: delta,
      garden_id: document.getElementById('tx-garden').value || null,
      notes: document.getElementById('tx-notes').value.trim(),
      created: new Date().toISOString(),
    };
    // cost_cents is a purchase-only field; including it on use/gift/spoilage/etc.
    // rows pollutes cost reporting.
    if (state._txType === 'purchase') {
      body.cost_cents = Math.round((parseFloat(document.getElementById('tx-cost').value) || 0) * 100) || null;
    }
    const r = await pb('POST', '/api/collections/inventory_transactions/records', body);
    state.txns.unshift(r);
    // current_qty + status are now SERVER-DERIVED by the inventory-qty hook.
    // We only patch the non-derived purchase metadata, then re-fetch the item
    // to pick up the authoritative quantity.
    if (state._txType === 'purchase') {
      const updates = { last_purchased: body.transaction_date };
      if (body.cost_cents) updates.last_cost_cents = body.cost_cents;
      try { await pb('PATCH', '/api/collections/inventory_items/records/' + item.id, updates); } catch (_) {}
    }
    let updatedItem;
    try { updatedItem = await pb('GET', '/api/collections/inventory_items/records/' + item.id); }
    catch (_) { updatedItem = item; }
    const idx = state.items.findIndex(x => x.id === item.id);
    if (idx >= 0) state.items[idx] = updatedItem;
    closeModal('txn-modal');
    renderAll();
    toast('Transaction saved');
  } catch (err) { toast('Save failed: ' + err.message); }
  finally { _txInFlight = false; }
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.modal-overlay').forEach(o => o.addEventListener('click', e => { if (e.target === o) o.classList.remove('open'); }));

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2000);
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

['filter-search', 'filter-cat', 'filter-stock'].forEach(id => {
  document.getElementById(id).addEventListener('input', renderItems);
});

// Delegated row actions. Using data attributes + dataset reads avoids
// interpolating record ids into onclick JS strings.
document.querySelector('#items-table tbody').addEventListener('click', e => {
  const logBtn = e.target.closest('[data-log-txn]');
  if (logBtn) { e.stopPropagation(); openTxnModal(logBtn.dataset.logTxn); return; }
  const row = e.target.closest('[data-open-item]');
  if (row) openItemModal(row.dataset.openItem);
});

(function init() {
  if (tokenValid(PB_TOKEN)) boot();
  else document.getElementById('login-screen').style.display = 'flex';
})();
</script>
