function renderWeekStrip() {
  const grid = document.getElementById('week-grid');
  const dayNames = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  const today = new Date(); today.setHours(0,0,0,0);

  // Find Monday of current week
  const weekStart = new Date(viewDate);
  weekStart.setDate(weekStart.getDate() - ((weekStart.getDay() + 6) % 7));

  const bookings = getBookings().filter(b => b.status !== 'canceled');
  let html = '';

  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart);
    d.setDate(d.getDate() + i);
    const ds = formatDate(d);
    const isToday = d.getTime() === today.getTime();
    const isActive = d.getTime() === viewDate.getTime();

    const dayBookings = bookings.filter(b => b.date === ds);
    let dots = '';
    if (dayBookings.some(b => b.eventType === 'morning')) dots += '<span class="dot morning-dot"></span>';
    if (dayBookings.some(b => b.eventType === 'afternoon')) dots += '<span class="dot afternoon-dot"></span>';
    if (dayBookings.some(b => b.eventType === 'monday')) dots += '<span class="dot monday-dot"></span>';
    const dayBlocks = getBlocks().filter(b => b.date === ds);
    if (dayBlocks.length > 0) dots += '<span class="dot blocked-dot"></span>';

    let cls = 'week-day';
    if (isActive) cls += ' active';
    if (isToday) cls += ' today-marker';

    html += '<div class="' + cls + '" onclick="jumpToDate(\'' + ds + '\')">' +
      '<div class="dow">' + dayNames[d.getDay()] + '</div>' +
      '<div class="dom">' + d.getDate() + '</div>' +
      '<div class="dots">' + dots + '</div></div>';
  }
  grid.innerHTML = html;
}

function jumpToDate(ds) {
  const parts = ds.split('-');
  viewDate = new Date(parts[0], parts[1]-1, parts[2]);
  renderAll();
}

function goToday() {
  viewDate = new Date();
  viewDate.setHours(0,0,0,0);
  renderAll();
}

// --- Day view ---
function renderDay() {
  const container = document.getElementById('day-content');
  const ds = formatDate(viewDate);
  const bookings = getBookings().filter(b => b.date === ds && b.status !== 'canceled');
  const blocks = getBlocks().filter(b => b.date === ds);
  const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  const dateLabel = dayNames[viewDate.getDay()] + ', ' + monthNames[viewDate.getMonth()] + ' ' + viewDate.getDate();

  let html = '<div class="day-nav">' +
    '<button class="day-btn" onclick="prevDay()">&#8592;</button>' +
    '<h2>' + dateLabel + '</h2>' +
    '<button class="day-btn" onclick="nextDay()">&#8594;</button></div>';

  if (bookings.length === 0 && blocks.length === 0) {
    const dow = viewDate.getDay();
    if (dow === 0 || dow === 6) {
      html += '<div class="empty-day"><p>Weekend! Enjoy it.</p></div>';
    } else if (dow === 1) {
      html += '<div class="empty-day"><p>Ceramics morning. Open for garden work 1 to 4:30pm.</p></div>';
    } else {
      html += '<div class="empty-day"><p>Nothing booked yet. Wide open!</p></div>';
    }
  } else {
    html += '<div class="timeline">';

    // Sort by time
    const allItems = [];
    bookings.forEach(b => {
      const sortTime = b.eventType === 'morning' ? '09:00' :
                       b.eventType === 'monday' ? '13:00' :
                       b.eventType === 'afternoon' ? '14:30' : '17:00';
      allItems.push({ type: 'booking', data: b, sortTime });
    });
    blocks.forEach(b => {
      allItems.push({ type: 'block', data: b, sortTime: b.startTime || '00:00' });
    });
    allItems.sort((a, b) => a.sortTime.localeCompare(b.sortTime));

    allItems.forEach(item => {
      if (item.type === 'booking') {
        const b = item.data;
        html += '<div class="time-marker">' +
          '<span class="time-label">' + b.time + '</span>' +
          '<span class="time-dot" style="background: var(--' +
            (b.eventType === 'morning' ? 'pollen-gold' : b.eventType === 'afternoon' ? 'petal-pink' : 'spring-sage') +
          ')"></span>' +
          '<div class="booking-card ' + b.eventType + '">' +
          '<h3>' + b.clientName +
            (b.recurringSeriesId ? '<span class="series-badge">' + (b.recurringFrequency || 'recurring') + '</span>' : '') +
          '</h3>' +
          '<div class="booking-meta">' + EVENT_LABELS[b.eventType] + ' (' + EVENT_TIMES[b.eventType] + ')</div>' +
          '<div class="booking-client">' +
            (b.clientPhone ? b.clientPhone : '') +
            (b.clientAddress ? ' &middot; ' + b.clientAddress : '') +
          '</div>' +
          (b.gardenNotes ? '<div class="booking-meta" style="margin-top:6px;font-style:italic;">"' + b.gardenNotes + '"</div>' : '') +
          '<div class="booking-actions">' +
            '<button class="action-btn" onclick="callClient(\'' + (b.clientPhone || '') + '\')">Call</button>' +
            '<button class="action-btn" onclick="textClient(\'' + (b.clientPhone || '') + '\')">Text</button>' +
            '<button class="action-btn" onclick="openReschedule(\'' + b.id + '\')">Reschedule</button>' +
            '<button class="action-btn danger" onclick="cancelBooking(\'' + b.id + '\')">Cancel</button>' +
            (b.recurringSeriesId ? '<button class="action-btn danger" onclick="cancelSeries(\'' + b.recurringSeriesId + '\')">Cancel Series</button>' : '') +
          '</div></div></div>';
      } else {
        const b = item.data;
        html += '<div class="time-marker">' +
          '<span class="time-label">' + (b.allDay ? 'all day' : b.startTime) + '</span>' +
          '<span class="time-dot" style="background: var(--gray-400)"></span>' +
          '<div class="booking-card blocked">' +
          '<h3>Blocked: ' + (b.reason || 'Time off') + '</h3>' +
          '<div class="booking-meta">' + (b.allDay ? 'All day' : b.startTime + ' to ' + b.endTime) + '</div>' +

      }
    });

    html += '</div>';
  }

  container.innerHTML = html;

function nextDay() {

// --- Upcoming view ---
let monthViewDate = (() => { const d = new Date(); d.setDate(1); d.setHours(0,0,0,0); return d; })();

function prevMonth() { monthViewDate = new Date(monthViewDate.getFullYear(), monthViewDate.getMonth() - 1, 1); renderMonth(); }
function nextMonth() { monthViewDate = new Date(monthViewDate.getFullYear(), monthViewDate.getMonth() + 1, 1); renderMonth(); }

function renderMonth() {
  const container = document.getElementById('month-content');
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const y = monthViewDate.getFullYear();
  const m = monthViewDate.getMonth();
  const firstDay = new Date(y, m, 1);
  const lastDay = new Date(y, m + 1, 0);
  const startPad = firstDay.getDay();
  const totalDays = lastDay.getDate();
  const today = formatDate(new Date());

  const bookings = getBookings().filter(b => b.status !== 'canceled' && (b.date || '').startsWith(y + '-' + String(m+1).padStart(2,'0')));
  const blocks = getBlocks().filter(b => (b.date || '').startsWith(y + '-' + String(m+1).padStart(2,'0')));

  let html = '<div class="month-nav">' +
    '<button class="day-btn" onclick="prevMonth()">&#8592;</button>' +
    '<h2>' + monthNames[m] + ' ' + y + '</h2>' +
    '<button class="day-btn" onclick="nextMonth()">&#8594;</button></div>';

  html += '<div class="month-grid">';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => { html += '<div class="month-dow">' + d + '</div>'; });

  for (let i = 0; i < startPad; i++) html += '<div class="month-cell empty"></div>';

  for (let d = 1; d <= totalDays; d++) {
    const ds = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    const dayBookings = bookings.filter(b => b.date === ds);
    const dayBlocks = blocks.filter(b => b.date === ds);
    const isToday = ds === today;

    let cell = '<div class="month-cell' + (isToday ? ' today' : '') + '" onclick="jumpToDay(\'' + ds + '\')">';
    cell += '<div class="mc-num">' + d + '</div>';

    const maxShow = 2;
    const items = [];
    dayBookings.forEach(b => {
      const type = b.eventType || 'afternoon';
      const label = (b.clientName || '').split(' ')[0] || '·';
      items.push({cls: type, label: label});
    });
    dayBlocks.forEach(b => items.push({cls: 'blocked', label: b.reason || 'Blocked'}));

    items.slice(0, maxShow).forEach(it => {
      cell += '<div class="mc-evt ' + it.cls + '">' + escapeHtml(it.label) + '</div>';
    });
    if (items.length > maxShow) {
      cell += '<div class="mc-more">+' + (items.length - maxShow) + ' more</div>';
    }
    cell += '</div>';
    html += cell;
  }
  html += '</div>';

  container.innerHTML = html;
}

function jumpToDay(ds) {
  const [y, m, d] = ds.split('-').map(Number);
  viewDate = new Date(y, m - 1, d);
  viewDate.setHours(0,0,0,0);

  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// --- Moon-day conflict handling (moved from /moon) ---
// Recurring bookings that fall on moon-day auto-blocks:
//   - within 7 days: auto-cancel, set canceled_by='moon-auto'
//   - beyond 7 days: show as pending so Taya can Keep if she wants
// Keep flips moon_exempt=true and un-cancels if needed.
const MOON_AUTO_BLOCK_TAG = 'moon-auto-block';
const MOON_CONFLICT_BUFFER_DAYS = 7;
let moonConflicts = [];

async function syncMoonConflicts() {
  if (!PB_TOKEN) return;
  try {
    const today = formatDate(new Date());
    const bufferEnd = formatDate(new Date(Date.now() + MOON_CONFLICT_BUFFER_DAYS * 86400000));

    // Moon-block dates (future only)
    const filter = encodeURIComponent('reason = "' + MOON_AUTO_BLOCK_TAG + '"');
    const blocksResp = await fetch(PB_URL + '/api/collections/blocked_times/records?filter=' + filter + '&perPage=500', {
      headers: { 'Authorization': 'Bearer ' + PB_TOKEN },
    });
    if (!blocksResp.ok) throw new Error('blocks ' + blocksResp.status);
    const blocksData = await blocksResp.json();
    const moonDates = new Set((blocksData.items || []).map(b => (b.date || '').slice(0, 10)));

    // Future bookings
    const bkFilter = encodeURIComponent('date >= "' + today + '"');
    const bkResp = await fetch(PB_URL + '/api/collections/bookings/records?filter=' + bkFilter + '&perPage=500&sort=date', {
      headers: { 'Authorization': 'Bearer ' + PB_TOKEN },
    });
    if (!bkResp.ok) throw new Error('bookings ' + bkResp.status);
    const bkData = await bkResp.json();
    const future = (bkData.items || []).map(b => ({
      id: b.id,
      date: (b.date || '').slice(0, 10),
      time: b.time,
      clientName: b.client_name || 'Client',
      status: b.status,
      canceledBy: b.canceled_by,
      moonExempt: !!b.moon_exempt,
      isRecurring: !!b.recurring_series_id,
    }));

    moonConflicts = [];
    for (const b of future) {
      if (!moonDates.has(b.date)) continue;
      const withinBuffer = b.date <= bufferEnd;
      if (b.moonExempt) {
        moonConflicts.push({ booking: b, withinBuffer, isAutoCancelled: false, kept: true });
        continue;
      }
      if (withinBuffer && b.status !== 'canceled') {
        // Auto-cancel
        await fetch(PB_URL + '/api/collections/bookings/records/' + b.id, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + PB_TOKEN },
          body: JSON.stringify({
            status: 'canceled',
            canceled_by: 'moon-auto',
            canceled_at: new Date().toISOString(),
          }),
        });
        b.status = 'canceled';
        b.canceledBy = 'moon-auto';
      }
      moonConflicts.push({
        booking: b,
        withinBuffer,
        isAutoCancelled: b.canceledBy === 'moon-auto' && b.status === 'canceled',
        kept: false,
      });
    }
    renderMoonConflicts();
  } catch (e) {
    console.log('moon conflict sync error:', e);
  }
}

function renderMoonConflicts() {
  const card = document.getElementById('moon-conflicts-card');
  const list = document.getElementById('moon-conflicts-list');
  if (!card || !list) return;
  if (!moonConflicts.length) { card.style.display = 'none'; return; }
  card.style.display = 'block';
  list.innerHTML = moonConflicts.map(c => {
    const b = c.booking;
    const stateLabel = c.kept
      ? '<span style="color:var(--sage);font-size:0.8rem;">kept (you overrode)</span>'
      : c.isAutoCancelled
        ? '<span style="color:var(--red);font-size:0.8rem;">auto-cancelled</span>'
        : (c.withinBuffer
            ? '<span style="color:var(--red);font-size:0.8rem;">cancelling now...</span>'
            : '<span style="color:var(--gray-600);font-size:0.8rem;">pending (auto-cancels 7 days before)</span>');
    const keepBtn = c.kept
      ? '<button class="action-btn danger" onclick="releaseMoonKeep(\'' + b.id + '\')" style="font-size:0.8rem;">Undo keep</button>'
      : '<button class="action-btn" onclick="keepMoonBooking(\'' + b.id + '\')" style="font-size:0.8rem;">Keep</button>';
    const notCanceled = b.status !== 'canceled';
    const extraBtns =
      '<button class="action-btn" onclick="openReschedule(\'' + b.id + '\')" style="font-size:0.8rem;">Reschedule</button>' +
      (notCanceled ? '<button class="action-btn danger" onclick="cancelBooking(\'' + b.id + '\')" style="font-size:0.8rem;">Cancel</button>' : '');
    return '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--gray-100);">' +
      '<div style="flex:1;min-width:0;">' +
        '<div style="font-weight:600;">' + escapeHtml(b.date) + ' ' + escapeHtml(b.time || '') + ' &middot; ' + escapeHtml(b.clientName) + (b.isRecurring ? ' (recurring)' : '') + '</div>' +
        '<div>' + stateLabel + '</div>' +
      '</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;">' + keepBtn + extraBtns + '</div>' +
    '</div>';
  }).join('');
}

async function keepMoonBooking(bookingId) {
  try {
    await fetch(PB_URL + '/api/collections/bookings/records/' + bookingId, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + PB_TOKEN },
      body: JSON.stringify({
        status: 'confirmed',
        canceled_by: null,
        canceled_at: null,
        moon_exempt: true,
      }),
    });
    await refreshData();
    renderAll();
  } catch (e) { alert('Keep failed: ' + e.message); }
}

async function releaseMoonKeep(bookingId) {
  if (!confirm('Undo keep - this booking will be auto-cancelled again if within 7 days.')) return;
  try {
    await fetch(PB_URL + '/api/collections/bookings/records/' + bookingId, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + PB_TOKEN },
      body: JSON.stringify({ moon_exempt: false }),
    });
    await syncMoonConflicts();
  } catch (e) { alert('Undo failed: ' + e.message); }
}

// --- Clients view ---
function renderClients() {
  const container = document.getElementById('clients-content');
  const bookings = getBookings().filter(b => b.status !== 'canceled');

  // Group by client email
  const clients = {};
  bookings.forEach(b => {
    const key = b.clientEmail || b.clientName;
    if (!clients[key]) {
      clients[key] = {
        name: b.clientName,
        email: b.clientEmail,
        phone: b.clientPhone,
        address: b.clientAddress,
        visits: 0,
        lastVisit: b.date
      };
    }
    clients[key].visits++;
    if (b.date > clients[key].lastVisit) clients[key].lastVisit = b.date;
    if (b.clientPhone && !clients[key].phone) clients[key].phone = b.clientPhone;
  });

  const sorted = Object.values(clients).sort((a, b) => b.visits - a.visits);

  if (sorted.length === 0) {
    container.innerHTML = '<div class="empty-day"><p>No clients yet. They\'ll show up here as bookings come in.</p></div>';
    return;
  }

  let html = '';
  sorted.forEach(c => {
    html += '<div class="booking-card" style="border-left-color: var(--plum);">' +
      '<h3>' + c.name + '</h3>' +
      '<div class="booking-meta">' + c.visits + ' visit' + (c.visits > 1 ? 's' : '') + ' &middot; Last: ' + c.lastVisit + '</div>' +
      '<div class="booking-client">' +
        (c.phone ? c.phone + ' ' : '') +
        (c.email ? c.email : '') +
      '</div>' +
      '<div class="booking-actions">' +
        (c.phone ? '<button class="action-btn" onclick="callClient(\'' + c.phone + '\')">Call</button>' +
        '<button class="action-btn" onclick="textClient(\'' + c.phone + '\')">Text</button>' : '') +
      '</div></div>';
  });
  container.innerHTML = html;
}

async function cancelBooking(id) {
  if (!confirm('Cancel this booking? The client won\'t be notified automatically, so you\'ll want to text them.')) return;
  try {
    await DB.updateBooking(id, { status: 'canceled' });
    await refreshData();
    renderAll();
  } catch (err) {
    alert('Could not cancel booking. Try again.');
  }
}

async function cancelSeries(seriesId) {
  const bookings = getBookings();
  const today = formatDate(new Date());
  const futureInSeries = bookings.filter(b =>
    b.recurringSeriesId === seriesId && b.status !== 'canceled' && b.date >= today
  );

  if (!confirm('Cancel all ' + futureInSeries.length + ' upcoming visits in this series? Past visits stay on record. You\'ll want to text the client.')) return;

  try {
    for (const b of futureInSeries) {
      await DB.updateBooking(b.id, { status: 'canceled' });
    }
    await refreshData();
    renderAll();
  } catch (err) {
    alert('Could not cancel series. Try again.');
  }
}

async function removeBlock(id) {
  if (!confirm('Remove this blocked time?')) return;
  try {
    await DB.removeBlock(id);
    await refreshData();
    renderAll();
  } catch (err) {
    alert('Could not remove block. Try again.');
  }
}

  const block = {
    id: 'blk_' + Date.now(),
    date: date,
    allDay: type === 'all',
    startTime: type === 'morning' ? '09:00' : type === 'afternoon' ? '14:30' : type === 'custom' ? document.getElementById('block-start').value : null,
    endTime: type === 'morning' ? '14:00' : type === 'afternoon' ? '16:30' : type === 'custom' ? document.getElementById('block-end').value : null,

  };

    await refreshData();

async function saveOBO() {
  const eventType = document.getElementById('obo-event').value;
  const date = document.getElementById('obo-date').value;
  const name = document.getElementById('obo-name').value.trim();
  const email = document.getElementById('obo-email').value.trim();
  const phone = document.getElementById('obo-phone').value.trim();
  const address = document.getElementById('obo-address').value.trim();
  const notes = document.getElementById('obo-notes').value.trim();
  const recurring = document.getElementById('obo-recurring').value;
  const weeks = parseInt(document.getElementById('obo-weeks').value) || 12;

  if (!date || !name) { alert('Need at least a date and client name.'); return; }

  const seriesId = recurring !== 'none' ? 'series_' + Date.now() : null;
  const interval = recurring === 'biweekly' ? 14 : 7;
  const count = recurring === 'none' ? 1 : weeks;

  let booked = 0;
  try {
    for (let i = 0; i < count; i++) {
      const d = new Date(date + 'T12:00:00');
      d.setDate(d.getDate() + (i * interval));
      const ds = formatDate(d);

      const booking = {
        id: 'b_' + Date.now() + '_' + i,
        eventType: eventType,
        eventName: EVENT_LABELS[eventType],
        date: ds,
        time: EVENT_TIME_SLOTS[eventType],
        clientName: name,
        clientEmail: email,
        clientPhone: phone,
        clientAddress: address,
        gardenNotes: notes,
        status: 'confirmed',
        createdAt: new Date().toISOString(),
        bookedBy: 'admin',
        recurringSeriesId: seriesId,
        recurringFrequency: recurring !== 'none' ? recurring : null
      };
      await DB.saveBooking(booking);
      booked++;
    }

    closeModal('modal-book');

    // Reset recurring fields
    document.getElementById('obo-recurring').value = 'none';
    document.getElementById('obo-weeks-group').style.display = 'none';

    if (booked > 1) {
      alert('Booked ' + name + ' for ' + booked + ' ' + recurring + ' visits starting ' + date + '.');
    }
    await refreshData();
    renderAll();
  } catch (err) {
    alert('Could not save booking. Try again.');
  }
}

// --- Reschedule ---
let rescheduleBookingId = null;

function openReschedule(id) {
  rescheduleBookingId = id;
  const bookings = getBookings();
  const b = bookings.find(x => x.id === id);
  if (!b) return;

  document.getElementById('reschedule-info').innerHTML =
    '<div style="padding:10px 0; margin-bottom:12px; border-bottom:1px solid var(--gray-200);">' +
    '<strong>' + b.clientName + '</strong><br>' +
    '<span style="color:var(--gray-600); font-size:0.9rem;">' + b.eventName + ' on ' + b.date + ' at ' + b.time + '</span></div>';

  document.getElementById('reschedule-date').value = b.date;
  document.getElementById('reschedule-slot').value = b.eventType;
  document.getElementById('modal-reschedule').classList.add('open');
}

async function confirmReschedule() {
  if (!rescheduleBookingId) return;
  const newDate = document.getElementById('reschedule-date').value;
  const newSlot = document.getElementById('reschedule-slot').value;
  if (!newDate) { alert('Pick a new date.'); return; }

  try {
    await DB.updateBooking(rescheduleBookingId, {
      date: newDate,
      eventType: newSlot,
      eventName: EVENT_LABELS[newSlot],
      time: EVENT_TIME_SLOTS[newSlot],
      status: 'confirmed',
      rescheduledAt: new Date().toISOString(),
    });
    closeModal('modal-reschedule');
    rescheduleBookingId = null;
    await refreshData();
    renderAll();
  } catch (err) {
    alert('Could not reschedule. Try again.');
  }
}

// --- Helpers ---
function formatDate(date) {
  return date.getFullYear() + '-' +
    String(date.getMonth() + 1).padStart(2, '0') + '-' +
    String(date.getDate()).padStart(2, '0');
}

function renderAll() {
  renderWeekStrip();
  renderDashboard();
  renderTomorrowBanner();
}

// --- Tomorrow's schedule banner ---
function renderTomorrowBanner() {
  const banner = document.getElementById('tomorrow-banner');
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  tomorrow.setHours(0,0,0,0);
  const ds = formatDate(tomorrow);
  const dow = tomorrow.getDay();

  const bookings = getBookings().filter(b => b.date === ds && b.status !== 'canceled');
  const blocks = getBlocks().filter(b => b.date === ds);

  // Don't show banner if it's Saturday evening (tomorrow = Sunday) or we're looking at a different day
  if (dow === 0 || dow === 6) {
    banner.style.display = 'none';
    return;
  }

  if (bookings.length === 0 && blocks.length === 0) {
    banner.style.display = 'block';
    banner.innerHTML = '<h3>Tomorrow</h3><div class="tomorrow-empty">Nothing booked. Wide open!</div>';
    return;
  }

  let html = '<h3>Tomorrow</h3>';

  blocks.forEach(b => {
    html += '<div class="tomorrow-item" style="color:var(--gray-600);">' +
      '<div>Blocked: ' + (b.reason || 'Time off') +
        ' (' + (b.allDay ? 'all day' : b.startTime + ' to ' + b.endTime) + ')</div>' +
      '<div class="tomorrow-item-actions">' +
        '<button class="action-btn danger" onclick="removeBlock(\'' + b.id + '\')">Remove</button>' +
      '</div>' +
    '</div>';
  });

  bookings.sort((a, b) => {
    const timeA = a.eventType === 'morning' ? '09:00' : a.eventType === 'monday' ? '13:00' : '14:30';
    const timeB = b.eventType === 'morning' ? '09:00' : b.eventType === 'monday' ? '13:00' : '14:30';
    return timeA.localeCompare(timeB);
  });

  bookings.forEach(b => {
    const phone = b.clientPhone || '';
    html += '<div class="tomorrow-item">' +
      '<div>' + b.time + ' ' + b.clientName + ' (' + EVENT_LABELS[b.eventType] + ')</div>' +
      '<div class="tomorrow-item-actions">' +
        (phone ? '<button class="action-btn" onclick="callClient(\'' + phone + '\')">Call</button>' : '') +
        (phone ? '<button class="action-btn" onclick="textClient(\'' + phone + '\')">Text</button>' : '') +
        '<button class="action-btn" onclick="openReschedule(\'' + b.id + '\')">Reschedule</button>' +
        '<button class="action-btn danger" onclick="cancelBooking(\'' + b.id + '\')">Cancel</button>' +
      '</div>' +
    '</div>';
  });

  banner.style.display = 'block';
  banner.innerHTML = html;
}

// --- Login ---
const ADMIN_PIN_HASH_KEY = 'gf_admin_pin';
const ADMIN_SESSION_KEY = 'gf_admin_session';

function isLoggedIn() {
  // If PocketBase is configured, check for auth token
  if (PB_URL && PB_TOKEN) return true;
  // For localStorage mode, check session (valid for 24 hours)
  const session = localStorage.getItem(ADMIN_SESSION_KEY);
  if (!session) return false;
  try {
    const s = JSON.parse(session);
    return s.expires > Date.now();
  } catch { return false; }
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-wrap').classList.add('visible');
  refreshData().then(() => renderAll());
}

function togglePinVisibility() {
  const input = document.getElementById('login-pin');
  const btn = document.getElementById('pin-toggle');
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '🙈';
    btn.setAttribute('aria-label', 'Hide PIN');
  } else {
    input.type = 'password';
    btn.textContent = '👁';
    btn.setAttribute('aria-label', 'Show PIN');
  }
}

async function doLogin() {
  const pin = document.getElementById('login-pin').value;
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-error');

  if (!pin) return;
  btn.disabled = true;
  err.style.display = 'none';

  if (PB_URL) {
    // Authenticate with PocketBase admin API
    try {
      const resp = await fetch(PB_URL + '/api/collections/_superusers/auth-with-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ identity: 'taya@gardenfaery.love', password: pin }),
      });
      if (!resp.ok) throw new Error('Auth failed');
      const data = await resp.json();
      PB_TOKEN = data.token;
      showApp();
      return;
    } catch (e) {
      err.style.display = 'block';
      btn.disabled = false;
      return;
    }
  }

  // localStorage mode: first login sets the PIN, subsequent logins check it
  const storedHash = localStorage.getItem(ADMIN_PIN_HASH_KEY);
  const pinHash = await hashPin(pin);

  if (!storedHash) {
    // First time: set the PIN
    localStorage.setItem(ADMIN_PIN_HASH_KEY, pinHash);
    localStorage.setItem(ADMIN_SESSION_KEY, JSON.stringify({ expires: Date.now() + 86400000 }));
    showApp();
  } else if (pinHash === storedHash) {
    localStorage.setItem(ADMIN_SESSION_KEY, JSON.stringify({ expires: Date.now() + 86400000 }));
    showApp();
  } else {
    err.style.display = 'block';
    btn.disabled = false;
  }
}

async function hashPin(pin) {
  // Simple hash using SubtleCrypto (SHA-256)
  const encoder = new TextEncoder();
  const data = encoder.encode('gf_salt_' + pin);
  const hash = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// Allow Enter key to submit
document.getElementById('login-pin').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});

// --- Init ---
if (isLoggedIn()) {
  showApp();
} else {
  document.getElementById('login-screen').style.display = 'flex';
}
</script>
