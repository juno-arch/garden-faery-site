<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookings | Garden Faery Admin</title>
<link rel="apple-touch-icon" href="/icon-admin.png">
<link rel="icon" type="image/png" href="/icon-admin.png">
<meta name="apple-mobile-web-app-title" content="Admin">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
body {
  font-family: 'Nunito', sans-serif;
  background: var(--cream);
  color: var(--plum);
  min-height: 100vh;
  padding-bottom: 80px;
}
h1, h2, h3 { font-family: 'Lora', serif; font-weight: 400; }

.container { max-width: 520px; margin: 0 auto; padding: 16px; }

/* Top bar */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 0;
  margin-bottom: 8px;
}
.top-bar h1 { font-size: 1.5rem; }

/* Tabs */
.tabs {
  display: flex;
  gap: 4px;
  background: var(--gray-100);
  border-radius: 10px;
  padding: 4px;
  margin-bottom: 16px;
  overflow-x: auto;
}
.tab {
  flex: 1;
  padding: 10px 8px;
  border: none;
  border-radius: 8px;
  background: none;
  font-family: 'Nunito', sans-serif;
  font-weight: 600;
  font-size: 0.85rem;
  color: var(--gray-600);
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
  text-align: center;
}
.tab.active { background: var(--white); color: var(--plum); box-shadow: var(--shadow); }

/* Day view */
.day-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.day-nav h2 {
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 1.1rem;
}
.day-btn {
  background: none;
  border: none;
  font-size: 1.2rem;
  cursor: pointer;
  color: var(--plum);
  padding: 6px 12px;
  border-radius: 8px;
}
.day-btn:hover { background: var(--gray-100); }
.today-btn {
  padding: 6px 14px;
  border-radius: 8px;
  border: 2px solid var(--gray-200);
  background: var(--white);
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 0.8rem;
  color: var(--plum);
  cursor: pointer;
}
.today-btn:hover { border-color: var(--spring-sage); }

/* Timeline */
.timeline {
  position: relative;
  margin-left: 54px;
  border-left: 2px solid var(--gray-200);
  padding-left: 16px;
  min-height: 300px;
}
.time-marker {
  position: relative;
  padding: 4px 0 28px;
}
.time-label {
  position: absolute;
  left: -70px;
  top: 2px;
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--gray-400);
  width: 48px;
  text-align: right;
}
.time-dot {
  position: absolute;
  left: -23px;
  top: 7px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--gray-200);
}

/* Booking card */
.booking-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 14px;
  box-shadow: var(--shadow);
  margin-bottom: 8px;
  border-left: 4px solid var(--spring-sage);
  position: relative;
}
.booking-card.morning { border-left-color: var(--pollen-gold); }
.booking-card.afternoon { border-left-color: var(--petal-pink); }
.booking-card.monday { border-left-color: var(--spring-sage); }
.booking-card.blocked { border-left-color: var(--gray-400); background: var(--gray-100); }
.series-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.7rem;
  font-weight: 700;
  background: var(--petal-pink-light);
  color: var(--plum);
  margin-left: 6px;
}

.booking-card h3 {
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 1rem;
  margin-bottom: 2px;
}
.booking-meta {
  font-size: 0.85rem;
  color: var(--gray-600);
  margin-bottom: 8px;
}
.booking-client {
  font-size: 0.9rem;
  display: flex;
  align-items: center;
  gap: 6px;
}
.booking-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}
.action-btn {
  padding: 6px 14px;
  border-radius: 6px;
  border: 1px solid var(--gray-200);
  background: var(--white);
  font-family: 'Nunito', sans-serif;
  font-weight: 600;
  font-size: 0.8rem;
  color: var(--plum);
  cursor: pointer;
  transition: all 0.15s;
}
.action-btn:hover { border-color: var(--spring-sage); }
.action-btn.danger { color: var(--red); border-color: var(--red-light); }
.action-btn.danger:hover { background: var(--red-light); }

/* Empty state */
.empty-day {
  text-align: center;
  padding: 40px 20px;
  color: var(--gray-400);
}


/* Week view */
.week-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  margin-bottom: 16px;
}
.week-day {
  text-align: center;
  padding: 8px 4px;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.15s;
}
.week-day:hover { background: var(--gray-100); }
.week-day.active { background: var(--sage-light); }
.week-day.today-marker { box-shadow: inset 0 0 0 2px var(--pollen-gold); }
.week-day .dow { font-size: 0.7rem; font-weight: 700; color: var(--gray-400); }
.week-day .dom { font-size: 1.1rem; font-weight: 700; }
.week-day .dots { min-height: 8px; margin-top: 4px; display: flex; justify-content: center; gap: 3px; }
.week-day .dot { width: 6px; height: 6px; border-radius: 50%; }
.dot.morning-dot { background: var(--pollen-gold); }
.dot.afternoon-dot { background: var(--petal-pink); }
.dot.monday-dot { background: var(--spring-sage); }
.dot.blocked-dot { background: var(--gray-400); }

/* Block time modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 100;
  align-items: flex-end;
  justify-content: center;
}
.modal-overlay.open { display: flex; }

/* Receipt thumbnail + lightbox */
.receipt-thumb {
  width: 40px;
  height: 40px;
  border-radius: 6px;
  object-fit: cover;
  cursor: zoom-in;
  border: 1px solid var(--gray-200);
  flex-shrink: 0;
  background: var(--gray-100);
  transition: transform 0.15s;
}
.receipt-thumb:hover { transform: scale(1.05); }
.receipt-lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  z-index: 200;
  align-items: center;
  justify-content: center;
  cursor: zoom-out;
  padding: 20px;
}
.receipt-lightbox.open { display: flex; }
.receipt-lightbox img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 8px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}
.receipt-lightbox-close {
  position: absolute;
  top: 16px;
  right: 20px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.15);
  color: white;
  font-size: 24px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.receipt-lightbox-close:hover { background: rgba(255,255,255,0.25); }
.modal {
  background: var(--white);
  border-radius: 16px 16px 0 0;
  padding: 24px 20px;
  width: 100%;
  max-width: 520px;
  max-height: 80vh;
  overflow-y: auto;
}
.modal h2 {
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 1.1rem;
  margin-bottom: 16px;
}
.modal .form-group { margin-bottom: 14px; }
.modal label {
  display: block;
  font-weight: 700;
  font-size: 0.85rem;
  margin-bottom: 6px;
}
.modal input, .modal select, .modal textarea {
  width: 100%;
  padding: 10px 12px;
  border: 2px solid var(--gray-200);
  border-radius: 8px;
  font-family: 'Nunito', sans-serif;
  font-size: 0.9rem;
  color: var(--plum);
}
.modal input:focus, .modal select:focus, .modal textarea:focus {
  outline: none;
  border-color: var(--spring-sage);
}
.modal-actions {
  display: flex;
  gap: 8px;
  margin-top: 16px;
}
.modal-btn {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: none;
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 0.95rem;
  cursor: pointer;
}
.modal-btn.primary { background: var(--petal-pink); color: var(--white); }
.modal-btn.secondary { background: var(--gray-100); color: var(--plum); }

/* Bottom action bar */
.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--white);
  border-top: 1px solid var(--gray-200);
  padding: 10px 16px;
  display: flex;
  justify-content: center;
  gap: 12px;
  z-index: 50;
}
.fab {
  padding: 12px 20px;
  border-radius: 24px;
  border: none;
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
}
.fab-primary { background: var(--petal-pink); color: var(--white); }
.fab-secondary { background: var(--sage-light); color: var(--plum); }

/* Month view */
.month-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.month-nav h2 {
  font-size: 1.1rem;
  font-family: 'Lora', serif;
  color: var(--plum);
}
.month-nav .day-btn {
  background: var(--sage-light);
  color: var(--plum);
  border: none;
  width: 36px;
  height: 36px;
  border-radius: 10px;
  font-size: 1.1rem;
  cursor: pointer;
}
.month-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  background: var(--white);
  border-radius: var(--radius);
  padding: 8px;
  box-shadow: var(--shadow);
}
.month-dow {
  text-align: center;
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--gray-600);
  padding: 4px 0;
  letter-spacing: 0.5px;
}
.month-cell {
  min-height: 64px;
  padding: 4px;
  border-radius: 8px;
  background: var(--cream, #faf6ef);
  font-size: 0.75rem;
  color: var(--plum);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  border: 1px solid transparent;
  overflow: hidden;
}
.month-cell.empty { background: transparent; cursor: default; }
.month-cell.today { border-color: var(--spring-sage); background: var(--sage-light); }
.month-cell:not(.empty):hover { border-color: var(--spring-sage); }
.month-cell .mc-num {
  font-weight: 700;
  font-size: 0.85rem;
  margin-bottom: 2px;
}
.month-cell .mc-evt {
  background: var(--petal-pink);
  color: var(--white);
  border-radius: 4px;
  padding: 1px 4px;
  margin-bottom: 2px;
  font-size: 0.65rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.month-cell .mc-evt.morning { background: var(--spring-sage); }
.month-cell .mc-evt.afternoon { background: var(--petal-pink); }
.month-cell .mc-evt.monday { background: #b48ec2; }
.month-cell .mc-evt.blocked { background: var(--gray-400); }
.month-cell .mc-more {
  font-size: 0.6rem;
  color: var(--gray-600);
}
@media (max-width: 480px) {
  .month-cell { min-height: 52px; padding: 3px; font-size: 0.7rem; }
  .month-cell .mc-evt { font-size: 0.55rem; padding: 0 2px; }
  .month-cell .mc-num { font-size: 0.75rem; }
}

/* Login screen */
.login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.login-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 32px 28px;
  box-shadow: var(--shadow);
  width: 100%;
  max-width: 360px;
  text-align: center;
}
.login-card h1 {
  font-size: 1.6rem;
  margin-bottom: 4px;
}
.login-card p {
  color: var(--gray-600);
  font-size: 0.9rem;
  margin-bottom: 24px;
}
.login-card input {
  width: 100%;
  padding: 14px 48px 14px 16px;
  border: 2px solid var(--gray-200);
  border-radius: 10px;
  font-family: 'Nunito', sans-serif;
  font-size: 1rem;
  color: var(--plum);
  text-align: center;
  letter-spacing: 2px;
  margin-bottom: 16px;
  box-sizing: border-box;
}
.pin-wrap { position: relative; }
.pin-toggle {
  position: absolute;
  right: 8px;
  top: 10px;
  background: transparent;
  border: none;
  cursor: pointer;
  font-size: 1.2rem;
  padding: 6px 10px;
  color: var(--gray-600);
  line-height: 1;
}
.pin-toggle:hover { color: var(--plum); }
.login-card input:focus {
  outline: none;
  border-color: var(--spring-sage);
}
.login-card .login-btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: var(--petal-pink);
  color: var(--white);
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 1rem;
  cursor: pointer;
}
.login-card .login-btn:hover { opacity: 0.9; }
.login-card .login-btn:disabled {
  background: var(--gray-200);
  color: var(--gray-400);
  cursor: not-allowed;
}
.login-error {
  color: #a03020;
  font-size: 0.85rem;
  margin-top: 8px;
  display: none;
}
.app-wrap { display: none; }
.app-wrap.visible { display: block; }

/* Tomorrow banner */
.tomorrow-banner {
  background: var(--sage-light);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 16px;
}
.tomorrow-banner h3 {
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--plum);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.tomorrow-banner .tomorrow-item {
  font-size: 0.9rem;
  padding: 6px 0;
  color: var(--plum);
}
.tomorrow-banner .tomorrow-item + .tomorrow-item {
  border-top: 1px solid rgba(74, 41, 72, 0.08);
}
.tomorrow-banner .tomorrow-item-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 6px;
}
.tomorrow-banner .tomorrow-empty {
  font-size: 0.9rem;
  color: var(--gray-600);
  font-style: italic;
}

@media (max-width: 400px) {
  .container { padding: 12px; }
  .timeline { margin-left: 48px; }
  .time-label { left: -62px; width: 42px; font-size: 0.7rem; }
}
</style>
</head>
<body>

<!-- Login screen -->
<div class="login-screen" id="login-screen">
  <div class="login-card">
    <h1>Garden Faery</h1>
    <p>Enter your PIN to open the dashboard.</p>
    <div class="pin-wrap">
      <input type="password" id="login-pin" placeholder="PIN" maxlength="20" autocomplete="off">
      <button type="button" class="pin-toggle" id="pin-toggle" aria-label="Show PIN" onclick="togglePinVisibility()">👁</button>
    </div>
    <button class="login-btn" id="login-btn" onclick="doLogin()">Open Dashboard</button>
    <div class="login-error" id="login-error">Wrong PIN. Try again.</div>
  </div>
</div>

<!-- Main app (hidden until login) -->
<div class="app-wrap" id="app-wrap">
<div class="container">
  <div class="top-bar">
    <h1>My Bookings</h1>
    <button class="today-btn" onclick="goToday()">Today</button>
  </div>

  <!-- Tomorrow's schedule banner -->
  <div class="tomorrow-banner" id="tomorrow-banner" style="display:none;"></div>

  <!-- Week strip -->
  <div class="week-grid" id="week-grid"></div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-tab="dashboard" onclick="switchTab('dashboard')">📊</button>
    <button class="tab" data-tab="day" onclick="switchTab('day')">Day</button>
    <button class="tab" data-tab="month" onclick="switchTab('month')">Month</button>
    <button class="tab" data-tab="upcoming" onclick="switchTab('upcoming')">Upcoming</button>
    <button class="tab" data-tab="clients" onclick="switchTab('clients')">Clients</button>
    <button class="tab" data-tab="income" onclick="switchTab('income')">Income</button>
    <button class="tab" data-tab="expenses" onclick="switchTab('expenses')">Expenses</button>
    <button class="tab" data-tab="taxes" onclick="switchTab('taxes')">Taxes</button>
    <button class="tab" data-tab="settings" onclick="switchTab('settings')">⚙️</button>
  </div>

  <!-- Dashboard view -->
  <div class="tab-panel active" id="tab-dashboard">
    <div id="dashboard-content"></div>
  </div>

  <!-- Day view -->
  <div class="tab-panel" id="tab-day" style="display:none;">
    <div id="day-content"></div>
  </div>

  <!-- Month view -->
  <div class="tab-panel" id="tab-month" style="display:none;">
    <div id="month-content"></div>
  </div>

  <!-- Upcoming view -->
  <div class="tab-panel" id="tab-upcoming" style="display:none;">
    <div id="moon-conflicts-card" style="display:none; background:#fff; border:1px solid var(--gray-200); border-radius:12px; padding:16px; margin-bottom:16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <h3 style="margin:0;">🌙 Moon-day conflicts</h3>
        <button class="action-btn" onclick="syncMoonConflicts()" style="font-size:0.8rem;">Refresh</button>
      </div>
      <p style="font-size:0.85rem;color:var(--gray-600);margin-bottom:10px;">Bookings that land on moon-block days. Auto-cancel within 7 days. Tap Keep to override.</p>
      <div id="moon-conflicts-list"></div>
    </div>
    <div id="upcoming-content"></div>
  </div>

  <!-- Clients view -->
  <div class="tab-panel" id="tab-clients" style="display:none;">
    <div style="display:flex;justify-content:flex-end;margin-bottom:10px;">
      <button type="button"
              onclick="runNameCleanup()"
              style="background:none;border:1px solid var(--gray-200);color:var(--gray-600);font-family:'Nunito',sans-serif;font-size:0.8rem;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer;">
        Normalize names
      </button>
    </div>
    <div id="clients-content"></div>
  </div>

  <!-- Income view -->
  <div class="tab-panel" id="tab-income" style="display:none;">
    <div id="income-content"></div>
  </div>

  <!-- Expenses view -->
  <div class="tab-panel" id="tab-expenses" style="display:none;">
    <div id="expenses-content"></div>
  </div>

  <!-- Taxes view -->
  <div class="tab-panel" id="tab-taxes" style="display:none;">
    <div id="taxes-content"></div>
  </div>

  <!-- Settings view -->
  <div class="tab-panel" id="tab-settings" style="display:none;">
    <div id="settings-content"></div>
  </div>
</div>

<!-- Receipt lightbox (click a thumbnail to open) -->
<div class="receipt-lightbox" id="receipt-lightbox" onclick="closeReceiptLightbox()">
  <button class="receipt-lightbox-close" onclick="event.stopPropagation(); closeReceiptLightbox()" aria-label="Close">&times;</button>
  <img id="receipt-lightbox-img" src="" alt="Receipt">
</div>

<!-- Expense modal -->
<div class="modal-overlay" id="modal-expense">
  <div class="modal" style="max-height:90vh;overflow-y:auto;">
    <h2 id="exp-title">New expense</h2>
    <div style="margin-bottom:10px;">
      <button class="modal-btn secondary" style="width:100%;" onclick="document.getElementById('exp-photo').click()">
        📷 Scan a receipt
      </button>
      <input type="file" id="exp-photo" accept="image/*,application/pdf" style="display:none;" onchange="scanReceipt(this)">
      <div id="exp-scan-status" style="font-size:0.8rem;color:var(--gray-600);margin-top:4px;"></div>
    </div>
    <div class="form-group">
      <label>Date</label>
      <input type="date" id="exp-date">
    </div>
    <div class="form-group">
      <label>Amount ($)</label>
      <input type="number" id="exp-amount" step="0.01" min="0" placeholder="0.00">
    </div>
    <div class="form-group">
      <label>Vendor</label>
      <input type="text" id="exp-vendor" placeholder="Home Depot, Bloom Nursery, etc.">
    </div>
    <div class="form-group">
      <label>Category</label>
      <select id="exp-category">
        <option value="">-</option>
        <option value="plants">Plants</option>
        <option value="soil_amendments">Soil / Amendments</option>
        <option value="tools">Tools</option>
        <option value="equipment">Equipment</option>
        <option value="fuel">Fuel</option>
        <option value="vehicle">Vehicle</option>
        <option value="supplies">Supplies</option>
        <option value="marketing">Marketing</option>
        <option value="software">Software</option>
        <option value="professional_services">Professional Services</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="form-group" style="display:flex;gap:8px;align-items:flex-end;">
      <div style="flex:1;">
        <label>Card / payment</label>
        <select id="exp-card" onchange="onExpCardChange()">
          <option value="">-</option>
          <optgroup label="Business">

<script>
// ============================================
// Garden Faery Admin Dashboard v2.0
// PocketBase backend with localStorage fallback
// ============================================

// --- PocketBase Config ---
const PB_URL = 'https://bookings.gardenfaery.love'; // production PocketBase instance
let PB_TOKEN = ''; // Set after admin login

// ============================================
// DATA LAYER
// ============================================
const DB = {
  _usePB: !!PB_URL,

  async _pb(method, path, body) {
    const opts = {
      method: method,
      headers: { 'Content-Type': 'application/json' },
    };
    if (PB_TOKEN) opts.headers['Authorization'] = 'Bearer ' + PB_TOKEN;
    if (body) opts.body = JSON.stringify(body);
    const resp = await fetch(PB_URL + '/api/collections/' + path, opts);
    if (!resp.ok) throw new Error('PocketBase error: ' + resp.status);
    return resp.json();
  },

  // --- Bookings ---
  async getBookings() {
    if (!this._usePB) {
      try { return JSON.parse(localStorage.getItem('gf_bookings_v1') || '[]'); }
      catch { return []; }
    }
    const data = await this._pb('GET', 'bookings/records?perPage=500&sort=-date');
    return (data.items || []).map(r => ({
      id: r.id,
      eventType: r.event_type,
      eventName: r.event_name,
      date: r.date,
      time: r.time,
      duration: r.duration,
      clientName: r.client_name,
      clientEmail: r.client_email,
      clientPhone: r.client_phone,
      clientAddress: r.client_address,
      gardenNotes: r.garden_notes,
      status: r.status,
      bookedBy: r.booked_by,
      rescheduledAt: r.rescheduled_at,
      canceledAt: r.canceled_at,
      canceledBy: r.canceled_by,
      recurringSeriesId: r.recurring_series_id,
      recurringFrequency: r.recurring_frequency,
      price: r.price,
      paid: r.paid,
      paymentMethod: r.payment_method,
      paidDate: r.paid_date,
      paymentNotes: r.payment_notes,
      createdAt: r.created,
    }));
  },

  async saveBooking(booking) {
    if (!this._usePB) {
      const bookings = await this.getBookings();
      bookings.push(booking);
      localStorage.setItem('gf_bookings_v1', JSON.stringify(bookings));
      return booking;
    }
    const data = await this._pb('POST', 'bookings/records', {
      event_type: booking.eventType,
      event_name: booking.eventName,
      date: booking.date,
      time: booking.time,
      duration: booking.duration,
      client_name: booking.clientName,
      client_email: booking.clientEmail,
      client_phone: booking.clientPhone,
      client_address: booking.clientAddress,
      garden_notes: booking.gardenNotes,
      status: booking.status || 'confirmed',
      booked_by: booking.bookedBy || 'admin',
      recurring_series_id: booking.recurringSeriesId || null,
      recurring_frequency: booking.recurringFrequency || null,
    });
    booking.id = data.id;
    return booking;
  },

  async saveBookings(bookings) {
    if (!this._usePB) {
      localStorage.setItem('gf_bookings_v1', JSON.stringify(bookings));
      return;
    }
    // For PocketBase, batch update each changed record
    for (const b of bookings) {
      if (b._dirty && b.id) {
        await this._pb('PATCH', 'bookings/records/' + b.id, {
          status: b.status,
          canceled_at: b.canceledAt,
        });
      }
    }
  },

  async updateBooking(id, updates) {
    if (!this._usePB) {
      const bookings = await this.getBookings();
      const idx = bookings.findIndex(b => b.id === id);
      if (idx >= 0) {
        Object.assign(bookings[idx], updates);
        localStorage.setItem('gf_bookings_v1', JSON.stringify(bookings));
      }
      return;
    }
    const pbUpdates = {};
    if (updates.date !== undefined) pbUpdates.date = updates.date;
    if (updates.eventType !== undefined) pbUpdates.event_type = updates.eventType;
    if (updates.eventName !== undefined) pbUpdates.event_name = updates.eventName;
    if (updates.time !== undefined) pbUpdates.time = updates.time;
    if (updates.status !== undefined) pbUpdates.status = updates.status;
    if (updates.rescheduledAt !== undefined) pbUpdates.rescheduled_at = updates.rescheduledAt;
    if (updates.price !== undefined) pbUpdates.price = updates.price;
    if (updates.paid !== undefined) pbUpdates.paid = updates.paid;
    if (updates.paymentMethod !== undefined) pbUpdates.payment_method = updates.paymentMethod;
    if (updates.paidDate !== undefined) pbUpdates.paid_date = updates.paidDate;
    if (updates.paymentNotes !== undefined) pbUpdates.payment_notes = updates.paymentNotes;
    if (updates.clientName !== undefined) pbUpdates.client_name = updates.clientName;
    if (updates.clientEmail !== undefined) pbUpdates.client_email = updates.clientEmail;
    if (updates.clientPhone !== undefined) pbUpdates.client_phone = updates.clientPhone;
    if (updates.clientAddress !== undefined) pbUpdates.client_address = updates.clientAddress;
    return this._pb('PATCH', 'bookings/records/' + id, pbUpdates);
  },

  // --- Blocked times ---
  async getBlocks() {
    if (!this._usePB) {
      try { return JSON.parse(localStorage.getItem('gf_blocks_v1') || '[]'); }
      catch { return []; }
    }
    const data = await this._pb('GET', 'blocked_times/records?perPage=500');
    return (data.items || []).map(r => ({
      id: r.id,
      date: r.date,
      allDay: r.all_day,
      startTime: r.start_time,
      endTime: r.end_time,
      reason: r.reason,
    }));
  },

  async saveBlock(block) {
    if (!this._usePB) {
      const blocks = await this.getBlocks();
      blocks.push(block);
      localStorage.setItem('gf_blocks_v1', JSON.stringify(blocks));
      return block;
    }
    const data = await this._pb('POST', 'blocked_times/records', {
      date: block.date,
      all_day: block.allDay,
      start_time: block.startTime,
      end_time: block.endTime,
      reason: block.reason,
    });
    block.id = data.id;
    return block;
  },

  async removeBlock(id) {
    if (!this._usePB) {
      const blocks = (await this.getBlocks()).filter(b => b.id !== id);
      localStorage.setItem('gf_blocks_v1', JSON.stringify(blocks));
      return;
    }
    await fetch(PB_URL + '/api/collections/blocked_times/records/' + id, {
      method: 'DELETE',
      headers: PB_TOKEN ? { 'Authorization': 'Bearer ' + PB_TOKEN } : {},
    });
  },
};

// --- Sync cache for rendering ---
let _cachedBookings = [];
let _cachedBlocks = [];

async function refreshData() {
  try {
    _cachedBookings = await DB.getBookings();
    _cachedBlocks = await DB.getBlocks();
  } catch (err) {
    console.log('Data refresh error:', err);
  }
}

function getBookings() { return _cachedBookings; }
function getBlocks() { return _cachedBlocks; }

const EVENT_LABELS = {
  morning: 'Morning Garden Care',
  afternoon: 'Afternoon Garden Care',
  monday: 'Monday After Ceramics'
};
const EVENT_TIMES = {
  morning: '9:00am to 2:00pm',
  afternoon: '2:30pm to 4:30pm',
  monday: '1:00pm to 4:30pm'
};
const EVENT_TIME_SLOTS = {
  morning: '9:00am',
  afternoon: '2:30pm',
  monday: '1:00pm'
};

let viewDate = new Date();
viewDate.setHours(0,0,0,0);

// --- Tab switching ---
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.tab-panel').forEach(p => p.style.display = 'none');
  document.getElementById('tab-' + tab).style.display = 'block';
  if (tab === 'dashboard') renderDashboard();
  if (tab === 'day') renderDay();
  if (tab === 'month') renderMonth();
  if (tab === 'upcoming') renderUpcoming();
  if (tab === 'clients') renderClients();
  if (tab === 'income') renderIncome();
  if (tab === 'expenses') renderExpenses();
  if (tab === 'taxes') renderTaxes();
  if (tab === 'settings') renderSettings();
}

// --- Dashboard (Tier 1 widgets) ---
// Tax reserve % — editable via localStorage, default 27% (covers SE tax + federal + small CA)
function getTaxReservePct() {
  const v = parseFloat(localStorage.getItem('gf_tax_reserve_pct'));
  return (v > 0 && v < 1) ? v : 0.27;
}
function setTaxReservePct(pct) {
  const v = parseFloat(pct);
  if (v > 0 && v < 1) localStorage.setItem('gf_tax_reserve_pct', String(v));
  renderDashboard();
}

async function renderDashboard() {
  await loadExpenses();
  const el = document.getElementById('dashboard-content');
  if (!el) return;

  const bookings = getBookings().filter(b => b.status !== 'canceled');
  const expenses = _cachedExpenses || [];
  const today = formatDate(new Date());
  const year = today.slice(0,4);
  const todayDate = new Date(today + 'T00:00:00');

  // --- YTD totals ---
  const ytdBookings = bookings.filter(b => (b.date||'').startsWith(year) && (b.date||'') <= today);
  const ytdGross = ytdBookings.reduce((s,b) => s + (Number(b.price)||0), 0);
  const ytdPaid  = ytdBookings.filter(b => b.paid).reduce((s,b) => s + (Number(b.price)||0), 0);
  const ytdExpensesBiz = expenses.filter(e => (e.date||'').startsWith(year) && e.onBiz).reduce((s,e) => s + e.amount, 0);
  const ytdNet = ytdGross - ytdExpensesBiz;
  const taxPct = getTaxReservePct();
  const ytdTaxReserve = Math.max(0, ytdNet) * taxPct;

  // --- Outstanding (overdue unpaid, any month) ---
  const overdue = bookings.filter(b => (b.date||'') < today && !b.paid && (Number(b.price)||0) > 0);
  const overdueTotal = overdue.reduce((s,b) => s + (Number(b.price)||0), 0);
  const overdueCount = overdue.length;
  const overdueClients = new Set(overdue.map(b => b.clientEmail || b.clientName)).size;

  // --- Next 30 days projection ---
  const next30End = new Date(todayDate); next30End.setDate(next30End.getDate() + 30);
  const next30EndStr = formatDate(next30End);
  const upcoming = bookings.filter(b => (b.date||'') >= today && (b.date||'') <= next30EndStr);
  const next30Projected = upcoming.reduce((s,b) => s + (Number(b.price)||0), 0);
  const next30Count = upcoming.length;

  // --- 12-month revenue (last 12 including current) ---
  const months = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(todayDate.getFullYear(), todayDate.getMonth() - i, 1);
    months.push({ key: d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'), label: d.toLocaleString('en-US',{month:'short'}), year: d.getFullYear() });
  }
  const monthBuckets = months.map(m => {
    const bs = bookings.filter(b => (b.date||'').slice(0,7) === m.key);
    const paid = bs.filter(b => b.paid).reduce((s,b) => s + (Number(b.price)||0), 0);
    const outstanding = bs.filter(b => !b.paid).reduce((s,b) => s + (Number(b.price)||0), 0);
    return { ...m, paid, outstanding, total: paid + outstanding };
  });
  const maxMonth = Math.max(1, ...monthBuckets.map(m => m.total));

  // --- Top 5 clients YTD ---
  const clientTotals = {};
  ytdBookings.forEach(b => {
    const key = b.clientEmail || b.clientName || 'unknown';
    if (!clientTotals[key]) clientTotals[key] = { name: b.clientName || 'Unknown', email: b.clientEmail || '', gross: 0, visits: 0 };
    clientTotals[key].gross += Number(b.price)||0;
    clientTotals[key].visits += 1;
  });
  const topClients = Object.values(clientTotals).sort((a,b) => b.gross - a.gross).slice(0, 5);

  // --- Render ---
  const fmt = n => '$' + Math.round(n).toLocaleString();
  const netColor = ytdNet >= 0 ? '#6b8f52' : 'var(--red)';

  let html = '';

  // 1. YTD snapshot row
  html += `
    <div style="background:var(--white);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;">
        <h3 style="margin:0;font-size:1rem;">${year} Year-to-Date</h3>
        <span style="font-size:0.75rem;color:var(--gray-600);">as of ${today}</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;">
        <div>
          <div style="font-size:0.7rem;color:var(--gray-600);">Gross</div>
          <div style="font-size:1.15rem;font-weight:700;color:#6b8f52;">${fmt(ytdGross)}</div>
          <div style="font-size:0.68rem;color:var(--gray-400);">${fmt(ytdPaid)} paid</div>
        </div>
        <div>
          <div style="font-size:0.7rem;color:var(--gray-600);">Biz Expenses</div>
          <div style="font-size:1.15rem;font-weight:700;color:var(--red);">${fmt(ytdExpensesBiz)}</div>
          <div style="font-size:0.68rem;color:var(--gray-400);">deductible</div>
        </div>
        <div>
          <div style="font-size:0.7rem;color:var(--gray-600);">Net</div>
          <div style="font-size:1.15rem;font-weight:700;color:${netColor};">${fmt(ytdNet)}</div>
          <div style="font-size:0.68rem;color:var(--gray-400);">gross − biz</div>
        </div>
        <div>
          <div style="font-size:0.7rem;color:var(--gray-600);">Tax Reserve</div>
          <div style="font-size:1.15rem;font-weight:700;color:#c48bb0;">${fmt(ytdTaxReserve)}</div>
          <div style="font-size:0.68rem;color:var(--gray-400);">
            <input type="number" min="10" max="50" step="1" value="${Math.round(taxPct*100)}" onchange="setTaxReservePct(this.value/100)" style="width:36px;padding:1px 2px;font-size:0.68rem;border:1px solid var(--gray-200);border-radius:4px;">% of net
          </div>
        </div>
      </div>
    </div>
  `;

  // 2. 12-month revenue chart
  html += `
    <div style="background:var(--white);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;">
        <h3 style="margin:0;font-size:1rem;">Last 12 Months</h3>
        <span style="font-size:0.75rem;color:var(--gray-600);"><span style="display:inline-block;width:10px;height:10px;background:#6b8f52;border-radius:2px;vertical-align:middle;margin-right:4px;"></span>paid <span style="display:inline-block;width:10px;height:10px;background:#e8b828;border-radius:2px;vertical-align:middle;margin-right:4px;margin-left:10px;"></span>unpaid</span>
      </div>
      <div style="display:flex;align-items:stretch;gap:6px;height:140px;padding:0 4px;border-bottom:1px solid var(--gray-200);">
  `;
  monthBuckets.forEach(m => {
    const totalPct = maxMonth > 0 ? (m.total / maxMonth) * 100 : 0;
    const paidPct = m.total > 0 ? (m.paid / m.total) * 100 : 0;
    const outstandPct = 100 - paidPct;
    html += `
        <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;min-width:0;">
          <div title="${m.label} ${m.year}: ${fmt(m.paid)} paid + ${fmt(m.outstanding)} unpaid = ${fmt(m.total)}" style="width:100%;height:${totalPct}%;min-height:${m.total>0?'2px':'0'};display:flex;flex-direction:column;justify-content:flex-end;border-radius:3px 3px 0 0;overflow:hidden;">
            <div style="background:#e8b828;height:${outstandPct}%;min-height:${m.outstanding>0?'2px':'0'};"></div>
            <div style="background:#6b8f52;height:${paidPct}%;min-height:${m.paid>0?'2px':'0'};"></div>
          </div>
        </div>
    `;
  });
  html += `</div><div style="display:flex;gap:6px;padding:4px 4px 0;">`;
  monthBuckets.forEach(m => {
    html += `<div style="flex:1;text-align:center;font-size:0.65rem;color:var(--gray-600);">${m.label}</div>`;
  });
  html += `</div></div>`;

  // 3. Outstanding balance card
  html += `
    <div style="background:${overdueTotal>0?'#fff4e5':'var(--white)'};border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);border:${overdueTotal>0?'1px solid #e8b828':'none'};">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <h3 style="margin:0 0 2px;font-size:1rem;">${overdueTotal > 0 ? '💰 You\'re owed' : 'All paid up'}</h3>
          <div style="font-size:0.8rem;color:var(--gray-600);">
            ${overdueTotal > 0
              ? `${overdueCount} past visit${overdueCount===1?'':'s'} across ${overdueClients} client${overdueClients===1?'':'s'}`
              : 'No overdue balances — nice work.'}
          </div>
        </div>
        <div>
          <div style="font-size:1.4rem;font-weight:700;color:${overdueTotal>0?'#c48bb0':'#6b8f52'};text-align:right;">${fmt(overdueTotal)}</div>
          ${overdueTotal > 0 ? '<button class="modal-btn secondary" style="padding:4px 10px;font-size:0.8rem;margin-top:4px;" onclick="switchTab(\'income\')">See list →</button>' : ''}
        </div>
      </div>
    </div>
  `;

  // 4. Next 30 days projection
  html += `
    <div style="background:var(--white);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <h3 style="margin:0 0 2px;font-size:1rem;">Next 30 days</h3>
          <div style="font-size:0.8rem;color:var(--gray-600);">
            ${next30Count} booking${next30Count===1?'':'s'} scheduled ${next30Count>0?'· expected revenue':''}
          </div>
        </div>
        <div style="font-size:1.4rem;font-weight:700;color:#6b8f52;text-align:right;">${fmt(next30Projected)}</div>
      </div>
    </div>
  `;

  // 6-7. Service mix pie + Expense donut (side-by-side on wider screens)
  // Service mix: aggregate YTD revenue by event type
  const SVC_COLORS = { morning: '#e8b828', afternoon: '#c48bb0', monday: '#a3b88c', other: '#a89e96' };
  const SVC_LABELS = { morning: 'Morning', afternoon: 'Afternoon', monday: 'Monday', other: 'Other' };
  const svcTotals = { morning: 0, afternoon: 0, monday: 0, other: 0 };
  ytdBookings.forEach(b => {
    const k = svcTotals.hasOwnProperty(b.eventType) ? b.eventType : 'other';
    svcTotals[k] += Number(b.price) || 0;
  });
  const svcTotal = Object.values(svcTotals).reduce((s,v) => s+v, 0);
  const svcSlices = svcTotal > 0
    ? Object.entries(svcTotals).filter(([,v]) => v > 0).map(([k,v]) => ({ k, v, pct: (v/svcTotal)*100, color: SVC_COLORS[k], label: SVC_LABELS[k] }))
    : [];

  // Expense categories donut
  const EXP_COLORS = {
    plants: '#6b8f52', soil_amendments: '#8b6b45', tools: '#4a1942', equipment: '#7a3b4e',
    fuel: '#c9553a', vehicle: '#a67c52', supplies: '#8fb0a5', marketing: '#c48bb0',
    software: '#506a6e', professional_services: '#b5c99a', other: '#a89e96'
  };
  const EXP_LABELS = {
    plants: 'Plants', soil_amendments: 'Soil/amend', tools: 'Tools', equipment: 'Equipment',
    fuel: 'Fuel', vehicle: 'Vehicle', supplies: 'Supplies', marketing: 'Marketing',
    software: 'Software', professional_services: 'Pro svcs', other: 'Other'
  };
  const ytdBizExpenses = expenses.filter(e => (e.date||'').startsWith(year) && e.onBiz);
  const expByCategory = {};
  ytdBizExpenses.forEach(e => {
    const k = e.category || 'other';
    expByCategory[k] = (expByCategory[k] || 0) + e.amount;
  });
  const expSlices = ytdExpensesBiz > 0
    ? Object.entries(expByCategory).sort((a,b) => b[1] - a[1]).map(([k,v]) => ({ k, v, pct: (v/ytdExpensesBiz)*100, color: EXP_COLORS[k] || '#a89e96', label: EXP_LABELS[k] || k }))
    : [];

  // Build conic-gradient strings (safe — generator makes no assumptions about slice count)
  const buildConic = slices => {
    if (!slices.length) return 'var(--gray-100)';
    let cursor = 0;
    return 'conic-gradient(' + slices.map(s => {
      const start = cursor;
      cursor += s.pct;
      return `${s.color} ${start.toFixed(2)}% ${cursor.toFixed(2)}%`;
    }).join(', ') + ')';
  };

  const renderSlicesLegend = (slices, valuePrefix = '$') => {
    if (!slices.length) return '<div style="color:var(--gray-600);font-size:0.85rem;">No data yet.</div>';
    return slices.map(s => `
      <div style="display:flex;align-items:center;gap:6px;font-size:0.78rem;margin-bottom:3px;">
        <span style="width:10px;height:10px;border-radius:2px;background:${s.color};flex-shrink:0;"></span>
        <span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${s.label}</span>
        <span style="color:var(--gray-600);font-variant-numeric:tabular-nums;">${valuePrefix}${Math.round(s.v).toLocaleString()} · ${s.pct.toFixed(0)}%</span>
      </div>
    `).join('');
  };

  html += `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:12px;">
      <div style="background:var(--white);border-radius:12px;padding:14px;box-shadow:var(--shadow);">
        <h3 style="margin:0 0 10px;font-size:1rem;">Service mix ${year}</h3>
        <div style="display:flex;gap:14px;align-items:center;">
          <div style="width:100px;height:100px;border-radius:50%;flex-shrink:0;background:${buildConic(svcSlices)};"></div>
          <div style="flex:1;min-width:0;">${renderSlicesLegend(svcSlices)}</div>
        </div>
      </div>
      <div style="background:var(--white);border-radius:12px;padding:14px;box-shadow:var(--shadow);">
        <h3 style="margin:0 0 10px;font-size:1rem;">Expense categories ${year}</h3>
        <div style="display:flex;gap:14px;align-items:center;">
          <div style="width:100px;height:100px;border-radius:50%;flex-shrink:0;background:${buildConic(expSlices)};position:relative;">
            <div style="position:absolute;inset:22px;background:var(--white);border-radius:50%;"></div>
          </div>
          <div style="flex:1;min-width:0;">${renderSlicesLegend(expSlices)}</div>
        </div>
      </div>
    </div>
  `;

  // 8. Net profit trend line (last 12 months)
  const monthNet = monthBuckets.map(m => {
    const expInMo = expenses.filter(e => (e.date||'').slice(0,7) === m.key && e.onBiz).reduce((s,e) => s + e.amount, 0);
    return { ...m, expenses: expInMo, net: m.total - expInMo };
  });
  const netVals = monthNet.map(m => m.net);
  const netMin = Math.min(0, ...netVals);
  const netMax = Math.max(100, ...netVals);
  const netRange = Math.max(1, netMax - netMin);
  const chartW = 600, chartH = 120, padX = 24, padY = 14;
  const plotW = chartW - padX * 2;
  const plotH = chartH - padY * 2;
  const xAt = i => padX + (i / Math.max(1, monthNet.length - 1)) * plotW;
  const yAt = v => padY + plotH - ((v - netMin) / netRange) * plotH;
  const zeroY = yAt(0);
  const pointsStr = monthNet.map((m,i) => xAt(i) + ',' + yAt(m.net)).join(' ');
  const areaPath = 'M' + xAt(0) + ',' + zeroY + ' L' + pointsStr.split(' ').join(' L ') + ' L' + xAt(monthNet.length-1) + ',' + zeroY + ' Z';

  html += `
    <div style="background:var(--white);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;">
        <h3 style="margin:0;font-size:1rem;">Net profit trend</h3>
        <span style="font-size:0.72rem;color:var(--gray-600);">month-over-month (biz expenses subtracted)</span>
      </div>
      <svg viewBox="0 0 ${chartW} ${chartH}" preserveAspectRatio="none" style="width:100%;height:${chartH}px;display:block;">
        <line x1="${padX}" y1="${zeroY}" x2="${chartW - padX}" y2="${zeroY}" stroke="var(--gray-200)" stroke-width="1" stroke-dasharray="3 3"/>
        <path d="${areaPath}" fill="rgba(107,143,82,0.12)" stroke="none"/>
        <polyline points="${pointsStr}" fill="none" stroke="#6b8f52" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        ${monthNet.map((m,i) => `<circle cx="${xAt(i)}" cy="${yAt(m.net)}" r="3" fill="${m.net>=0?'#6b8f52':'#c9553a'}"><title>${m.label} ${m.year}: ${fmt(m.net)} net</title></circle>`).join('')}
      </svg>
      <div style="display:flex;padding:4px ${padX}px 0;">
        ${monthNet.map(m => `<div style="flex:1;text-align:center;font-size:0.65rem;color:var(--gray-600);">${m.label}</div>`).join('')}
      </div>
    </div>
  `;

  // 5. Top 5 clients YTD
  if (topClients.length > 0) {
    html += `
      <div style="background:var(--white);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);">
        <h3 style="margin:0 0 10px;font-size:1rem;">Top clients ${year}</h3>
    `;
    const topMax = topClients[0].gross || 1;
    topClients.forEach((c, i) => {
      const pct = (c.gross / topMax) * 100;
      html += `
        <div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:${i<topClients.length-1?'1px solid var(--gray-100)':'none'};">
          <div style="flex:1;min-width:0;">
            <div style="font-weight:600;font-size:0.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${c.name}</div>
            <div style="height:4px;background:var(--gray-100);border-radius:2px;margin-top:4px;overflow:hidden;">
              <div style="width:${pct}%;height:100%;background:#c48bb0;"></div>
            </div>
          </div>
          <div style="text-align:right;flex-shrink:0;">
            <div style="font-weight:700;font-size:0.95rem;">${fmt(c.gross)}</div>
            <div style="font-size:0.7rem;color:var(--gray-600);">${c.visits} visit${c.visits===1?'':'s'}</div>
          </div>
        </div>
      `;
    });
    html += `</div>`;
  } else {
    html += `
      <div style="background:var(--white);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);text-align:center;color:var(--gray-600);font-size:0.9rem;">
        No client revenue yet this year.
      </div>
    `;
  }

  el.innerHTML = html;
}

// --- Taxes (Tier 3: quarterly tracker, Schedule C mapper, accountant CSV) ---
// IRS quarterly estimated-tax periods (not calendar quarters!)
// Source: IRS Publication 505 — 1040-ES. Dates current as of 2024+.
const IRS_QUARTERS = [
  { q: 1, startMonth: 1,  endMonth: 3,  dueDate: '04-15', label: 'Q1' },
  { q: 2, startMonth: 4,  endMonth: 5,  dueDate: '06-15', label: 'Q2' },
  { q: 3, startMonth: 6,  endMonth: 8,  dueDate: '09-15', label: 'Q3' },
  { q: 4, startMonth: 9,  endMonth: 12, dueDate: '01-15', label: 'Q4' } // due Jan 15 of NEXT year
];

// Schedule C category → line mapping (IRS Form 1040 Schedule C, Part II)
const SCHEDULE_C = {
  marketing:             { line: 8,   name: 'Line 8 — Advertising' },
  fuel:                  { line: 9,   name: 'Line 9 — Car and truck expenses' },
  vehicle:               { line: 9,   name: 'Line 9 — Car and truck expenses' },
  professional_services: { line: 17,  name: 'Line 17 — Legal and professional services' },
  software:              { line: 18,  name: 'Line 18 — Office expense' },
  plants:                { line: 22,  name: 'Line 22 — Supplies' },
  soil_amendments:       { line: 22,  name: 'Line 22 — Supplies' },
  tools:                 { line: 22,  name: 'Line 22 — Supplies' },
  equipment:             { line: 22,  name: 'Line 22 — Supplies (or Line 13 Depreciation if >$2,500)' },
  supplies:              { line: 22,  name: 'Line 22 — Supplies' },
  other:                 { line: '27a', name: 'Line 27a — Other expenses' }
};

let _taxYear = new Date().getFullYear();

function setTaxYear(y) {
  _taxYear = parseInt(y, 10) || new Date().getFullYear();
  renderTaxes();
}

async function renderTaxes() {
  await loadExpenses();
  const el = document.getElementById('taxes-content');
  if (!el) return;

  const bookings = getBookings().filter(b => b.status !== 'canceled');
  const expenses = _cachedExpenses || [];
  const year = String(_taxYear);
  const today = formatDate(new Date());
  const taxPct = getTaxReservePct();
  const fmt = n => '$' + Math.round(n).toLocaleString();

  // Available years for picker: pull from data
  const years = Array.from(new Set([
    ...bookings.map(b => (b.date||'').slice(0,4)),
    ...expenses.map(e => (e.date||'').slice(0,4)),
    String(new Date().getFullYear())
  ].filter(Boolean))).sort().reverse();
  const yearOpts = years.map(y => `<option value="${y}"${y===year?' selected':''}>${y}</option>`).join('');

  // Year totals
  const yearBookings = bookings.filter(b => (b.date||'').startsWith(year));
  const yearGross = yearBookings.reduce((s,b) => s + (Number(b.price)||0), 0);
  const yearPaid = yearBookings.filter(b => b.paid).reduce((s,b) => s + (Number(b.price)||0), 0);
  const yearExpensesBiz = expenses.filter(e => (e.date||'').startsWith(year) && e.onBiz);
  const yearExpensesTotal = yearExpensesBiz.reduce((s,e) => s + e.amount, 0);
  const yearNet = yearGross - yearExpensesTotal;

  // Per-quarter breakdown with clear status phases
  const quarters = IRS_QUARTERS.map(qd => {
    const qBookings = yearBookings.filter(b => {
      const m = parseInt((b.date||'').slice(5,7), 10);
      return m >= qd.startMonth && m <= qd.endMonth;
    });
    const qExpenses = yearExpensesBiz.filter(e => {
      const m = parseInt((e.date||'').slice(5,7), 10);
      return m >= qd.startMonth && m <= qd.endMonth;
    });
    const gross = qBookings.reduce((s,b) => s + (Number(b.price)||0), 0);
    const exp   = qExpenses.reduce((s,e) => s + e.amount, 0);
    const net   = gross - exp;
    const estTax = Math.max(0, net) * taxPct;
    // Due date: Q4 is due Jan 15 of NEXT year
    const dueYear = qd.q === 4 ? parseInt(year,10) + 1 : parseInt(year,10);
    const due = dueYear + '-' + qd.dueDate;

    // Period bounds (for knowing whether we're inside it)
    const periodStart = year + '-' + String(qd.startMonth).padStart(2,'0') + '-01';
    const lastDay = new Date(parseInt(year), qd.endMonth, 0).getDate();
    const periodEnd = year + '-' + String(qd.endMonth).padStart(2,'0') + '-' + String(lastDay).padStart(2,'0');

    // Status phases (in order of priority)
    let phase;           // 'future' | 'current' | 'window' | 'dueToday' | 'overdue' | 'settled'
    if (today < periodStart) phase = 'future';
    else if (today <= periodEnd) phase = 'current';
    else if (today < due) phase = 'window';              // period closed, payment due soon
    else if (today === due) phase = 'dueToday';
    else phase = estTax > 0 ? 'overdue' : 'settled';

    return { ...qd, gross, exp, net, estTax, due, periodStart, periodEnd, phase, visits: qBookings.length };
  });

  // Schedule C mapping: group expenses by line, splitting by line-item
  // category when the expense has tagged line items. See expenseCategoryBreakdown.
  const byLine = {};
  yearExpensesBiz.forEach(e => {
    const breakdown = expenseCategoryBreakdown(e);
    Object.entries(breakdown).forEach(([cat, amt]) => {
      const mapping = SCHEDULE_C[cat] || SCHEDULE_C.other;
      const key = String(mapping.line);
      if (!byLine[key]) byLine[key] = { line: mapping.line, name: mapping.name, total: 0, count: 0, items: [] };
      byLine[key].total += amt;
      // Count the expense only once per line it touches, not once per line-item.
      if (!byLine[key].items.some(x => x.id === e.id)) {
        byLine[key].count += 1;
        byLine[key].items.push(e);
      }
    });
  });
  const scheduleCLines = Object.values(byLine).sort((a,b) => {
    const ak = typeof a.line === 'number' ? a.line : 99;
    const bk = typeof b.line === 'number' ? b.line : 99;
    return ak - bk;
  });
  const totalExpenses = scheduleCLines.reduce((s,l) => s + l.total, 0);

  // Render
  let html = '';

  // Year picker + year summary
  html += `
    <div style="background:var(--white);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
        <label style="font-size:0.9rem;font-weight:700;">Tax year</label>
        <select onchange="setTaxYear(this.value)" style="padding:6px 8px;border-radius:8px;border:1px solid var(--gray-200);font-size:0.9rem;">${yearOpts}</select>
        <span style="flex:1;"></span>
        <button class="modal-btn primary" style="padding:6px 14px;font-size:0.85rem;" onclick="exportAccountantCsv()">📄 Accountant CSV</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;border-top:1px solid var(--gray-100);padding-top:10px;">
        <div><div style="font-size:0.7rem;color:var(--gray-600);">Gross Income</div><div style="font-size:1.05rem;font-weight:700;color:#6b8f52;">${fmt(yearGross)}</div><div style="font-size:0.65rem;color:var(--gray-400);">SchC Line 1</div></div>
        <div><div style="font-size:0.7rem;color:var(--gray-600);">Biz Expenses</div><div style="font-size:1.05rem;font-weight:700;color:var(--red);">${fmt(yearExpensesTotal)}</div><div style="font-size:0.65rem;color:var(--gray-400);">SchC Line 28</div></div>
        <div><div style="font-size:0.7rem;color:var(--gray-600);">Net Profit</div><div style="font-size:1.05rem;font-weight:700;color:${yearNet>=0?'#6b8f52':'var(--red)'};">${fmt(yearNet)}</div><div style="font-size:0.65rem;color:var(--gray-400);">SchC Line 31</div></div>
        <div><div style="font-size:0.7rem;color:var(--gray-600);">Est. Tax Reserve</div><div style="font-size:1.05rem;font-weight:700;color:#c48bb0;">${fmt(Math.max(0, yearNet) * taxPct)}</div><div style="font-size:0.65rem;color:var(--gray-400);">${Math.round(taxPct*100)}% of net</div></div>
      </div>
    </div>
  `;

  // Quarterly tracker
  html += `
    <div style="background:var(--white);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;">
        <h3 style="margin:0;font-size:1rem;">Quarterly estimated tax — ${year}</h3>
        <span style="font-size:0.72rem;color:var(--gray-600);">IRS Form 1040-ES periods</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;">
  `;
  const PHASE_STYLES = {
    future:   { label: 'upcoming',        color: 'var(--gray-600)', bg: 'var(--gray-100)', border: 'transparent' },
    current:  { label: 'in progress',     color: '#6b8f52',         bg: '#eef5e4',          border: '#b5c99a' },
    window:   { label: 'payment window',  color: '#b38a1e',         bg: '#f4ebdf',          border: '#e8b828' },
    dueToday: { label: 'DUE TODAY',       color: '#c9553a',         bg: '#fff4e5',          border: '#c9553a' },
    overdue:  { label: 'OVERDUE',         color: '#c9553a',         bg: '#fff4e5',          border: '#e8b828' },
    settled:  { label: 'settled',         color: 'var(--gray-600)', bg: 'var(--gray-100)', border: 'transparent' }
  };
  quarters.forEach(q => {
    const ps = PHASE_STYLES[q.phase];
    const { label: status, color: statusColor, bg, border } = ps;
    const startMo = new Date(parseInt(year), q.startMonth - 1, 1).toLocaleString('en-US',{month:'short'});
    const endMo = new Date(parseInt(year), q.endMonth - 1, 1).toLocaleString('en-US',{month:'short'});
    html += `
      <div style="background:${bg};border:1px solid ${border};border-radius:10px;padding:10px;">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;">
          <strong style="font-size:0.95rem;">${q.label}</strong>
          <span style="font-size:0.65rem;color:${statusColor};font-weight:700;text-transform:uppercase;letter-spacing:0.5px;">${status}</span>
        </div>
        <div style="font-size:0.7rem;color:var(--gray-600);margin-bottom:6px;">${startMo}–${endMo} · ${q.visits} visit${q.visits===1?'':'s'}</div>
        <div style="display:flex;justify-content:space-between;font-size:0.78rem;"><span style="color:var(--gray-600);">Gross</span><span style="font-weight:600;">${fmt(q.gross)}</span></div>
        <div style="display:flex;justify-content:space-between;font-size:0.78rem;"><span style="color:var(--gray-600);">Expenses</span><span style="font-weight:600;">${fmt(q.exp)}</span></div>
        <div style="display:flex;justify-content:space-between;font-size:0.78rem;border-top:1px solid rgba(0,0,0,0.06);padding-top:3px;margin-top:3px;"><span style="color:var(--gray-600);">Net</span><span style="font-weight:700;">${fmt(q.net)}</span></div>

// Single multi-section CSV for your accountant: summary + income detail + expense detail grouped by Schedule C line.
function exportAccountantCsv() {
  const year = String(_taxYear);
  const today = formatDate(new Date());
  const bookings = getBookings().filter(b => b.status !== 'canceled' && (b.date||'').startsWith(year));
  const expenses = (_cachedExpenses || []).filter(e => (e.date||'').startsWith(year) && e.onBiz);

  const gross = bookings.reduce((s,b) => s + (Number(b.price)||0), 0);
  const totalExp = expenses.reduce((s,e) => s + e.amount, 0);
  const net = gross - totalExp;

  const esc = v => {
    const s = String(v ?? '');
    return (s.includes(',') || s.includes('"') || s.includes('\n')) ? '"' + s.replace(/"/g,'""') + '"' : s;
  };

  const lines = [];
  lines.push(`Garden Faery Sole Proprietorship — Tax Year ${year}`);
  lines.push(`Generated ${today}`);
  lines.push('');
  lines.push('SCHEDULE C SUMMARY');
  lines.push(`Line 1 — Gross Receipts,${gross.toFixed(2)}`);
  lines.push(`Line 28 — Total Expenses,${totalExp.toFixed(2)}`);
  lines.push(`Line 31 — Net Profit or Loss,${net.toFixed(2)}`);
  lines.push('');

  // Expense totals by Schedule C line (split by line-item category when tagged)
  const byLine = {};
  expenses.forEach(e => {
    const breakdown = expenseCategoryBreakdown(e);
    Object.entries(breakdown).forEach(([cat, amt]) => {
      const m = SCHEDULE_C[cat] || SCHEDULE_C.other;
      const k = String(m.line);
      if (!byLine[k]) byLine[k] = { name: m.name, total: 0, items: [] };
      byLine[k].total += amt;
      if (!byLine[k].items.some(x => x.id === e.id)) byLine[k].items.push(e);
    });
  });
  lines.push('EXPENSES BY SCHEDULE C LINE');
  lines.push('Schedule C Line,Total');
  Object.values(byLine)
    .sort((a,b) => {
      const ax = (''+Object.keys(byLine).find(k => byLine[k] === a)).padStart(3,'0');
      const bx = (''+Object.keys(byLine).find(k => byLine[k] === b)).padStart(3,'0');
      return ax.localeCompare(bx);
    })
    .forEach(l => lines.push(`${esc(l.name)},${l.total.toFixed(2)}`));
  lines.push('');

  // Income detail
  lines.push('INCOME DETAIL');
  lines.push('Date,Client,Service,Amount,Paid,Paid Date,Payment Method,Notes');
  bookings.sort((a,b) => (a.date||'').localeCompare(b.date||''));
  bookings.forEach(b => {
    const svc = EVENT_LABELS[b.eventType] || b.eventType || '';
    lines.push([
      b.date || '',
      esc(b.clientName || ''),
      esc(svc),
      (Number(b.price)||0).toFixed(2),
      b.paid ? 'yes' : 'no',
      b.paidDate || '',
      esc(b.paymentMethod || ''),
      esc(b.paymentNotes || '')
    ].join(','));
  });
  lines.push('');

  // Expense detail
  lines.push('EXPENSE DETAIL');
  lines.push('Date,Vendor,Category,Schedule C Line,Amount,Card,Last 4,Notes');
  expenses.sort((a,b) => (a.date||'').localeCompare(b.date||''));
  expenses.forEach(e => {
    const m = SCHEDULE_C[e.category] || SCHEDULE_C.other;
    lines.push([
      e.date || '',
      esc(e.vendor || ''),
      esc(e.category || ''),
      esc(m.name),
      (Number(e.amount)||0).toFixed(2),
      esc(e.card || ''),
      esc(e.cardLast4 || ''),
      esc(e.notes || '')
    ].join(','));
  });
  lines.push('');

  // Line-item detail for mixed-category receipts. Only emitted for expenses
  // that actually have tagged line items so the accountant can trace the
  // per-category splits.
  lines.push('MIXED-RECEIPT LINE ITEM DETAIL');
  lines.push('Date,Vendor,Line Description,Line Amount,Line Category,Schedule C Line');
  expenses.forEach(e => {
    const items = Array.isArray(e.lineItems) ? e.lineItems.filter(i => i.category) : [];
    if (!items.length) return;
    items.forEach(i => {
      const m = SCHEDULE_C[i.category] || SCHEDULE_C.other;
      lines.push([
        e.date || '',
        esc(e.vendor || ''),
        esc(i.description || ''),
        (Number(i.amount)||0).toFixed(2),
        esc(i.category || ''),
        esc(m.name)
      ].join(','));
    });
  });

  const csv = lines.join('\n');
  const blob = new Blob([csv], { type:'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `garden-faery-tax-${year}.csv`; a.click();
  URL.revokeObjectURL(url);
}

// Return the per-category dollar breakdown for an expense, splitting by
// line-item category where tagged. Line items with a category pull their
// own amount into that category; the remainder (total − sum of tagged
// line items) goes to the expense's top-level category.
// Returns an object like {plants: 80, equipment: 100, supplies: 20}.
function expenseCategoryBreakdown(e) {
  const total = Number(e.amount) || 0;
  const topCat = e.category || 'other';
  const items = Array.isArray(e.lineItems) ? e.lineItems : [];
  const tagged = items.filter(i => i.category && Number(i.amount) > 0);
  if (!tagged.length) {
    // Nothing tagged — full amount goes to the receipt-level category.
    return { [topCat]: total };
  }
  const out = {};
  let sumTagged = 0;
  tagged.forEach(i => {
    const amt = Number(i.amount) || 0;
    out[i.category] = (out[i.category] || 0) + amt;
    sumTagged += amt;
  });
  const remainder = total - sumTagged;
  if (Math.abs(remainder) > 0.005) {
    // Typically this is tax + any untagged items; push to receipt-level category.
    out[topCat] = (out[topCat] || 0) + remainder;
  }
  return out;
}

// ============================================================================
// Expense line-item correction memory
// Remembers past per-line-item categorizations keyed on vendor+description.
// When a receipt comes in from the scanner, we look up each line item against
// the memory and override the AI's suggested category with the learned one.
// When the user saves an expense with line items, any new or changed line-item
// category is recorded as a memory entry for next time.
// Backed by PocketBase collection "expense_line_memory" so the memory syncs
// across devices.
// ============================================================================

let _lineMemoryCache = null;   // key -> {category, id, hits}
let _lineMemoryLoaded = false;

function lineKey(vendor, desc) {
  const v = String(vendor || '').trim().toLowerCase().replace(/\s+/g, ' ');
  const d = String(desc || '').trim().toLowerCase().replace(/\s+/g, ' ');
  if (!d) return '';
  // Include vendor so the same description under different vendors can map
  // to different categories (e.g. "SOIL" at a nursery vs. at a hardware store).
  return v + '|' + d;
}

async function ensureLineMemoryLoaded() {
  if (_lineMemoryLoaded) return;
  try {
    const r = await fetch(PB_URL + '/api/collections/expense_line_memory/records?perPage=500', {
      headers: { 'Authorization': PB_TOKEN }
    });
    if (!r.ok) { _lineMemoryCache = {}; _lineMemoryLoaded = true; return; }
    const data = await r.json();
    _lineMemoryCache = {};
    (data.items || []).forEach(row => {
      if (row.key) _lineMemoryCache[row.key] = { id: row.id, category: row.category, hits: Number(row.hits) || 0 };
    });
    _lineMemoryLoaded = true;
  } catch (e) {
    _lineMemoryCache = {};
    _lineMemoryLoaded = true;
  }
}

function lookupLineMemory(vendor, desc) {
  if (!_lineMemoryCache) return null;
  const k = lineKey(vendor, desc);
  return k && _lineMemoryCache[k] ? _lineMemoryCache[k] : null;
}

// Apply learned memory to a fresh array of scanner line items. Mutates in place.
// Overrides the AI's category with the learned one when we have a hit, and
// marks the item with _learned=true so the UI can show a badge.
async function applyLineMemory(vendor, items) {
  if (!Array.isArray(items) || !items.length) return items;
  await ensureLineMemoryLoaded();
  items.forEach(it => {
    const hit = lookupLineMemory(vendor, it.description);
    if (hit && hit.category) {
      it.category = hit.category;
      it._learned = true;
    }
  });
  return items;
}

// Called on save: compare final line items against memory and upsert new/changed.
// Runs fire-and-forget — we don't want to block save on memory writes.
function recordLineItemMemory(vendor, items) {
  if (!Array.isArray(items) || !items.length) return;
  if (!_lineMemoryCache) _lineMemoryCache = {};
  const now = new Date().toISOString();
  items.forEach(it => {
    const k = lineKey(vendor, it.description);
    if (!k || !it.category) return;
    const existing = _lineMemoryCache[k];
    if (existing && existing.category === it.category) {
      // Same mapping — just bump the hit counter (best effort, non-blocking).
      const hits = (existing.hits || 0) + 1;
      existing.hits = hits;
      fetch(PB_URL + '/api/collections/expense_line_memory/records/' + existing.id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'Authorization': PB_TOKEN },
        body: JSON.stringify({ hits })
      }).catch(() => {});
    } else if (existing) {
      // Category changed — update the stored category, reset hits.
      existing.category = it.category;
      existing.hits = 1;
      fetch(PB_URL + '/api/collections/expense_line_memory/records/' + existing.id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'Authorization': PB_TOKEN },
        body: JSON.stringify({ category: it.category, hits: 1 })
      }).catch(() => {});
    } else {
      // New entry — create.
      const body = {
        key: k,
        vendor: String(vendor || '').trim(),
        description: String(it.description || '').trim(),
        category: it.category,
        hits: 1
      };
      fetch(PB_URL + '/api/collections/expense_line_memory/records', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': PB_TOKEN },
        body: JSON.stringify(body)
      }).then(r => r.ok ? r.json() : null).then(row => {
        if (row && row.id) _lineMemoryCache[k] = { id: row.id, category: it.category, hits: 1 };
      }).catch(() => {});
      // Placeholder so duplicate saves in the same session don't create duplicates.
      _lineMemoryCache[k] = { id: '__pending__', category: it.category, hits: 1 };
    }
  });
}

// Friendly display label for a stored card value + optional last-4.
const CARD_LABELS = {
  coast_central_biz:      'Coast Central (biz)',
  coast_central_personal: 'Coast Central (personal)',
  columbia:               'Columbia',
  northrim:               'Northrim',
  skyla_debit:            'Skyla debit',
  skyla_credit:           'Skyla credit',
  bofa_debit:             'BofA debit',
  bofa_credit:            'BofA credit',
  cash:                   'Cash',
  venmo:                  'Venmo',
  other:                  'Other'
};
function cardDisplayLabel(card, last4) {
  const base = CARD_LABELS[card] || (card ? String(card).replace(/_/g, ' ') : '');
  if (!base && !last4) return '';
  if (!base) return '····' + last4;
  if (!last4) return base;
  return base + ' ····' + last4;
}

// When Coast Central Bank (the business account) is selected, tick the
// "On business account" checkbox automatically. All other accounts leave
// the checkbox alone so personal-card-but-business-expense still works.
// Also, if a card last-4 is filled and the user picks a bank here, remember
// the pairing so future receipts with that last-4 auto-select this bank.
function onExpCardChange() {
  const card = document.getElementById('exp-card').value;
  // Only the business Coast Central account auto-ticks "On business account".
  // The personal Coast Central account leaves the checkbox alone.
  if (card === 'coast_central_biz') {
    document.getElementById('exp-biz').checked = true;
  }
  const last4 = (document.getElementById('exp-card-last4').value || '').trim();
  if (card && /^\d{4}$/.test(last4)) {
    rememberCardBank(last4, card);
  }
}

// Map of last-4 → bank option value, persisted in localStorage so future
// receipts can auto-fill the dropdown when the AI extracts a known last-4.
const CARD_BANK_KEY = 'gf_card_banks_v1';
function loadCardBanks() {
  try { return JSON.parse(localStorage.getItem(CARD_BANK_KEY) || '{}'); }
  catch { return {}; }
}
function getCardBank(last4) {
  const m = loadCardBanks();
  return m[last4] || '';
}
function rememberCardBank(last4, bank) {
  if (!last4 || !bank) return;
  const m = loadCardBanks();
  if (m[last4] === bank) return;
  m[last4] = bank;
  localStorage.setItem(CARD_BANK_KEY, JSON.stringify(m));
}

function escAttr(s) {
  return String(s == null ? '' : s).replace(/"/g, '&quot;').replace(/</g, '&lt;');

// Render line items as editable rows: description (readonly), amount (editable),
// category dropdown (editable, empty = "same as receipt"). If a line-item
// category was auto-applied from correction memory, we mark it with a badge.
function renderLineItems(items) {
  if (!Array.isArray(items) || !items.length) return '';
  const opts = (selected) => {
    let o = '<option value="">(same as receipt)</option>';
    EXPENSE_CATEGORIES.forEach(c => {
      o += '<option value="' + c.v + '"' + (c.v === selected ? ' selected' : '') + '>' + c.l + '</option>';
    });
    return o;
  };
  let h = '<div style="margin-top:4px;padding:10px;background:var(--gray-100);border-radius:8px;">' +
    '<div style="font-weight:700;font-size:0.8rem;margin-bottom:6px;">Line items (tag any that differ from the receipt category)</div>';
  items.forEach((i, idx) => {
    const desc = i.description || '';
    const amt = Number(i.amount || 0).toFixed(2);
    const cat = i.category || '';
    const learned = i._learned ? '<span title="Auto-applied from a past correction" style="background:#dfe8d4;color:#4a1942;padding:1px 6px;border-radius:8px;font-size:0.65rem;font-weight:700;margin-left:4px;">learned</span>' : '';
    h += '<div class="line-item-row" data-idx="' + idx + '" style="display:grid;grid-template-columns:1fr 70px 130px;gap:6px;align-items:center;margin-bottom:4px;font-size:0.8rem;">' +
      '<div class="li-desc" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="' + escAttr(desc) + '">' + escAttr(desc) + learned + '</div>' +
      '<input class="li-amt" type="number" step="0.01" value="' + amt + '" style="padding:4px 6px;font-size:0.8rem;width:100%;">' +
      '<select class="li-cat" style="padding:4px 6px;font-size:0.8rem;width:100%;">' + opts(cat) + '</select>' +
    '</div>';
  });
  h += '</div>';
  return h;
}

// Read the current state of the editable line-item rows out of the DOM.
// Returns an array of {description, amount, category} matching the
// line_items JSON schema.
function readLineItemsFromDom() {
  const rows = document.querySelectorAll('#exp-line-items .line-item-row');
  const items = [];
  rows.forEach(row => {
    const desc = (row.querySelector('.li-desc') && row.querySelector('.li-desc').getAttribute('title')) || '';
    const amt = parseFloat(row.querySelector('.li-amt').value) || 0;
    const cat = row.querySelector('.li-cat').value || null;
    items.push({ description: desc, amount: amt, category: cat });
  });
  return items;
}

async function saveExpense() {
  const last4Raw = (document.getElementById('exp-card-last4').value || '').trim();
  const card_last4 = /^\d{4}$/.test(last4Raw) ? last4Raw : '';
  const card = document.getElementById('exp-card').value || null;
  const lineItems = readLineItemsFromDom();
  const body = {
    date: document.getElementById('exp-date').value,
    amount: parseFloat(document.getElementById('exp-amount').value) || 0,
    vendor: document.getElementById('exp-vendor').value,
    category: document.getElementById('exp-category').value || null,
    card: card,
    card_last4: card_last4,
    on_biz_account: document.getElementById('exp-biz').checked,
    notes: document.getElementById('exp-notes').value,
    line_items: lineItems.length ? lineItems : null
  };
  if (!body.date || !body.amount) { alert('Date and amount are required.'); return; }

  // If both a bank and a last-4 are set, remember the pairing for future scans
  if (card && card_last4) rememberCardBank(card_last4, card);

  // Remember per-line category corrections so future scans auto-apply them
  recordLineItemMemory(body.vendor, lineItems);

  try {
    let id = _editingExpenseId;
    if (_pendingReceiptFile) {
      // Use multipart so we can include the file
      const fd = new FormData();
      Object.entries(body).forEach(([k,v]) => fd.append(k, v == null ? '' : (typeof v === 'boolean' ? String(v) : v)));
      fd.append('receipt', _pendingReceiptFile);
      const url = PB_URL + '/api/collections/expenses/records' + (id ? '/'+id : '');
      const r = await fetch(url, {
        method: id ? 'PATCH' : 'POST',
        headers: { 'Authorization': PB_TOKEN },
        body: fd
      });
      if (!r.ok) throw new Error(await r.text());
    } else {
      const url = PB_URL + '/api/collections/expenses/records' + (id ? '/'+id : '');
      const r = await fetch(url, {
        method: id ? 'PATCH' : 'POST',
        headers: { 'Content-Type':'application/json', 'Authorization': PB_TOKEN },
        body: JSON.stringify(body)
      });
      if (!r.ok) throw new Error(await r.text());
    }
    closeExpenseModal();
    renderExpenses();
  } catch (e) {
    alert('Save failed: ' + e.message);
  }
}

function exportExpenseCsv() {
  const inMonth = _cachedExpenses.filter(e => (e.date||'').slice(0,7) === expenseViewMonth);
  const rows = [['Date','Vendor','Amount','Category','Card','Last 4','On Biz','Notes']];
  inMonth.sort((a,b) => (a.date||'').localeCompare(b.date||''));
  inMonth.forEach(e => {
    rows.push([e.date, e.vendor, e.amount.toFixed(2), e.category, e.card, e.cardLast4 || '', e.onBiz?'yes':'no', (e.notes||'').replace(/"/g,'""')]);
  });
  const csv = rows.map(r => r.map(c => `"${String(c||'')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type:'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'expenses-' + expenseViewMonth + '.csv'; a.click();
  URL.revokeObjectURL(url);
}

// --- Receipt OCR via Claude Vision API ---
// Downscale an image File to JPEG base64, capped at maxLongSide pixels and given quality.
// Returns { b64, mediaType }. Falls back to raw bytes if canvas/decoding fails.
async function downscaleImageToBase64(file, maxLongSide, quality) {
  const rawBytesToB64 = async () => {
    const buf = await file.arrayBuffer();
    return {
      b64: btoa(Array.from(new Uint8Array(buf)).map(b => String.fromCharCode(b)).join('')),
      mediaType: file.type || 'image/jpeg'
    };
  };
  try {
    const url = URL.createObjectURL(file);
    const img = await new Promise((resolve, reject) => {
      const i = new Image();
      i.onload = () => resolve(i);
      i.onerror = reject;
      i.src = url;
    });
    const longSide = Math.max(img.naturalWidth, img.naturalHeight);
    const scale = longSide > maxLongSide ? maxLongSide / longSide : 1;
    const w = Math.round(img.naturalWidth * scale);
    const h = Math.round(img.naturalHeight * scale);
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(url);
    const dataUrl = canvas.toDataURL('image/jpeg', quality);
    // Strip "data:image/jpeg;base64,"
    const b64 = dataUrl.split(',')[1] || '';
    // Approx size check: base64 is ~4/3 of bytes. Cap at 4.5 MB raw => ~6 MB b64.
    const approxBytes = Math.floor(b64.length * 3 / 4);
    if (approxBytes > 4_500_000 && quality > 0.6) {
      // Re-encode at lower quality
      const dataUrl2 = canvas.toDataURL('image/jpeg', 0.65);
      return { b64: dataUrl2.split(',')[1] || '', mediaType: 'image/jpeg' };
    }
    return { b64, mediaType: 'image/jpeg' };
  } catch (e) {
    return await rawBytesToB64();
  }
}
