<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookings | Garden Faery Admin</title>
<link rel="apple-touch-icon" href="/icon-admin.png">
<link rel="icon" type="image/png" href="/icon-admin.png">
<meta name="apple-mobile-web-app-title" content="Admin">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --plum: #4a1942;
  --cream: #f8f4ed;
  --petal-pink: #c48bb0;
  --petal-pink-light: #e8d0df;
  --spring-sage: #a3b88c;
  --pollen-gold: #d4c27a;
  --sage-light: #dfe8d4;
  --white: #ffffff;
  --gray-100: #f2efe8;
  --gray-200: #e0dbd3;
  --gray-400: #a89e96;
  --gray-600: #6b5f56;
  --red-light: #f0d4d4;
  --red: #a03020;
  --radius: 12px;
  --shadow: 0 2px 12px rgba(74,25,66,0.08);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Nunito', sans-serif;
  background: var(--cream);
  color: var(--plum);
  min-height: 100vh;
  padding-bottom: 80px;
}
h1, h2, h3 { font-family: 'Lora', serif; font-weight: 400; }

.container { max-width: 520px; margin: 0 auto; padding: 16px; }

/* Top bar */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 0;
  margin-bottom: 8px;
}
.top-bar h1 { font-size: 1.5rem; }

/* Tabs */
.tabs {
  display: flex;
  gap: 4px;
  background: var(--gray-100);
  border-radius: 10px;
  padding: 4px;
  margin-bottom: 16px;
  overflow-x: auto;
}
.tab {
  flex: 1;
  padding: 10px 8px;
  border: none;
  border-radius: 8px;
  background: none;
  font-family: 'Nunito', sans-serif;
  font-weight: 600;
  font-size: 0.85rem;
  color: var(--gray-600);
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
  text-align: center;
}
.tab.active { background: var(--white); color: var(--plum); box-shadow: var(--shadow); }

/* Day view */
.day-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.day-nav h2 {
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 1.1rem;
}
.day-btn {
  background: none;
  border: none;
  font-size: 1.2rem;
  cursor: pointer;
  color: var(--plum);
  padding: 6px 12px;
  border-radius: 8px;
}
.day-btn:hover { background: var(--gray-100); }
.today-btn {
  padding: 6px 14px;
  border-radius: 8px;
  border: 2px solid var(--gray-200);
  background: var(--white);
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 0.8rem;
  color: var(--plum);
  cursor: pointer;
}
.today-btn:hover { border-color: var(--spring-sage); }

/* Timeline */
.timeline {
  position: relative;
  margin-left: 54px;
  border-left: 2px solid var(--gray-200);
  padding-left: 16px;
  min-height: 300px;
}
.time-marker {
  position: relative;
  padding: 4px 0 28px;
}
.time-label {
  position: absolute;
  left: -70px;
  top: 2px;
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--gray-400);
  width: 48px;
  text-align: right;
}
.time-dot {
  position: absolute;
  left: -23px;
  top: 7px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--gray-200);
}

/* Booking card */
.booking-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 14px;
  box-shadow: var(--shadow);
  margin-bottom: 8px;
  border-left: 4px solid var(--spring-sage);
  position: relative;
}
.booking-card.morning { border-left-color: var(--pollen-gold); }
.booking-card.afternoon { border-left-color: var(--petal-pink); }
.booking-card.monday { border-left-color: var(--spring-sage); }
.booking-card.blocked { border-left-color: var(--gray-400); background: var(--gray-100); }
.series-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.7rem;
  font-weight: 700;
  background: var(--petal-pink-light);
  color: var(--plum);
  margin-left: 6px;
}

.booking-card h3 {
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 1rem;
  margin-bottom: 2px;
}
.booking-meta {
  font-size: 0.85rem;
  color: var(--gray-600);
  margin-bottom: 8px;
}
.booking-client {
  font-size: 0.9rem;
  display: flex;
  align-items: center;
  gap: 6px;
}
.booking-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}
.action-btn {
  padding: 6px 14px;
  border-radius: 6px;
  border: 1px solid var(--gray-200);
  background: var(--white);
  font-family: 'Nunito', sans-serif;
  font-weight: 600;
  font-size: 0.8rem;
  color: var(--plum);
  cursor: pointer;
  transition: all 0.15s;
}
.action-btn:hover { border-color: var(--spring-sage); }
.action-btn.danger { color: var(--red); border-color: var(--red-light); }
.action-btn.danger:hover { background: var(--red-light); }

/* Empty state */
.empty-day {
  text-align: center;
  padding: 40px 20px;
  color: var(--gray-400);
}


/* Week view */
.week-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  margin-bottom: 16px;
}
.week-day {
  text-align: center;
  padding: 8px 4px;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.15s;
}
.week-day:hover { background: var(--gray-100); }
.week-day.active { background: var(--sage-light); }
.week-day.today-marker { box-shadow: inset 0 0 0 2px var(--pollen-gold); }
.week-day .dow { font-size: 0.7rem; font-weight: 700; color: var(--gray-400); }
.week-day .dom { font-size: 1.1rem; font-weight: 700; }
.week-day .dots { min-height: 8px; margin-top: 4px; display: flex; justify-content: center; gap: 3px; }
.week-day .dot { width: 6px; height: 6px; border-radius: 50%; }
.dot.morning-dot { background: var(--pollen-gold); }
.dot.afternoon-dot { background: var(--petal-pink); }
.dot.monday-dot { background: var(--spring-sage); }
.dot.blocked-dot { background: var(--gray-400); }

/* Block time modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 100;
  align-items: flex-end;
  justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--white);
  border-radius: 16px 16px 0 0;
  padding: 24px 20px;
  width: 100%;
  max-width: 520px;
  max-height: 80vh;
  overflow-y: auto;
}
.modal h2 {
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 1.1rem;
  margin-bottom: 16px;
}
.modal .form-group { margin-bottom: 14px; }
.modal label {
  display: block;
  font-weight: 700;
  font-size: 0.85rem;
  margin-bottom: 6px;
}
.modal input, .modal select, .modal textarea {
  width: 100%;
  padding: 10px 12px;
  border: 2px solid var(--gray-200);
  border-radius: 8px;
  font-family: 'Nunito', sans-serif;
  font-size: 0.9rem;
  color: var(--plum);
}
.modal input:focus, .modal select:focus, .modal textarea:focus {
  outline: none;
  border-color: var(--spring-sage);
}
.modal-actions {
  display: flex;
  gap: 8px;
  margin-top: 16px;
}
.modal-btn {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: none;
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 0.95rem;
  cursor: pointer;
}
.modal-btn.primary { background: var(--petal-pink); color: var(--white); }
.modal-btn.secondary { background: var(--gray-100); color: var(--plum); }

/* Bottom action bar */
.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--white);
  border-top: 1px solid var(--gray-200);
  padding: 10px 16px;
  display: flex;
  justify-content: center;
  gap: 12px;
  z-index: 50;
}
.fab {
  padding: 12px 20px;
  border-radius: 24px;
  border: none;
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
}
.fab-primary { background: var(--petal-pink); color: var(--white); }
.fab-secondary { background: var(--sage-light); color: var(--plum); }

/* Month view */
.month-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.month-nav h2 {
  font-size: 1.1rem;
  font-family: 'Lora', serif;
  color: var(--plum);
}
.month-nav .day-btn {
  background: var(--sage-light);
  color: var(--plum);
  border: none;
  width: 36px;
  height: 36px;
  border-radius: 10px;
  font-size: 1.1rem;
  cursor: pointer;
}
.month-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  background: var(--white);
  border-radius: var(--radius);
  padding: 8px;
  box-shadow: var(--shadow);
}
.month-dow {
  text-align: center;
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--gray-600);
  padding: 4px 0;
  letter-spacing: 0.5px;
}
.month-cell {
  min-height: 64px;
  padding: 4px;
  border-radius: 8px;
  background: var(--cream, #faf6ef);
  font-size: 0.75rem;
  color: var(--plum);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  border: 1px solid transparent;
  overflow: hidden;
}
.month-cell.empty { background: transparent; cursor: default; }
.month-cell.today { border-color: var(--spring-sage); background: var(--sage-light); }
.month-cell:not(.empty):hover { border-color: var(--spring-sage); }
.month-cell .mc-num {
  font-weight: 700;
  font-size: 0.85rem;
  margin-bottom: 2px;
}
.month-cell .mc-evt {
  background: var(--petal-pink);
  color: var(--white);
  border-radius: 4px;
  padding: 1px 4px;
  margin-bottom: 2px;
  font-size: 0.65rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.month-cell .mc-evt.morning { background: var(--spring-sage); }
.month-cell .mc-evt.afternoon { background: var(--petal-pink); }
.month-cell .mc-evt.monday { background: #b48ec2; }
.month-cell .mc-evt.blocked { background: var(--gray-400); }
.month-cell .mc-more {
  font-size: 0.6rem;
  color: var(--gray-600);
}
@media (max-width: 480px) {
  .month-cell { min-height: 52px; padding: 3px; font-size: 0.7rem; }
  .month-cell .mc-evt { font-size: 0.55rem; padding: 0 2px; }
  .month-cell .mc-num { font-size: 0.75rem; }
}

/* Login screen */
.login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.login-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 32px 28px;
  box-shadow: var(--shadow);
  width: 100%;
  max-width: 360px;
  text-align: center;
}
.login-card h1 {
  font-size: 1.6rem;
  margin-bottom: 4px;
}
.login-card p {
  color: var(--gray-600);
  font-size: 0.9rem;
  margin-bottom: 24px;
}
.login-card input {
  width: 100%;
  padding: 14px 48px 14px 16px;
  border: 2px solid var(--gray-200);
  border-radius: 10px;
  font-family: 'Nunito', sans-serif;
  font-size: 1rem;
  color: var(--plum);
  text-align: center;
  letter-spacing: 2px;
  margin-bottom: 16px;
  box-sizing: border-box;
}
.pin-wrap { position: relative; }
.pin-toggle {
  position: absolute;
  right: 8px;
  top: 10px;
  background: transparent;
  border: none;
  cursor: pointer;
  font-size: 1.2rem;
  padding: 6px 10px;
  color: var(--gray-600);
  line-height: 1;
}
.pin-toggle:hover { color: var(--plum); }
.login-card input:focus {
  outline: none;
  border-color: var(--spring-sage);
}
.login-card .login-btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: var(--petal-pink);
  color: var(--white);
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 1rem;
  cursor: pointer;
}
.login-card .login-btn:hover { opacity: 0.9; }
.login-card .login-btn:disabled {
  background: var(--gray-200);
  color: var(--gray-400);
  cursor: not-allowed;
}
.login-error {
  color: #a03020;
  font-size: 0.85rem;
  margin-top: 8px;
  display: none;
}
.app-wrap { display: none; }
.app-wrap.visible { display: block; }

/* Tomorrow banner */
.tomorrow-banner {
  background: var(--sage-light);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 16px;
}
.tomorrow-banner h3 {
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--plum);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.tomorrow-banner .tomorrow-item {
  font-size: 0.9rem;
  padding: 3px 0;
  color: var(--plum);
}
.tomorrow-banner .tomorrow-empty {
  font-size: 0.9rem;
  color: var(--gray-600);
  font-style: italic;
}

@media (max-width: 400px) {
  .container { padding: 12px; }
  .timeline { margin-left: 48px; }
  .time-label { left: -62px; width: 42px; font-size: 0.7rem; }
}
</style>
</head>
<body>

<!-- Login screen -->
<div class="login-screen" id="login-screen">
  <div class="login-card">
    <h1>Garden Faery</h1>
    <p>Enter your PIN to open the dashboard.</p>
    <div class="pin-wrap">
      <input type="password" id="login-pin" placeholder="PIN" maxlength="20" autocomplete="off">
      <button type="button" class="pin-toggle" id="pin-toggle" aria-label="Show PIN" onclick="togglePinVisibility()">👁</button>
    </div>
    <button class="login-btn" id="login-btn" onclick="doLogin()">Open Dashboard</button>
    <div class="login-error" id="login-error">Wrong PIN. Try again.</div>
  </div>
</div>

<!-- Main app (hidden until login) -->
<div class="app-wrap" id="app-wrap">
<div class="container">
  <div class="top-bar">
    <h1>My Bookings</h1>
    <button class="today-btn" onclick="goToday()">Today</button>
  </div>

  <!-- Tomorrow's schedule banner -->
  <div class="tomorrow-banner" id="tomorrow-banner" style="display:none;"></div>

  <!-- Week strip -->
  <div class="week-grid" id="week-grid"></div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-tab="day" onclick="switchTab('day')">Day</button>
    <button class="tab" data-tab="month" onclick="switchTab('month')">Month</button>
    <button class="tab" data-tab="upcoming" onclick="switchTab('upcoming')">Upcoming</button>
    <button class="tab" data-tab="clients" onclick="switchTab('clients')">Clients</button>
    <button class="tab" data-tab="income" onclick="switchTab('income')">Income</button>
    <button class="tab" data-tab="expenses" onclick="switchTab('expenses')">Expenses</button>
    <button class="tab" data-tab="settings" onclick="switchTab('settings')">⚙️</button>
  </div>

  <!-- Day view -->
  <div class="tab-panel active" id="tab-day">
    <div id="day-content"></div>
  </div>

  <!-- Month view -->
  <div class="tab-panel" id="tab-month" style="display:none;">
    <div id="month-content"></div>
  </div>

  <!-- Upcoming view -->
  <div class="tab-panel" id="tab-upcoming" style="display:none;">
    <div id="upcoming-content"></div>
  </div>

  <!-- Clients view -->
  <div class="tab-panel" id="tab-clients" style="display:none;">
    <div id="clients-content"></div>
  </div>

  <!-- Income view -->
  <div class="tab-panel" id="tab-income" style="display:none;">
    <div id="income-content"></div>
  </div>

  <!-- Expenses view -->
  <div class="tab-panel" id="tab-expenses" style="display:none;">
    <div id="expenses-content"></div>
  </div>

  <!-- Settings view -->
  <div class="tab-panel" id="tab-settings" style="display:none;">
    <div id="settings-content"></div>
  </div>
</div>

<!-- Expense modal -->
<div class="modal-overlay" id="modal-expense">
  <div class="modal" style="max-height:90vh;overflow-y:auto;">
    <h2 id="exp-title">New expense</h2>
    <div style="margin-bottom:10px;">
      <button class="modal-btn secondary" style="width:100%;" onclick="document.getElementById('exp-photo').click()">
        📷 Scan a receipt
      </button>
      <input type="file" id="exp-photo" accept="image/*,application/pdf" style="display:none;" onchange="scanReceipt(this)">
      <div id="exp-scan-status" style="font-size:0.8rem;color:var(--gray-600);margin-top:4px;"></div>
    </div>
    <div class="form-group">
      <label>Date</label>
      <input type="date" id="exp-date">
    </div>
    <div class="form-group">
      <label>Amount ($)</label>
      <input type="number" id="exp-amount" step="0.01" min="0" placeholder="0.00">
    </div>
    <div class="form-group">
      <label>Vendor</label>
      <input type="text" id="exp-vendor" placeholder="Home Depot, Bloom Nursery, etc.">
    </div>
    <div class="form-group">
      <label>Category</label>
      <select id="exp-category">
        <option value="">-</option>
        <option value="plants">Plants</option>
        <option value="soil_amendments">Soil / Amendments</option>
        <option value="tools">Tools</option>
        <option value="equipment">Equipment</option>
        <option value="fuel">Fuel</option>
        <option value="vehicle">Vehicle</option>
        <option value="supplies">Supplies</option>
        <option value="marketing">Marketing</option>
        <option value="software">Software</option>
        <option value="professional_services">Professional Services</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="form-group">
      <label>Card / payment</label>
      <select id="exp-card">
        <option value="">-</option>
        <option value="biz_debit">Business debit</option>
        <option value="biz_credit">Business credit</option>
        <option value="personal_debit">Personal debit</option>
        <option value="personal_credit">Personal credit</option>
        <option value="cash">Cash</option>
        <option value="venmo">Venmo</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="form-group">
      <label>
        <input type="checkbox" id="exp-biz" style="margin-right:6px;"> On business account
      </label>
    </div>
    <div class="form-group">
      <label>Notes</label>
      <input type="text" id="exp-notes" placeholder="Optional">
    </div>
    <div id="exp-line-items" style="font-size:0.8rem;color:var(--gray-600);margin-bottom:10px;"></div>
    <div class="modal-actions">
      <button class="modal-btn secondary" onclick="closeExpenseModal()">Cancel</button>
      <button class="modal-btn primary" onclick="saveExpense()">Save</button>
    </div>
  </div>
</div>

<!-- Payment modal -->
<div class="modal-overlay" id="modal-payment">
  <div class="modal">
    <h2>Booking payment</h2>
    <div id="pay-booking-info" style="margin-bottom:12px;color:var(--gray-600);font-size:0.9rem;"></div>
    <div class="form-group">
      <label>Price ($)</label>
      <input type="number" id="pay-price" step="1" min="0" placeholder="0">
    </div>
    <div class="form-group">
      <label>
        <input type="checkbox" id="pay-paid" style="margin-right:6px;"> Paid
      </label>
    </div>
    <div class="form-group">
      <label>Payment method</label>
      <select id="pay-method">
        <option value="">-</option>
        <option value="cash">Cash</option>
        <option value="check">Check</option>
        <option value="card">Card</option>
        <option value="venmo">Venmo</option>
        <option value="zelle">Zelle</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="form-group">
      <label>Paid on</label>
      <input type="date" id="pay-date">
    </div>
    <div class="form-group">
      <label>Notes</label>
      <input type="text" id="pay-notes" placeholder="Optional">
    </div>
    <div class="modal-actions">
      <button class="modal-btn secondary" onclick="closeModal('modal-payment')">Cancel</button>
      <button class="modal-btn primary" onclick="savePayment()">Save</button>
    </div>
  </div>
</div>

<!-- Block time modal -->
<div class="modal-overlay" id="modal-block">
  <div class="modal">
    <h2>Block Off Time</h2>
    <div class="form-group">
      <label>Date</label>
      <input type="date" id="block-date">
    </div>
    <div class="form-group">
      <label>What</label>
      <select id="block-type">
        <option value="all">Whole day off</option>
        <option value="morning">Morning only (9am to 2pm)</option>
        <option value="afternoon">Afternoon only (2:30 to 4:30pm)</option>

<script>
// ============================================
// Garden Faery Admin Dashboard v2.0
// PocketBase backend with localStorage fallback
// ============================================

// --- PocketBase Config ---
const PB_URL = 'https://bookings.gardenfaery.love'; // production PocketBase instance
let PB_TOKEN = ''; // Set after admin login

// ============================================
// DATA LAYER
// ============================================
const DB = {
  _usePB: !!PB_URL,

  async _pb(method, path, body) {
    const opts = {
      method: method,
      headers: { 'Content-Type': 'application/json' },
    };
    if (PB_TOKEN) opts.headers['Authorization'] = 'Bearer ' + PB_TOKEN;
    if (body) opts.body = JSON.stringify(body);
    const resp = await fetch(PB_URL + '/api/collections/' + path, opts);
    if (!resp.ok) throw new Error('PocketBase error: ' + resp.status);
    return resp.json();
  },

  // --- Bookings ---
  async getBookings() {
    if (!this._usePB) {
      try { return JSON.parse(localStorage.getItem('gf_bookings_v1') || '[]'); }
      catch { return []; }
    }
    const data = await this._pb('GET', 'bookings/records?perPage=500&sort=-date');
    return (data.items || []).map(r => ({
      id: r.id,
      eventType: r.event_type,
      eventName: r.event_name,
      date: r.date,
      time: r.time,
      duration: r.duration,
      clientName: r.client_name,
      clientEmail: r.client_email,
      clientPhone: r.client_phone,
      clientAddress: r.client_address,
      gardenNotes: r.garden_notes,
      status: r.status,
      bookedBy: r.booked_by,
      rescheduledAt: r.rescheduled_at,
      canceledAt: r.canceled_at,
      canceledBy: r.canceled_by,
      recurringSeriesId: r.recurring_series_id,
      recurringFrequency: r.recurring_frequency,
      price: r.price,
      paid: r.paid,
      paymentMethod: r.payment_method,
      paidDate: r.paid_date,
      paymentNotes: r.payment_notes,
      createdAt: r.created,
    }));
  },

  async saveBooking(booking) {
    if (!this._usePB) {
      const bookings = await this.getBookings();
      bookings.push(booking);
      localStorage.setItem('gf_bookings_v1', JSON.stringify(bookings));
      return booking;
    }
    const data = await this._pb('POST', 'bookings/records', {
      event_type: booking.eventType,
      event_name: booking.eventName,
      date: booking.date,
      time: booking.time,
      duration: booking.duration,
      client_name: booking.clientName,
      client_email: booking.clientEmail,
      client_phone: booking.clientPhone,
      client_address: booking.clientAddress,
      garden_notes: booking.gardenNotes,
      status: booking.status || 'confirmed',
      booked_by: booking.bookedBy || 'admin',
      recurring_series_id: booking.recurringSeriesId || null,
      recurring_frequency: booking.recurringFrequency || null,
    });
    booking.id = data.id;
    return booking;
  },

  async saveBookings(bookings) {
    if (!this._usePB) {
      localStorage.setItem('gf_bookings_v1', JSON.stringify(bookings));
      return;
    }
    // For PocketBase, batch update each changed record
    for (const b of bookings) {
      if (b._dirty && b.id) {
        await this._pb('PATCH', 'bookings/records/' + b.id, {
          status: b.status,
          canceled_at: b.canceledAt,
        });
      }
    }
  },

  async updateBooking(id, updates) {
    if (!this._usePB) {
      const bookings = await this.getBookings();
      const idx = bookings.findIndex(b => b.id === id);
      if (idx >= 0) {
        Object.assign(bookings[idx], updates);
        localStorage.setItem('gf_bookings_v1', JSON.stringify(bookings));
      }
      return;
    }
    const pbUpdates = {};
    if (updates.date !== undefined) pbUpdates.date = updates.date;
    if (updates.eventType !== undefined) pbUpdates.event_type = updates.eventType;
    if (updates.eventName !== undefined) pbUpdates.event_name = updates.eventName;
    if (updates.time !== undefined) pbUpdates.time = updates.time;
    if (updates.status !== undefined) pbUpdates.status = updates.status;
    if (updates.rescheduledAt !== undefined) pbUpdates.rescheduled_at = updates.rescheduledAt;
    if (updates.price !== undefined) pbUpdates.price = updates.price;
    if (updates.paid !== undefined) pbUpdates.paid = updates.paid;
    if (updates.paymentMethod !== undefined) pbUpdates.payment_method = updates.paymentMethod;
    if (updates.paidDate !== undefined) pbUpdates.paid_date = updates.paidDate;
    if (updates.paymentNotes !== undefined) pbUpdates.payment_notes = updates.paymentNotes;
    return this._pb('PATCH', 'bookings/records/' + id, pbUpdates);
  },

  // --- Blocked times ---
  async getBlocks() {
    if (!this._usePB) {
      try { return JSON.parse(localStorage.getItem('gf_blocks_v1') || '[]'); }
      catch { return []; }
    }
    const data = await this._pb('GET', 'blocked_times/records?perPage=500');
    return (data.items || []).map(r => ({
      id: r.id,
      date: r.date,
      allDay: r.all_day,
      startTime: r.start_time,
      endTime: r.end_time,
      reason: r.reason,
    }));
  },

  async saveBlock(block) {
    if (!this._usePB) {
      const blocks = await this.getBlocks();
      blocks.push(block);
      localStorage.setItem('gf_blocks_v1', JSON.stringify(blocks));
      return block;
    }
    const data = await this._pb('POST', 'blocked_times/records', {
      date: block.date,
      all_day: block.allDay,
      start_time: block.startTime,
      end_time: block.endTime,
      reason: block.reason,
    });
    block.id = data.id;
    return block;
  },

  async removeBlock(id) {
    if (!this._usePB) {
      const blocks = (await this.getBlocks()).filter(b => b.id !== id);
      localStorage.setItem('gf_blocks_v1', JSON.stringify(blocks));
      return;
    }
    await fetch(PB_URL + '/api/collections/blocked_times/records/' + id, {
      method: 'DELETE',
      headers: PB_TOKEN ? { 'Authorization': 'Bearer ' + PB_TOKEN } : {},
    });
  },
};

// --- Sync cache for rendering ---
let _cachedBookings = [];
let _cachedBlocks = [];

async function refreshData() {
  try {
    _cachedBookings = await DB.getBookings();
    _cachedBlocks = await DB.getBlocks();
  } catch (err) {
    console.log('Data refresh error:', err);
  }
}

function getBookings() { return _cachedBookings; }
function getBlocks() { return _cachedBlocks; }

const EVENT_LABELS = {
  morning: 'Morning Garden Care',
  afternoon: 'Afternoon Garden Care',
  monday: 'Monday After Ceramics'
};
const EVENT_TIMES = {
  morning: '9:00am to 2:00pm',
  afternoon: '2:30pm to 4:30pm',
  monday: '1:00pm to 4:30pm'
};
const EVENT_TIME_SLOTS = {
  morning: '9:00am',
  afternoon: '2:30pm',
  monday: '1:00pm'
};

let viewDate = new Date();
viewDate.setHours(0,0,0,0);

// --- Tab switching ---
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.tab-panel').forEach(p => p.style.display = 'none');
  document.getElementById('tab-' + tab).style.display = 'block';
  if (tab === 'day') renderDay();
  if (tab === 'month') renderMonth();
  if (tab === 'upcoming') renderUpcoming();
  if (tab === 'clients') renderClients();
  if (tab === 'income') renderIncome();
  if (tab === 'expenses') renderExpenses();
  if (tab === 'settings') renderSettings();
}

// --- Settings (local to device) ---
function renderSettings() {
  const el = document.getElementById('settings-content');
  const key = localStorage.getItem('gf_anthropic_key') || '';
  const masked = key ? (key.slice(0,12) + '…' + key.slice(-6)) : '(not set)';
  el.innerHTML = `
    <div style="background:var(--white);border-radius:12px;padding:16px;box-shadow:var(--shadow);">
      <h3 style="margin-bottom:10px;">Receipt scanner</h3>
      <p style="font-size:0.85rem;color:var(--gray-600);margin-bottom:12px;">
        Paste your Anthropic API key here. It saves on this device only - never sent to the server, never committed anywhere.
      </p>
      <div class="form-group">
        <label>Anthropic API key</label>
        <input type="password" id="setting-api-key" placeholder="${masked}" autocomplete="off">
      </div>
      <div style="display:flex;gap:8px;">
        <button class="modal-btn primary" onclick="saveApiKey()">Save</button>
        ${key ? '<button class="modal-btn secondary" onclick="clearApiKey()">Remove</button>' : ''}
      </div>
      <div id="setting-status" style="font-size:0.85rem;margin-top:8px;"></div>
      <p style="font-size:0.75rem;color:var(--gray-400);margin-top:16px;line-height:1.4;">
        Currently: ${masked}<br>
        Scanning a receipt uses Claude's vision API (~$0.01/scan). Set a monthly cap in your Anthropic console.
      </p>
    </div>
  `;
}
function saveApiKey() {
  const v = document.getElementById('setting-api-key').value.trim();
  if (!v) return;
  if (!v.startsWith('sk-ant-')) {
    document.getElementById('setting-status').innerHTML = '<span style="color:var(--red);">Doesn\'t look like an Anthropic key (should start with sk-ant-)</span>';
    return;
  }
  localStorage.setItem('gf_anthropic_key', v);
  document.getElementById('setting-status').innerHTML = '<span style="color:var(--spring-sage,#6b8f52);">Saved ✓</span>';
  setTimeout(renderSettings, 1000);
}
function clearApiKey() {
  if (!confirm('Remove the saved API key from this device?')) return;
  localStorage.removeItem('gf_anthropic_key');
  renderSettings();
}

// --- Expenses ---
let expenseViewMonth = (() => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); })();
let _cachedExpenses = [];
let _editingExpenseId = null;
let _pendingReceiptFile = null;

async function loadExpenses() {
  try {
    const resp = await fetch(PB_URL + '/api/collections/expenses/records?perPage=500&sort=-date', {
      headers: { 'Authorization': PB_TOKEN }
    });
    if (!resp.ok) return;
    const data = await resp.json();
    _cachedExpenses = (data.items || []).map(r => ({
      id: r.id,
      date: (r.date || '').slice(0,10),
      amount: Number(r.amount) || 0,
      vendor: r.vendor || '',
      category: r.category || '',
      card: r.card || '',
      onBiz: r.on_biz_account,
      notes: r.notes || '',
      receipt: r.receipt || '',
      lineItems: r.line_items || null,
      _collection: r.collectionId
    }));
  } catch(e) { console.error(e); }
}

async function renderExpenses() {
  await loadExpenses();
  const el = document.getElementById('expenses-content');
  const all = _cachedExpenses;
  const months = Array.from(new Set(all.map(e => (e.date||'').slice(0,7)).filter(Boolean))).sort().reverse();
  if (!months.includes(expenseViewMonth)) months.unshift(expenseViewMonth);

  const inMonth = all.filter(e => (e.date||'').slice(0,7) === expenseViewMonth);
  const total = inMonth.reduce((s,e) => s + e.amount, 0);
  const bizTotal = inMonth.filter(e => e.onBiz).reduce((s,e) => s + e.amount, 0);
  const personalTotal = total - bizTotal;

  // Income for same month (P&L)
  const incomeMonth = getBookings().filter(b => b.status !== 'canceled' && (b.date||'').slice(0,7) === expenseViewMonth);
  const gross = incomeMonth.reduce((s,b) => s + (Number(b.price)||0), 0);
  const net = gross - total;

  const monthOpts = months.map(m => `<option value="${m}"${m===expenseViewMonth?' selected':''}>${m}</option>`).join('');

  let html = `
    <div style="background:var(--white);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;">
        <select onchange="expenseViewMonth=this.value;renderExpenses()" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--gray-200);">${monthOpts}</select>
        <button class="modal-btn primary" style="padding:8px 12px;" onclick="openExpenseModal()">+ Add</button>
        <button class="modal-btn secondary" style="padding:8px 12px;" onclick="exportExpenseCsv()">CSV</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;">
        <div><div style="font-size:0.7rem;color:var(--gray-600);">Income</div><div style="font-size:1.05rem;font-weight:700;">$${gross.toFixed(0)}</div></div>
        <div><div style="font-size:0.7rem;color:var(--gray-600);">Expenses</div><div style="font-size:1.05rem;font-weight:700;color:var(--red);">$${total.toFixed(0)}</div></div>
        <div><div style="font-size:0.7rem;color:var(--gray-600);">Net</div><div style="font-size:1.05rem;font-weight:700;color:${net>=0?'#6b8f52':'var(--red)'};">$${net.toFixed(0)}</div></div>
        <div><div style="font-size:0.7rem;color:var(--gray-600);">Biz / Personal</div><div style="font-size:0.85rem;font-weight:700;">$${bizTotal.toFixed(0)} / $${personalTotal.toFixed(0)}</div></div>
      </div>
    </div>
  `;

  html += '<div style="background:var(--white);border-radius:12px;padding:12px;box-shadow:var(--shadow);"><h3 style="margin-bottom:8px;font-size:1rem;">Expenses this month</h3>';
  if (!inMonth.length) {
    html += '<div style="color:var(--gray-600);font-size:0.9rem;">No expenses logged.</div>';
  } else {
    inMonth.sort((a,b) => (b.date||'').localeCompare(a.date||''));
    inMonth.forEach(e => {
      const bizTag = e.onBiz
        ? `<span style="background:#dfe8d4;color:#4a1942;padding:2px 6px;border-radius:8px;font-size:0.7rem;font-weight:700;">BIZ</span>`
        : `<span style="background:var(--gray-100);color:var(--gray-600);padding:2px 6px;border-radius:8px;font-size:0.7rem;font-weight:700;">personal</span>`;
      const cardLabel = (e.card||'').replace('_',' ');
      html += `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--gray-100);">
          <div style="flex:1;min-width:0;">
            <div style="font-weight:600;">${e.date} · ${e.vendor || 'Unknown vendor'}</div>
            <div style="font-size:0.8rem;color:var(--gray-600);">${e.category||'-'} ${cardLabel?'· '+cardLabel:''} ${bizTag}</div>
          </div>
          <div style="display:flex;gap:8px;align-items:center;">
            <div style="font-weight:700;">$${e.amount.toFixed(2)}</div>
            <button class="modal-btn secondary" style="padding:4px 10px;font-size:0.8rem;" onclick="openExpenseModal('${e.id}')">Edit</button>
          </div>
        </div>`;
    });
  }
  html += '</div>';
  el.innerHTML = html;
}

function openExpenseModal(id) {
  _editingExpenseId = id || null;
  _pendingReceiptFile = null;
  const e = id ? _cachedExpenses.find(x => x.id === id) : null;
  document.getElementById('exp-title').textContent = e ? 'Edit expense' : 'New expense';
  document.getElementById('exp-date').value = e ? e.date : formatDate(new Date());
  document.getElementById('exp-amount').value = e ? e.amount : '';
  document.getElementById('exp-vendor').value = e ? e.vendor : '';
  document.getElementById('exp-category').value = e ? e.category : '';
  document.getElementById('exp-card').value = e ? e.card : '';
  document.getElementById('exp-biz').checked = e ? !!e.onBiz : false;
  document.getElementById('exp-notes').value = e ? e.notes : '';
  document.getElementById('exp-scan-status').textContent = '';
  document.getElementById('exp-line-items').innerHTML = (e && e.lineItems) ? renderLineItems(e.lineItems) : '';
  document.getElementById('exp-photo').value = '';
  document.getElementById('modal-expense').classList.add('open');
}

function closeExpenseModal() {
  document.getElementById('modal-expense').classList.remove('open');
  _editingExpenseId = null;
  _pendingReceiptFile = null;
}

function renderLineItems(items) {
  if (!Array.isArray(items) || !items.length) return '';
  let h = '<div style="margin-top:4px;padding:8px;background:var(--gray-100);border-radius:8px;"><b>Line items:</b>';
  items.forEach(i => { h += `<div>${i.description || ''} - $${Number(i.amount||0).toFixed(2)}</div>`; });
  h += '</div>';
  return h;
}

async function saveExpense() {
  const body = {
    date: document.getElementById('exp-date').value,
    amount: parseFloat(document.getElementById('exp-amount').value) || 0,
    vendor: document.getElementById('exp-vendor').value,
    category: document.getElementById('exp-category').value || null,
    card: document.getElementById('exp-card').value || null,
    on_biz_account: document.getElementById('exp-biz').checked,
    notes: document.getElementById('exp-notes').value
  };
  if (!body.date || !body.amount) { alert('Date and amount are required.'); return; }

  try {
    let id = _editingExpenseId;
    if (_pendingReceiptFile) {
      // Use multipart so we can include the file
      const fd = new FormData();
      Object.entries(body).forEach(([k,v]) => fd.append(k, v == null ? '' : (typeof v === 'boolean' ? String(v) : v)));
      fd.append('receipt', _pendingReceiptFile);
      const url = PB_URL + '/api/collections/expenses/records' + (id ? '/'+id : '');
      const r = await fetch(url, {
        method: id ? 'PATCH' : 'POST',
        headers: { 'Authorization': PB_TOKEN },
        body: fd
      });
      if (!r.ok) throw new Error(await r.text());
    } else {
      const url = PB_URL + '/api/collections/expenses/records' + (id ? '/'+id : '');
      const r = await fetch(url, {
        method: id ? 'PATCH' : 'POST',
        headers: { 'Content-Type':'application/json', 'Authorization': PB_TOKEN },
        body: JSON.stringify(body)
      });
      if (!r.ok) throw new Error(await r.text());
    }
    closeExpenseModal();
    renderExpenses();
  } catch (e) {
    alert('Save failed: ' + e.message);
  }
}

function exportExpenseCsv() {
  const inMonth = _cachedExpenses.filter(e => (e.date||'').slice(0,7) === expenseViewMonth);
  const rows = [['Date','Vendor','Amount','Category','Card','On Biz','Notes']];
  inMonth.sort((a,b) => (a.date||'').localeCompare(b.date||''));
  inMonth.forEach(e => {
    rows.push([e.date, e.vendor, e.amount.toFixed(2), e.category, e.card, e.onBiz?'yes':'no', (e.notes||'').replace(/"/g,'""')]);
  });
  const csv = rows.map(r => r.map(c => `"${String(c||'')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type:'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'expenses-' + expenseViewMonth + '.csv'; a.click();
  URL.revokeObjectURL(url);
}

// --- Receipt OCR via Claude Vision API ---
async function scanReceipt(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  _pendingReceiptFile = file;
  const key = localStorage.getItem('gf_anthropic_key');
  const status = document.getElementById('exp-scan-status');
  if (!key) {
    status.innerHTML = '<span style="color:var(--red);">Receipt attached. Set Anthropic API key in ⚙️ Settings to auto-extract fields.</span>';
    return;
  }
  if (file.type === 'application/pdf') {
    status.innerHTML = 'PDF attached (auto-scan only works on images right now - enter details manually).';
    return;
  }
  status.textContent = '📷 Scanning…';
  try {
    // Read as base64
    const buf = await file.arrayBuffer();
    const b64 = btoa(Array.from(new Uint8Array(buf)).map(b => String.fromCharCode(b)).join(''));
    const mediaType = file.type || 'image/jpeg';

    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
        'content-type': 'application/json'
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 1024,
        messages: [{
          role: 'user',
          content: [
            { type: 'image', source: { type: 'base64', media_type: mediaType, data: b64 } },
            { type: 'text', text: `Extract this receipt's details and return ONLY a JSON object (no markdown fences, no prose) with these keys:
{
  "date": "YYYY-MM-DD",
  "vendor": "store name",
  "amount": total as a number (no $),
  "category": one of ["plants","soil_amendments","tools","equipment","fuel","vehicle","supplies","marketing","software","professional_services","other"],
  "line_items": [{"description": "...", "amount": 0.00}]
}
If a field is unclear, use null. Choose the most relevant category for a gardening business.` }
          ]
        }]
      })
    });
    if (!resp.ok) {
      const err = await resp.text();
      status.innerHTML = '<span style="color:var(--red);">Scan failed: ' + err.slice(0,200) + '</span>';
      return;
    }
    const data = await resp.json();
    const raw = (data.content && data.content[0] && data.content[0].text) || '';
    let parsed;
    try {
      parsed = JSON.parse(raw.replace(/^```json\s*|\s*```$/g,'').trim());
    } catch (e) {
      status.innerHTML = '<span style="color:var(--red);">Got response but could not parse JSON. Enter manually.</span>';
      return;
    }
    if (parsed.date) document.getElementById('exp-date').value = parsed.date;
    if (parsed.vendor) document.getElementById('exp-vendor').value = parsed.vendor;
    if (parsed.amount) document.getElementById('exp-amount').value = parsed.amount;
    if (parsed.category) document.getElementById('exp-category').value = parsed.category;
    if (parsed.line_items) document.getElementById('exp-line-items').innerHTML = renderLineItems(parsed.line_items);
    status.innerHTML = '<span style="color:#6b8f52;">Scanned ✓ - review and adjust before saving.</span>';
  } catch (e) {
    status.innerHTML = '<span style="color:var(--red);">Scan error: ' + e.message + '</span>';
  }
}

// --- Income tab ---
let incomeViewMonth = (() => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); })();
let _payingBookingId = null;

function renderIncome() {
  const el = document.getElementById('income-content');
  const all = getBookings().filter(b => b.status !== 'canceled');
  // Pull all months that have bookings
  const months = Array.from(new Set(all.map(b => (b.date||'').slice(0,7)).filter(Boolean))).sort().reverse();
  if (!months.includes(incomeViewMonth)) months.unshift(incomeViewMonth);

  const inMonth = all.filter(b => (b.date||'').slice(0,7) === incomeViewMonth);
  const gross = inMonth.reduce((s,b) => s + (Number(b.price)||0), 0);
  const paid  = inMonth.filter(b => b.paid).reduce((s,b) => s + (Number(b.price)||0), 0);
  const outstanding = gross - paid;

  // Per-client breakdown for the month
  const byClient = {};
  inMonth.forEach(b => {
    const k = b.clientName || 'Unknown';
    if (!byClient[k]) byClient[k] = { count:0, gross:0, paid:0 };
    byClient[k].count++;
    byClient[k].gross += Number(b.price)||0;
    if (b.paid) byClient[k].paid += Number(b.price)||0;
  });

  const monthOpts = months.map(m => `<option value="${m}"${m===incomeViewMonth?' selected':''}>${m}</option>`).join('');

  let html = `
    <div class="card" style="background:var(--white);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;">
        <select onchange="incomeViewMonth=this.value;renderIncome()" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--gray-200);">${monthOpts}</select>
        <button class="modal-btn secondary" style="padding:8px 12px;" onclick="exportIncomeCsv()">CSV</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;">
        <div><div style="font-size:0.75rem;color:var(--gray-600);">Gross</div><div style="font-size:1.3rem;font-weight:700;">$${gross.toFixed(0)}</div></div>
        <div><div style="font-size:0.75rem;color:var(--gray-600);">Paid</div><div style="font-size:1.3rem;font-weight:700;color:var(--spring-sage,#6b8f52);">$${paid.toFixed(0)}</div></div>
        <div><div style="font-size:0.75rem;color:var(--gray-600);">Outstanding</div><div style="font-size:1.3rem;font-weight:700;color:${outstanding>0?'var(--red)':'var(--gray-400)'};">$${outstanding.toFixed(0)}</div></div>
      </div>
    </div>
  `;

  html += '<div style="background:var(--white);border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:var(--shadow);"><h3 style="margin-bottom:8px;font-size:1rem;">Bookings this month</h3>';
  if (!inMonth.length) {
    html += '<div style="color:var(--gray-600);font-size:0.9rem;">No bookings.</div>';
  } else {
    inMonth.sort((a,b) => (a.date||'').localeCompare(b.date||''));
    inMonth.forEach(b => {
      const price = Number(b.price)||0;
      const paidBadge = b.paid
        ? `<span style="background:#dfe8d4;color:#4a1942;padding:2px 8px;border-radius:10px;font-size:0.75rem;font-weight:700;">PAID ${b.paymentMethod? '· '+b.paymentMethod:''}</span>`
        : (price > 0 ? `<span style="background:var(--red-light);color:var(--red);padding:2px 8px;border-radius:10px;font-size:0.75rem;font-weight:700;">UNPAID</span>` : `<span style="color:var(--gray-400);font-size:0.8rem;">no price</span>`);
      html += `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--gray-100);">
          <div style="flex:1;min-width:0;">
            <div style="font-weight:600;">${b.date} · ${b.clientName||'Client'}</div>
            <div style="font-size:0.8rem;color:var(--gray-600);">${EVENT_LABELS[b.eventType]||b.eventType} · $${price.toFixed(0)}</div>
          </div>
          <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;">${paidBadge}${!b.paid && price > 0 ? `<button class="modal-btn primary" style="padding:4px 10px;font-size:0.8rem;" onclick="quickMarkPaid('${b.id}')">Paid</button><button class="modal-btn secondary" style="padding:4px 10px;font-size:0.8rem;" onclick="sendInvoice('${b.id}')">Invoice</button>` : ''}<button class="modal-btn secondary" style="padding:4px 10px;font-size:0.8rem;" onclick="openPayment('${b.id}')">Edit</button></div>
        </div>`;
    });
  }
  html += '</div>';

  html += '<div style="background:var(--white);border-radius:12px;padding:12px;box-shadow:var(--shadow);"><h3 style="margin-bottom:8px;font-size:1rem;">By client</h3>';
  const clientRows = Object.entries(byClient).sort((a,b) => b[1].gross - a[1].gross);
  if (!clientRows.length) {
    html += '<div style="color:var(--gray-600);font-size:0.9rem;">-</div>';
  } else {
    clientRows.forEach(([name, s]) => {
      html += `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--gray-100);font-size:0.9rem;">
        <span>${name} <span style="color:var(--gray-600);font-size:0.8rem;">(${s.count})</span></span>
        <span><b>$${s.gross.toFixed(0)}</b> <span style="color:var(--gray-600);font-size:0.8rem;">(${s.paid.toFixed(0)} paid)</span></span>
      </div>`;
    });
  }
  html += '</div>';

  el.innerHTML = html;
}

function openPayment(bookingId) {
  const b = getBookings().find(x => x.id === bookingId);
  if (!b) return;
  _payingBookingId = bookingId;
  document.getElementById('pay-booking-info').textContent = `${b.date} · ${b.clientName||'Client'} · ${EVENT_LABELS[b.eventType]||b.eventType}`;
  document.getElementById('pay-price').value = b.price || '';
  document.getElementById('pay-paid').checked = !!b.paid;
  document.getElementById('pay-method').value = b.paymentMethod || '';
  document.getElementById('pay-date').value = (b.paidDate||'').slice(0,10);
  document.getElementById('pay-notes').value = b.paymentNotes || '';
  document.getElementById('modal-payment').classList.add('open');
}

async function savePayment() {
  if (!_payingBookingId) return;
  const price = parseFloat(document.getElementById('pay-price').value) || 0;
  const paid = document.getElementById('pay-paid').checked;
  const method = document.getElementById('pay-method').value || null;
  const paidDate = document.getElementById('pay-date').value || null;
  const notes = document.getElementById('pay-notes').value || '';
  // If marking paid and no date set, default to today
  const finalDate = paid && !paidDate ? formatDate(new Date()) : paidDate;
  try {
    await DB.updateBooking(_payingBookingId, {
      price, paid, paymentMethod: method, paidDate: finalDate, paymentNotes: notes
    });
    // Update cache
    const b = _cachedBookings.find(x => x.id === _payingBookingId);
    if (b) { b.price = price; b.paid = paid; b.paymentMethod = method; b.paidDate = finalDate; b.paymentNotes = notes; }
    closeModal('modal-payment');
    _payingBookingId = null;
    renderIncome();
  } catch (e) {
    alert('Save failed: ' + e.message);
  }
}

async function quickMarkPaid(bookingId) {
  const b = getBookings().find(x => x.id === bookingId);
  if (!b) return;
  const method = prompt('Payment method? (cash, check, card, venmo, zelle, other)', b.paymentMethod || 'cash');
  if (method === null) return;
  const today = formatDate(new Date());
  try {
    await DB.updateBooking(bookingId, { paid: true, paymentMethod: method || null, paidDate: today });
    const cached = _cachedBookings.find(x => x.id === bookingId);
    if (cached) { cached.paid = true; cached.paymentMethod = method || null; cached.paidDate = today; }
    renderIncome();
  } catch (e) {
    alert('Save failed: ' + e.message);
  }
}

function sendInvoice(bookingId) {
  const b = getBookings().find(x => x.id === bookingId);
  if (!b) return;
  const price = Number(b.price) || 0;
  const service = EVENT_LABELS[b.eventType] || b.eventType || 'Garden care visit';
  const to = b.clientEmail || '';
  const subject = `Invoice from Garden Faery — ${b.date}`;
  const body =
    `Hi ${(b.clientName || '').split(' ')[0] || 'there'},\n\n` +
    `Thanks so much for having me in the garden on ${b.date}. Here is your invoice:\n\n` +
    `  Service:  ${service}\n` +
    `  Date:     ${b.date}\n` +
    `  Amount:   $${price.toFixed(0)}\n\n` +
    `Payment options:\n` +
    `  Venmo:   @gardenfaery\n` +
    `  Zelle:   taya@gardenfaery.love\n` +
    `  Check:   payable to Taya (address on request)\n` +
    `  Cash:    next visit is fine too\n\n` +
    `Just reply to this email if anything looks off or you want to reschedule something.\n\n` +
    `Whimsy,\n` +
    `Taya\n` +
    `Your local Garden Faery. Arcata & Humboldt County.\n` +
    `taya@gardenfaery.love`;
  const mailto = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  window.location.href = mailto;
}

function exportIncomeCsv() {
  const inMonth = getBookings().filter(b => b.status !== 'canceled' && (b.date||'').slice(0,7) === incomeViewMonth);
  const rows = [['Date','Client','Service','Price','Paid','Method','Paid Date','Notes']];
  inMonth.sort((a,b) => (a.date||'').localeCompare(b.date||''));
  inMonth.forEach(b => {
    rows.push([
      b.date || '',
      b.clientName || '',
      EVENT_LABELS[b.eventType] || b.eventType || '',
      Number(b.price)||0,
      b.paid ? 'yes' : 'no',
      b.paymentMethod || '',
      (b.paidDate||'').slice(0,10),
      (b.paymentNotes||'').replace(/"/g,'""')
    ]);
  });
  const csv = rows.map(r => r.map(c => `"${String(c)}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type:'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'income-' + incomeViewMonth + '.csv'; a.click();
  URL.revokeObjectURL(url);
}

// --- Week strip ---
function renderWeekStrip() {
  const grid = document.getElementById('week-grid');
  const dayNames = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  const today = new Date(); today.setHours(0,0,0,0);

  // Find Monday of current week
  const weekStart = new Date(viewDate);
  weekStart.setDate(weekStart.getDate() - ((weekStart.getDay() + 6) % 7));

  const bookings = getBookings().filter(b => b.status !== 'canceled');
  let html = '';

  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart);
    d.setDate(d.getDate() + i);
    const ds = formatDate(d);
    const isToday = d.getTime() === today.getTime();
    const isActive = d.getTime() === viewDate.getTime();

    const dayBookings = bookings.filter(b => b.date === ds);
    let dots = '';
    if (dayBookings.some(b => b.eventType === 'morning')) dots += '<span class="dot morning-dot"></span>';
    if (dayBookings.some(b => b.eventType === 'afternoon')) dots += '<span class="dot afternoon-dot"></span>';
    if (dayBookings.some(b => b.eventType === 'monday')) dots += '<span class="dot monday-dot"></span>';
    const dayBlocks = getBlocks().filter(b => b.date === ds);
    if (dayBlocks.length > 0) dots += '<span class="dot blocked-dot"></span>';

    let cls = 'week-day';
    if (isActive) cls += ' active';
    if (isToday) cls += ' today-marker';

    html += '<div class="' + cls + '" onclick="jumpToDate(\'' + ds + '\')">' +
      '<div class="dow">' + dayNames[d.getDay()] + '</div>' +
      '<div class="dom">' + d.getDate() + '</div>' +
      '<div class="dots">' + dots + '</div></div>';
  }
  grid.innerHTML = html;
}

function jumpToDate(ds) {
  const parts = ds.split('-');
  viewDate = new Date(parts[0], parts[1]-1, parts[2]);
  renderAll();
}

function goToday() {
  viewDate = new Date();
  viewDate.setHours(0,0,0,0);
  renderAll();
}

// --- Day view ---
function renderDay() {
  const container = document.getElementById('day-content');
  const ds = formatDate(viewDate);
  const bookings = getBookings().filter(b => b.date === ds && b.status !== 'canceled');
  const blocks = getBlocks().filter(b => b.date === ds);
  const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  const dateLabel = dayNames[viewDate.getDay()] + ', ' + monthNames[viewDate.getMonth()] + ' ' + viewDate.getDate();

  let html = '<div class="day-nav">' +
    '<button class="day-btn" onclick="prevDay()">&#8592;</button>' +
    '<h2>' + dateLabel + '</h2>' +
    '<button class="day-btn" onclick="nextDay()">&#8594;</button></div>';

  if (bookings.length === 0 && blocks.length === 0) {
    const dow = viewDate.getDay();
    if (dow === 0 || dow === 6) {
      html += '<div class="empty-day"><p>Weekend! Enjoy it.</p></div>';
    } else if (dow === 1) {
      html += '<div class="empty-day"><p>Ceramics morning. Open for garden work 1 to 4:30pm.</p></div>';
    } else {
      html += '<div class="empty-day"><p>Nothing booked yet. Wide open!</p></div>';
    }
  } else {
    html += '<div class="timeline">';

    // Sort by time
    const allItems = [];
    bookings.forEach(b => {
      const sortTime = b.eventType === 'morning' ? '09:00' :
                       b.eventType === 'monday' ? '13:00' :
                       b.eventType === 'afternoon' ? '14:30' : '17:00';
      allItems.push({ type: 'booking', data: b, sortTime });
    });
    blocks.forEach(b => {
      allItems.push({ type: 'block', data: b, sortTime: b.startTime || '00:00' });
    });
    allItems.sort((a, b) => a.sortTime.localeCompare(b.sortTime));

    allItems.forEach(item => {
      if (item.type === 'booking') {
        const b = item.data;
        html += '<div class="time-marker">' +
          '<span class="time-label">' + b.time + '</span>' +
          '<span class="time-dot" style="background: var(--' +
            (b.eventType === 'morning' ? 'pollen-gold' : b.eventType === 'afternoon' ? 'petal-pink' : 'spring-sage') +
          ')"></span>' +
          '<div class="booking-card ' + b.eventType + '">' +
          '<h3>' + b.clientName +
            (b.recurringSeriesId ? '<span class="series-badge">' + (b.recurringFrequency || 'recurring') + '</span>' : '') +
          '</h3>' +
          '<div class="booking-meta">' + EVENT_LABELS[b.eventType] + ' (' + EVENT_TIMES[b.eventType] + ')</div>' +
          '<div class="booking-client">' +
            (b.clientPhone ? b.clientPhone : '') +
            (b.clientAddress ? ' &middot; ' + b.clientAddress : '') +
          '</div>' +
          (b.gardenNotes ? '<div class="booking-meta" style="margin-top:6px;font-style:italic;">"' + b.gardenNotes + '"</div>' : '') +
          '<div class="booking-actions">' +
            '<button class="action-btn" onclick="callClient(\'' + (b.clientPhone || '') + '\')">Call</button>' +
            '<button class="action-btn" onclick="textClient(\'' + (b.clientPhone || '') + '\')">Text</button>' +
            '<button class="action-btn" onclick="openReschedule(\'' + b.id + '\')">Reschedule</button>' +
            '<button class="action-btn danger" onclick="cancelBooking(\'' + b.id + '\')">Cancel</button>' +
            (b.recurringSeriesId ? '<button class="action-btn danger" onclick="cancelSeries(\'' + b.recurringSeriesId + '\')">Cancel Series</button>' : '') +
          '</div></div></div>';
      } else {
        const b = item.data;
        html += '<div class="time-marker">' +
          '<span class="time-label">' + (b.allDay ? 'all day' : b.startTime) + '</span>' +
          '<span class="time-dot" style="background: var(--gray-400)"></span>' +
          '<div class="booking-card blocked">' +
          '<h3>Blocked: ' + (b.reason || 'Time off') + '</h3>' +
          '<div class="booking-meta">' + (b.allDay ? 'All day' : b.startTime + ' to ' + b.endTime) + '</div>' +
          '<div class="booking-actions">' +
            '<button class="action-btn danger" onclick="removeBlock(\'' + b.id + '\')">Remove</button>' +
          '</div></div></div>';
      }
    });

    html += '</div>';
  }

  container.innerHTML = html;
}

function prevDay() {
  viewDate.setDate(viewDate.getDate() - 1);
  renderAll();
}
function nextDay() {
  viewDate.setDate(viewDate.getDate() + 1);
  renderAll();
}

// --- Upcoming view ---
let monthViewDate = (() => { const d = new Date(); d.setDate(1); d.setHours(0,0,0,0); return d; })();

function prevMonth() { monthViewDate = new Date(monthViewDate.getFullYear(), monthViewDate.getMonth() - 1, 1); renderMonth(); }
function nextMonth() { monthViewDate = new Date(monthViewDate.getFullYear(), monthViewDate.getMonth() + 1, 1); renderMonth(); }

function renderMonth() {
  const container = document.getElementById('month-content');
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const y = monthViewDate.getFullYear();
  const m = monthViewDate.getMonth();
  const firstDay = new Date(y, m, 1);
  const lastDay = new Date(y, m + 1, 0);
  const startPad = firstDay.getDay();
  const totalDays = lastDay.getDate();
  const today = formatDate(new Date());

  const bookings = getBookings().filter(b => b.status !== 'canceled' && (b.date || '').startsWith(y + '-' + String(m+1).padStart(2,'0')));
  const blocks = getBlocks().filter(b => (b.date || '').startsWith(y + '-' + String(m+1).padStart(2,'0')));

  let html = '<div class="month-nav">' +
    '<button class="day-btn" onclick="prevMonth()">&#8592;</button>' +
    '<h2>' + monthNames[m] + ' ' + y + '</h2>' +
    '<button class="day-btn" onclick="nextMonth()">&#8594;</button></div>';

  html += '<div class="month-grid">';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => { html += '<div class="month-dow">' + d + '</div>'; });

  for (let i = 0; i < startPad; i++) html += '<div class="month-cell empty"></div>';

  for (let d = 1; d <= totalDays; d++) {
    const ds = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    const dayBookings = bookings.filter(b => b.date === ds);
    const dayBlocks = blocks.filter(b => b.date === ds);
    const isToday = ds === today;

    let cell = '<div class="month-cell' + (isToday ? ' today' : '') + '" onclick="jumpToDay(\'' + ds + '\')">';
    cell += '<div class="mc-num">' + d + '</div>';

    const maxShow = 2;
    const items = [];
    dayBookings.forEach(b => {
      const type = b.eventType || 'afternoon';
      const label = (b.clientName || '').split(' ')[0] || '·';
      items.push({cls: type, label: label});
    });
    dayBlocks.forEach(b => items.push({cls: 'blocked', label: b.reason || 'Blocked'}));

    items.slice(0, maxShow).forEach(it => {
      cell += '<div class="mc-evt ' + it.cls + '">' + escapeHtml(it.label) + '</div>';
    });
    if (items.length > maxShow) {
      cell += '<div class="mc-more">+' + (items.length - maxShow) + ' more</div>';
    }
    cell += '</div>';
    html += cell;
  }
  html += '</div>';

  container.innerHTML = html;
}

function jumpToDay(ds) {
  const [y, m, d] = ds.split('-').map(Number);
  viewDate = new Date(y, m - 1, d);
  viewDate.setHours(0,0,0,0);
  switchTab('day');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderUpcoming() {
  const container = document.getElementById('upcoming-content');
  const today = formatDate(new Date());
  const bookings = getBookings()
    .filter(b => b.date >= today && b.status !== 'canceled')
    .sort((a, b) => a.date.localeCompare(b.date));

  if (bookings.length === 0) {
    container.innerHTML = '<div class="empty-day"><p>No upcoming bookings. Time to put the word out!</p></div>';
    return;
  }

  let html = '';
  let lastDate = '';
  const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  bookings.forEach(b => {
    if (b.date !== lastDate) {
      const parts = b.date.split('-');
      const d = new Date(parts[0], parts[1]-1, parts[2]);
      const label = dayNames[d.getDay()] + ', ' + monthNames[d.getMonth()] + ' ' + d.getDate();
      html += '<div style="font-weight:700; font-size:0.85rem; color:var(--gray-400); margin: 16px 0 8px; text-transform: uppercase;">' + label + '</div>';
      lastDate = b.date;
    }
    html += '<div class="booking-card ' + b.eventType + '">' +
      '<h3>' + b.clientName + '</h3>' +
      '<div class="booking-meta">' + EVENT_LABELS[b.eventType] + ' at ' + b.time + '</div>' +
      '<div class="booking-client">' +
        (b.clientPhone ? b.clientPhone : '') +
        (b.clientAddress ? ' &middot; ' + b.clientAddress : '') +
      '</div></div>';
  });

  container.innerHTML = html;
}

// --- Clients view ---
function renderClients() {
  const container = document.getElementById('clients-content');
  const bookings = getBookings().filter(b => b.status !== 'canceled');

  // Group by client email
  const clients = {};
  bookings.forEach(b => {
    const key = b.clientEmail || b.clientName;
    if (!clients[key]) {
      clients[key] = {
        name: b.clientName,
        email: b.clientEmail,
        phone: b.clientPhone,
        address: b.clientAddress,
        visits: 0,
        lastVisit: b.date
      };
    }
    clients[key].visits++;
    if (b.date > clients[key].lastVisit) clients[key].lastVisit = b.date;
    if (b.clientPhone && !clients[key].phone) clients[key].phone = b.clientPhone;
  });

  const sorted = Object.values(clients).sort((a, b) => b.visits - a.visits);

  if (sorted.length === 0) {
    container.innerHTML = '<div class="empty-day"><p>No clients yet. They\'ll show up here as bookings come in.</p></div>';
    return;
  }

  let html = '';
  sorted.forEach(c => {
    html += '<div class="booking-card" style="border-left-color: var(--plum);">' +
      '<h3>' + c.name + '</h3>' +
      '<div class="booking-meta">' + c.visits + ' visit' + (c.visits > 1 ? 's' : '') + ' &middot; Last: ' + c.lastVisit + '</div>' +
      '<div class="booking-client">' +
        (c.phone ? c.phone + ' ' : '') +
        (c.email ? c.email : '') +
      '</div>' +
      '<div class="booking-actions">' +
        (c.phone ? '<button class="action-btn" onclick="callClient(\'' + c.phone + '\')">Call</button>' +
        '<button class="action-btn" onclick="textClient(\'' + c.phone + '\')">Text</button>' : '') +
      '</div></div>';
  });
  container.innerHTML = html;
}

// --- Actions ---
function callClient(phone) {
  if (phone) window.location.href = 'tel:' + phone.replace(/[^\d+]/g, '');
}
function textClient(phone) {
  if (phone) window.location.href = 'sms:' + phone.replace(/[^\d+]/g, '');
}

async function cancelBooking(id) {
  if (!confirm('Cancel this booking? The client won\'t be notified automatically, so you\'ll want to text them.')) return;
  try {
    await DB.updateBooking(id, { status: 'canceled' });
    await refreshData();
    renderAll();
  } catch (err) {
    alert('Could not cancel booking. Try again.');
  }
}

async function cancelSeries(seriesId) {
  const bookings = getBookings();
  const today = formatDate(new Date());
  const futureInSeries = bookings.filter(b =>
    b.recurringSeriesId === seriesId && b.status !== 'canceled' && b.date >= today
  );

  if (!confirm('Cancel all ' + futureInSeries.length + ' upcoming visits in this series? Past visits stay on record. You\'ll want to text the client.')) return;

  try {
    for (const b of futureInSeries) {
      await DB.updateBooking(b.id, { status: 'canceled' });
    }
    await refreshData();
    renderAll();
  } catch (err) {
    alert('Could not cancel series. Try again.');
  }
}

async function removeBlock(id) {
  if (!confirm('Remove this blocked time?')) return;
  try {
    await DB.removeBlock(id);
    await refreshData();
    renderAll();
  } catch (err) {
    alert('Could not remove block. Try again.');
  }
}

// --- Modals ---
function openModal(id) {
  const modal = document.getElementById(id);
  const dateInput = modal.querySelector('input[type="date"]');
  if (dateInput) dateInput.value = formatDate(viewDate);
  modal.classList.add('open');
}
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

document.getElementById('block-type').addEventListener('change', function() {
  document.getElementById('block-custom-times').style.display = this.value === 'custom' ? 'block' : 'none';
});

document.getElementById('obo-recurring').addEventListener('change', function() {
  document.getElementById('obo-weeks-group').style.display = this.value === 'none' ? 'none' : 'block';
});

async function saveBlock() {
  const date = document.getElementById('block-date').value;
  const type = document.getElementById('block-type').value;
  const reason = document.getElementById('block-reason').value.trim();

  if (!date) { alert('Pick a date.'); return; }

  const block = {
    id: 'blk_' + Date.now(),
    date: date,
    allDay: type === 'all',
    startTime: type === 'morning' ? '09:00' : type === 'afternoon' ? '14:30' : type === 'custom' ? document.getElementById('block-start').value : null,
    endTime: type === 'morning' ? '14:00' : type === 'afternoon' ? '16:30' : type === 'custom' ? document.getElementById('block-end').value : null,
    reason: reason
  };

  try {
    await DB.saveBlock(block);
    closeModal('modal-block');
    await refreshData();
    renderAll();
  } catch (err) {
    alert('Could not save block. Try again.');
  }
}

async function saveOBO() {
  const eventType = document.getElementById('obo-event').value;
  const date = document.getElementById('obo-date').value;
  const name = document.getElementById('obo-name').value.trim();
  const email = document.getElementById('obo-email').value.trim();
  const phone = document.getElementById('obo-phone').value.trim();
  const address = document.getElementById('obo-address').value.trim();
  const notes = document.getElementById('obo-notes').value.trim();
  const recurring = document.getElementById('obo-recurring').value;
  const weeks = parseInt(document.getElementById('obo-weeks').value) || 12;

  if (!date || !name) { alert('Need at least a date and client name.'); return; }

  const seriesId = recurring !== 'none' ? 'series_' + Date.now() : null;
  const interval = recurring === 'biweekly' ? 14 : 7;
  const count = recurring === 'none' ? 1 : weeks;

  let booked = 0;
  try {
    for (let i = 0; i < count; i++) {
      const d = new Date(date + 'T12:00:00');
      d.setDate(d.getDate() + (i * interval));
      const ds = formatDate(d);

      const booking = {
        id: 'b_' + Date.now() + '_' + i,
        eventType: eventType,
        eventName: EVENT_LABELS[eventType],
        date: ds,
        time: EVENT_TIME_SLOTS[eventType],
        clientName: name,
        clientEmail: email,
        clientPhone: phone,
        clientAddress: address,
        gardenNotes: notes,
        status: 'confirmed',
        createdAt: new Date().toISOString(),
        bookedBy: 'admin',
        recurringSeriesId: seriesId,
        recurringFrequency: recurring !== 'none' ? recurring : null
      };
      await DB.saveBooking(booking);
      booked++;
    }

    closeModal('modal-book');

    // Reset recurring fields
    document.getElementById('obo-recurring').value = 'none';
    document.getElementById('obo-weeks-group').style.display = 'none';

    if (booked > 1) {
      alert('Booked ' + name + ' for ' + booked + ' ' + recurring + ' visits starting ' + date + '.');
    }
    await refreshData();
    renderAll();
  } catch (err) {
    alert('Could not save booking. Try again.');
  }
}

// --- Reschedule ---
let rescheduleBookingId = null;

function openReschedule(id) {
  rescheduleBookingId = id;
  const bookings = getBookings();
  const b = bookings.find(x => x.id === id);
  if (!b) return;

  document.getElementById('reschedule-info').innerHTML =
    '<div style="padding:10px 0; margin-bottom:12px; border-bottom:1px solid var(--gray-200);">' +
    '<strong>' + b.clientName + '</strong><br>' +
    '<span style="color:var(--gray-600); font-size:0.9rem;">' + b.eventName + ' on ' + b.date + ' at ' + b.time + '</span></div>';

  document.getElementById('reschedule-date').value = b.date;
  document.getElementById('reschedule-slot').value = b.eventType;
  document.getElementById('modal-reschedule').classList.add('open');
}

async function confirmReschedule() {
  if (!rescheduleBookingId) return;
  const newDate = document.getElementById('reschedule-date').value;
  const newSlot = document.getElementById('reschedule-slot').value;
  if (!newDate) { alert('Pick a new date.'); return; }

  try {
    await DB.updateBooking(rescheduleBookingId, {
      date: newDate,
      eventType: newSlot,
      eventName: EVENT_LABELS[newSlot],
      time: EVENT_TIME_SLOTS[newSlot],
      status: 'confirmed',
      rescheduledAt: new Date().toISOString(),
    });
    closeModal('modal-reschedule');
    rescheduleBookingId = null;
    await refreshData();
    renderAll();
  } catch (err) {
    alert('Could not reschedule. Try again.');
  }
}

// --- Helpers ---
function formatDate(date) {
  return date.getFullYear() + '-' +
    String(date.getMonth() + 1).padStart(2, '0') + '-' +
    String(date.getDate()).padStart(2, '0');
}

function renderAll() {
  renderWeekStrip();
  renderDay();
  renderTomorrowBanner();
}

// --- Tomorrow's schedule banner ---
function renderTomorrowBanner() {
  const banner = document.getElementById('tomorrow-banner');
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  tomorrow.setHours(0,0,0,0);
  const ds = formatDate(tomorrow);
  const dow = tomorrow.getDay();

  const bookings = getBookings().filter(b => b.date === ds && b.status !== 'canceled');
  const blocks = getBlocks().filter(b => b.date === ds);

  // Don't show banner if it's Saturday evening (tomorrow = Sunday) or we're looking at a different day
  if (dow === 0 || dow === 6) {
    banner.style.display = 'none';
    return;
  }

  if (bookings.length === 0 && blocks.length === 0) {
    banner.style.display = 'block';
    banner.innerHTML = '<h3>Tomorrow</h3><div class="tomorrow-empty">Nothing booked. Wide open!</div>';
    return;
  }

  let html = '<h3>Tomorrow</h3>';

  blocks.forEach(b => {
    html += '<div class="tomorrow-item" style="color:var(--gray-600);">Blocked: ' +
      (b.reason || 'Time off') + ' (' + (b.allDay ? 'all day' : b.startTime + ' to ' + b.endTime) + ')</div>';
  });

  bookings.sort((a, b) => {
    const timeA = a.eventType === 'morning' ? '09:00' : a.eventType === 'monday' ? '13:00' : '14:30';
    const timeB = b.eventType === 'morning' ? '09:00' : b.eventType === 'monday' ? '13:00' : '14:30';
    return timeA.localeCompare(timeB);
  });

  bookings.forEach(b => {
    html += '<div class="tomorrow-item">' + b.time + ' ' + b.clientName +
      ' (' + EVENT_LABELS[b.eventType] + ')</div>';
  });

  banner.style.display = 'block';
  banner.innerHTML = html;
}

// --- Login ---
const ADMIN_PIN_HASH_KEY = 'gf_admin_pin';
const ADMIN_SESSION_KEY = 'gf_admin_session';

function isLoggedIn() {
  // If PocketBase is configured, check for auth token
  if (PB_URL && PB_TOKEN) return true;
  // For localStorage mode, check session (valid for 24 hours)
  const session = localStorage.getItem(ADMIN_SESSION_KEY);
  if (!session) return false;
  try {
    const s = JSON.parse(session);
    return s.expires > Date.now();
  } catch { return false; }
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-wrap').classList.add('visible');
  refreshData().then(() => renderAll());
}

function togglePinVisibility() {
  const input = document.getElementById('login-pin');
  const btn = document.getElementById('pin-toggle');
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '🙈';
    btn.setAttribute('aria-label', 'Hide PIN');
  } else {
    input.type = 'password';
    btn.textContent = '👁';
    btn.setAttribute('aria-label', 'Show PIN');
  }
}

async function doLogin() {
  const pin = document.getElementById('login-pin').value;
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-error');

  if (!pin) return;
  btn.disabled = true;
  err.style.display = 'none';

  if (PB_URL) {
    // Authenticate with PocketBase admin API
    try {
      const resp = await fetch(PB_URL + '/api/collections/_superusers/auth-with-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ identity: 'taya@gardenfaery.love', password: pin }),
      });
      if (!resp.ok) throw new Error('Auth failed');
      const data = await resp.json();
      PB_TOKEN = data.token;
      showApp();
      return;
    } catch (e) {
      err.style.display = 'block';
      btn.disabled = false;
      return;
    }
  }

  // localStorage mode: first login sets the PIN, subsequent logins check it
  const storedHash = localStorage.getItem(ADMIN_PIN_HASH_KEY);
  const pinHash = await hashPin(pin);

  if (!storedHash) {
    // First time: set the PIN
    localStorage.setItem(ADMIN_PIN_HASH_KEY, pinHash);
    localStorage.setItem(ADMIN_SESSION_KEY, JSON.stringify({ expires: Date.now() + 86400000 }));
    showApp();
  } else if (pinHash === storedHash) {
    localStorage.setItem(ADMIN_SESSION_KEY, JSON.stringify({ expires: Date.now() + 86400000 }));
    showApp();
  } else {
    err.style.display = 'block';
    btn.disabled = false;
  }
}

async function hashPin(pin) {
  // Simple hash using SubtleCrypto (SHA-256)
  const encoder = new TextEncoder();
  const data = encoder.encode('gf_salt_' + pin);
  const hash = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// Allow Enter key to submit
document.getElementById('login-pin').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});

// --- Init ---
if (isLoggedIn()) {
  showApp();
} else {
  document.getElementById('login-screen').style.display = 'flex';
}
