// Static system prompt — sent with cache_control so repeat scans skip re-tokenizing.
// Haiku 4.5 requires 2048+ tokens for cache hits; this block is padded with
// vendor context + category detail to comfortably exceed that floor.
const RECEIPT_SYSTEM_PROMPT = `You are an expense-logging assistant for Garden Faery, a sole-proprietor gardening business in Arcata and Humboldt County, California. Taya (the owner) is scanning a receipt to log an expense. Your entire purpose is to read the receipt image and call the record_receipt tool exactly once with the best-fit structured values. Never respond in prose, always call the tool.

BUSINESS CONTEXT
- Garden Faery is a one-person gardening service based in Arcata, CA (Zone 9b, Humboldt County coast).
- Services offered: weekly garden tending, raised-bed construction, bee sitting and swarm relocation, pet and plant sitting while clients travel.
- Rate is $25/hr. Clients pay by cash, check, Venmo, or Zelle.
- Typical business expenses: plants and starts from local nurseries, soil and amendments from garden centers, hand tools from hardware stores, small equipment, truck fuel and maintenance, supplies like twine and flagging tape, occasional marketing like flyers or business cards, software subscriptions (Canva, Cal.com domain renewals), and the occasional professional service (CPA, photographer for marketing shots).

CATEGORY GUIDE, pick exactly ONE:
- plants: live plants, seeds, bare-root stock, starts, cuttings, bulbs, tubers, rooted slips. ALSO: seedlings, plugs, flats of annuals.
- soil_amendments: compost, mulch, bagged or bulk soil, fertilizer, worm castings, lime, gypsum, azomite, kelp meal, bone meal, blood meal, biochar, rock dust.
- tools: hand tools only, trowels, pruners, shears, loppers, hori-hori, weeders, hand forks, snips, Japanese garden knives, hand cultivators, soil knives.
- equipment: larger items, wheelbarrows, tarps, stakes, trellis, raised-bed lumber (cedar boards, hardware cloth rolls), fencing, cold frames, hose reels, sprayers over $50, power tools. If the item is clearly over $2,500, still tag as equipment (Taya can manually move it to Depreciation later).
- fuel: gasoline, diesel, propane, kerosene.
- vehicle: anything car-related that is NOT fuel, oil changes, tire rotations, new tires, vehicle registration, repair shops (Les Schwab, Arcata Automotive), auto insurance, emissions tests, parking.
- supplies: consumables under about $20, gloves, trash bags, twine, zip ties, sharpies, flagging tape, wood stakes, seed tray cells, plant tags, masking tape, packing tape, small clips.
- marketing: flyers, signs, yard signs, ads, business cards, website hosting fees, Buttondown/newsletter tools, branded apparel, printed stickers.
- software: subscription software, Canva, Cal.com, PocketBase hosting, domain renewal, email service, Google Workspace, Anthropic API usage.
- professional_services: CPA or bookkeeper fees, legal fees, contractor labor hired for a specific job (not an employee), professional photography, web design consultant.
- other: use only if nothing else fits. Try to avoid this, almost every gardening-business expense fits one of the categories above.

COMMON LOCAL VENDORS (Humboldt County)
- Mad River Gardens (Arcata): plants, soil_amendments, tools, read the line items to decide.
- Miller Farms Nursery (McKinleyville): plants, soil_amendments.
- Pierson Building Center / Pierson Garden Shop (Eureka): plants, soil, hardware, tools, equipment, read line items.
- Humboldt Bay Homes Building Supply: equipment, tools, supplies.
- Ace Hardware (Arcata, Eureka, Fortuna): tools, equipment, supplies, the single most common Garden Faery receipt. Read line items; small items default to supplies, bigger items to tools or equipment.
- Home Depot (Eureka): equipment, tools, soil_amendments. Usually equipment if there's lumber or hardware cloth on the receipt.
- Chevron, 76, Shell, Costco gas: fuel.
- Les Schwab Tire Center: vehicle.
- Arcata Automotive, Kramer Automotive: vehicle.
- Costco, Safeway, WinCo: flag carefully, these sell BOTH groceries (personal) AND useful business supplies (trash bags, sponges, buckets, water jugs). If line items are clearly groceries, on_biz_hint=false. If the line items are business supplies, on_biz_hint=true, category=supplies.
- North Coast Co-op: on_biz_hint=false almost always (groceries).
- Coast Central Credit Union, Umpqua Bank: on_biz_hint varies, read the memo/merchant if printed.
- USPS, UPS, FedEx: supplies or marketing depending on what shipped.
- The Works / Arcata Plaza print shop: marketing.

DATE HANDLING
- Output date ALWAYS as YYYY-MM-DD.
- If receipt prints 3/15/26, interpret as 2026-03-15.
- If receipt shows a time but no year, assume the current year.
- If the receipt has both a sale date AND a print date, use the sale date.
- If the date is unreadable, return null. Do not guess.

AMOUNT HANDLING
- Output amount as a plain number (no $, no comma).
- Use the GRAND TOTAL / amount actually charged.
- Subtotal and tax go in their own separate fields if printed as distinct line items. If only the total is printed, leave subtotal and tax null.
- For tipped receipts (rare for gardening): if a tip is printed, capture it in the tip field. Otherwise leave null.

on_biz_hint RULES
- true = this looks like a business expense a gardener would deduct (nursery plants, feed-store soil, Ace Hardware hand tool, Chevron fuel for the work truck).
- false = this looks clearly personal (grocery store haul with bananas + bread, restaurant, clothing store, pharmacy, pet food for your own dog).
- null = genuinely ambiguous (e.g., Costco receipt with a mix of business supplies and household goods).

CONFIDENCE
- 0.9-1.0 = clear, crisp receipt with unambiguous total and date.
- 0.7-0.89 = partial damage, some smudging, or one field inferred from context.
- 0.5-0.69 = meaningful uncertainty, return your best guess but be honest.
- Below 0.5 = you really cannot read it well. Still call the tool, but put an explanation in the notes field about what is unclear.

NOTES FIELD
- Use sparingly. Good notes: "item appears to be returned" or "8 lb soil amendment" or "rain check attached".
- Do NOT put marketing copy or the vendor name in notes, that goes in the vendor field.
- For low-confidence scans, briefly explain what is hard to read.

LINE ITEMS
- Include every clearly-printed line with its dollar amount. Do not include subtotals, tax lines, payment method lines, or change-due lines, only actual purchased items.
- If the receipt has dozens of items and they're hard to parse individually, capture the first several with their totals and leave the rest out. Better to have 6 correct line items than 30 garbled ones.

LINE-ITEM CATEGORIES (per-line splits on mixed receipts)
- Many Home Depot, Ace Hardware, and Pierson receipts mix categories (e.g. $80 of plants + $100 of lumber + $20 of gloves on one receipt). Tag each line item with its own category using the line_items[].category field so taxes get accurate per-category totals.
- The top-level category field should be the dominant / biggest bucket on the receipt. Per-line categories override the top-level category for THAT dollar amount only.
- Set line_items[].category=null when the item clearly matches the receipt-level category (don't bother tagging it) or when the item is ambiguous.
- Examples:
  - Home Depot receipt with "MARIGOLD FLAT $12", "2X4 CEDAR $45", "WORK GLOVES $8": dominant=equipment; line items get category=plants, category=equipment (or null), category=supplies.
  - Ace Hardware receipt with a hori-hori and a bag of soil: dominant=tools; soil-bag line gets category=soil_amendments.
  - Mad River Gardens receipt with plants and fertilizer: dominant=plants; fertilizer line gets category=soil_amendments.
- Don't tag every item — only tag lines that differ from the top-level category. This keeps the data clean.

PAYMENT METHOD AND CARD LAST 4
- Receipts almost always print the payment method near the totals: "VISA", "MASTERCARD", "AMEX", "DEBIT", "CREDIT", "CASH", "CHECK", or a wallet tag like "APPLE PAY".
- When a card is used, the receipt usually prints a masked card number: "****1234", "XXXXXXX5678", "ACCT: ****9012", "VISA DEBIT ****3456". Extract ONLY the 4 unmasked digits into card_last4. Do not include the mask characters. If multiple cards appear (split tender), return the last-4 of the card used for the largest portion.
- If the line says "DEBIT" or "DEBIT PURCHASE" or "PIN DEBIT", payment_type is "card_debit".
- If the line says "CREDIT" or "CREDIT SALE", payment_type is "card_credit".
- If only "VISA" or "MC" appears without debit/credit, and you cannot tell, leave payment_type null but still return card_last4.
- CASH, CHECK, VENMO, ZELLE: payment_type accordingly, card_last4 is null.
- If the receipt is blurry around the card area, leave card_last4 null rather than guess.

TOOL CALL RULES
- Call record_receipt exactly once per image.
- Do not include any prose text block alongside the tool call.
- Every required field (date, vendor, amount, category, line_items, confidence) must be present, even if null.`;

async function scanReceipt(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  _pendingReceiptFile = file;
  const key = localStorage.getItem('gf_anthropic_key');
  const status = document.getElementById('exp-scan-status');
  if (!key) {
    status.innerHTML = '<span style="color:var(--red);">Receipt attached. Set Anthropic API key in ⚙️ Settings to auto-extract fields.</span>';
    return;
  }
  if (file.type === 'application/pdf') {
    status.innerHTML = 'PDF attached (auto-scan only works on images right now - enter details manually).';
    return;
  }
  status.textContent = '📷 Scanning…';

  // Do downscale and API-payload prep in parallel-ish (downscale is the slow CPU part).
  const downscalePromise = downscaleImageToBase64(file, 1800, 0.85);

  try {
    const { b64, mediaType } = await downscalePromise;

    // Build request with prompt caching on the static system prompt + tool definition.
    // Cache hits save ~90% on tokens for the cached block and speed up response.
    const body = {
      model: 'claude-haiku-4-5-20251001',
      max_tokens: 1024,
      system: [
        { type: 'text', text: RECEIPT_SYSTEM_PROMPT, cache_control: { type: 'ephemeral' } }
      ],
      tools: [RECEIPT_TOOL],
      tool_choice: { type: 'tool', name: 'record_receipt' },
      messages: [{
        role: 'user',
        content: [
          { type: 'image', source: { type: 'base64', media_type: mediaType, data: b64 } },
          { type: 'text', text: 'Scan this receipt and call record_receipt.' }
        ]
      }]
    };

    const parsed = await _callReceiptAPI(key, body, 2); // up to 2 attempts

    if (!parsed) return; // error already shown by _callReceiptAPI

    // Populate form
    if (parsed.date) document.getElementById('exp-date').value = parsed.date;
    if (parsed.vendor) document.getElementById('exp-vendor').value = parsed.vendor;
    if (parsed.amount != null) document.getElementById('exp-amount').value = parsed.amount;
    if (parsed.category) document.getElementById('exp-category').value = parsed.category;
    if (Array.isArray(parsed.line_items)) {
      // Layer learned corrections over the AI suggestions before rendering,
      // so line items the user has categorized before auto-fill with the
      // learned category (and show a "learned" badge).
      await applyLineMemory(parsed.vendor || '', parsed.line_items);
      document.getElementById('exp-line-items').innerHTML = renderLineItems(parsed.line_items);
    }
    // Auto-set biz/personal if model is confident enough
    const bizCheckbox = document.getElementById('exp-biz');
    if (bizCheckbox && parsed.on_biz_hint !== null && parsed.on_biz_hint !== undefined) {
      bizCheckbox.checked = !!parsed.on_biz_hint;
    }
    // Auto-fill card last 4 (pulled from receipt)
    if (parsed.card_last4 && /^\d{4}$/.test(parsed.card_last4)) {
      document.getElementById('exp-card-last4').value = parsed.card_last4;
      // If we've seen this card before, auto-pick the bank from memory
      const knownBank = getCardBank(parsed.card_last4);
      if (knownBank) {
        document.getElementById('exp-card').value = knownBank;
        onExpCardChange();
      }
    }
    // Merge notes if any
    if (parsed.notes) {
      const notesEl = document.getElementById('exp-notes');
      if (notesEl && !notesEl.value) notesEl.value = parsed.notes;
    }

    const conf = typeof parsed.confidence === 'number' ? parsed.confidence : 0.85;
    const confLabel = conf >= 0.85 ? '' : conf >= 0.6 ? ' (moderate confidence - double-check fields)' : ' (low confidence - verify carefully)';
    status.innerHTML = '<span style="color:#6b8f52;">Scanned ✓' + confLabel + ' - review and adjust before saving.</span>';
  } catch (e) {
    status.innerHTML = '<span style="color:var(--red);">Scan error: ' + e.message + '</span>';
  }
}

// Single API call with timeout and retry. Returns parsed tool input, or null on unrecoverable failure.
async function _callReceiptAPI(key, body, maxAttempts) {
  const status = document.getElementById('exp-scan-status');
  let lastErr = '';
  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 30_000); // 30s timeout
    try {
      const resp = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        signal: controller.signal,
        headers: {
          'x-api-key': key,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
          'content-type': 'application/json'
        },
        body: JSON.stringify(body)
      });
      clearTimeout(timeoutId);
      if (!resp.ok) {
        const err = await resp.text();
        // Retry on 5xx or 429; fail fast on 4xx
        if ((resp.status >= 500 || resp.status === 429) && attempt < maxAttempts) {
          lastErr = resp.status + ' ' + err.slice(0,100);
          await new Promise(r => setTimeout(r, 600 * attempt)); // backoff
          continue;
        }
        status.innerHTML = '<span style="color:var(--red);">Scan failed: ' + err.slice(0,200) + '</span>';
        return null;
      }
      const data = await resp.json();
      // Find the tool_use block
      const toolBlock = (data.content || []).find(b => b.type === 'tool_use' && b.name === 'record_receipt');
      if (!toolBlock) {
        // Model returned text instead of tool call — rare with tool_choice forcing, but handle it
        const textBlock = (data.content || []).find(b => b.type === 'text');
        status.innerHTML = '<span style="color:var(--red);">Model did not call the tool. ' + ((textBlock?.text || '').slice(0,120)) + '</span>';
        return null;
      }
      return toolBlock.input;
    } catch (e) {
      clearTimeout(timeoutId);
      lastErr = e.name === 'AbortError' ? 'timed out' : e.message;
      if (attempt < maxAttempts) {
        await new Promise(r => setTimeout(r, 600 * attempt));
        continue;
      }
      status.innerHTML = '<span style="color:var(--red);">Scan error: ' + lastErr + '</span>';
      return null;
    }
  }
  return null;
}

// --- Income tab ---
let incomeViewMonth = (() => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); })();
let _payingBookingId = null;

function renderIncome() {
  const el = document.getElementById('income-content');
  const all = getBookings().filter(b => b.status !== 'canceled');
  const today = formatDate(new Date());
  // Pull all months that have bookings
  const months = Array.from(new Set(all.map(b => (b.date||'').slice(0,7)).filter(Boolean))).sort().reverse();
  if (!months.includes(incomeViewMonth)) months.unshift(incomeViewMonth);

  // --- Overall outstanding balance (all past visits, any month) ---
  const overdue = all.filter(b => (b.date||'') < today && !b.paid && (Number(b.price)||0) > 0);
  const overdueTotal = overdue.reduce((s,b) => s + (Number(b.price)||0), 0);
  const overdueByClient = {};
  overdue.forEach(b => {
    const k = b.clientName || 'Unknown';
    if (!overdueByClient[k]) overdueByClient[k] = { count: 0, total: 0, oldest: b.date };
    overdueByClient[k].count++;
    overdueByClient[k].total += Number(b.price)||0;
    if ((b.date||'') < overdueByClient[k].oldest) overdueByClient[k].oldest = b.date;
  });

  const inMonth = all.filter(b => (b.date||'').slice(0,7) === incomeViewMonth);
  const gross = inMonth.reduce((s,b) => s + (Number(b.price)||0), 0);
  const paid  = inMonth.filter(b => b.paid).reduce((s,b) => s + (Number(b.price)||0), 0);
  const outstanding = gross - paid;

  // Per-client breakdown for the month
  const byClient = {};
  inMonth.forEach(b => {
    const k = b.clientName || 'Unknown';
    if (!byClient[k]) byClient[k] = { count:0, gross:0, paid:0 };
    byClient[k].count++;
    byClient[k].gross += Number(b.price)||0;
    if (b.paid) byClient[k].paid += Number(b.price)||0;
  });

  const monthOpts = months.map(m => `<option value="${m}"${m===incomeViewMonth?' selected':''}>${m}</option>`).join('');

  // Outstanding balance card — shown only if money is actually owed.
  let html = '';
  if (overdueTotal > 0) {
    const clientRows = Object.entries(overdueByClient)
      .sort((a,b) => b[1].total - a[1].total)
      .map(([name, info]) => {
        const visits = info.count + ' visit' + (info.count === 1 ? '' : 's');
        return '<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:0.9rem;">' +
          '<span>' + escapeHtml(name) + ' <span style="color:var(--gray-600);font-size:0.8rem;">· ' + visits + ' · oldest ' + escapeHtml(info.oldest) + '</span></span>' +
          '<span style="font-weight:700;">$' + info.total.toFixed(0) + '</span>' +
        '</div>';
      }).join('');
    html += '<div class="card" style="background:#fff5f3;border:1px solid var(--red-light);border-radius:12px;padding:14px;margin-bottom:12px;">' +
      '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;">' +
        '<h3 style="margin:0;color:var(--red);">You\'re owed</h3>' +
        '<div style="font-size:1.6rem;font-weight:700;color:var(--red);">$' + overdueTotal.toFixed(0) + '</div>' +
      '</div>' +
      '<div style="font-size:0.8rem;color:var(--gray-600);margin-bottom:8px;">Past visits without a payment on file.</div>' +
      clientRows +
    '</div>';
  }

  html += `
    <div class="card" style="background:var(--white);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;">
        <select onchange="incomeViewMonth=this.value;renderIncome()" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--gray-200);">${monthOpts}</select>
        <button class="modal-btn secondary" style="padding:8px 12px;" onclick="exportIncomeCsv()">CSV</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;">
        <div><div style="font-size:0.75rem;color:var(--gray-600);">Gross</div><div style="font-size:1.3rem;font-weight:700;">$${gross.toFixed(0)}</div></div>
        <div><div style="font-size:0.75rem;color:var(--gray-600);">Paid</div><div style="font-size:1.3rem;font-weight:700;color:var(--spring-sage,#6b8f52);">$${paid.toFixed(0)}</div></div>
        <div><div style="font-size:0.75rem;color:var(--gray-600);">Outstanding</div><div style="font-size:1.3rem;font-weight:700;color:${outstanding>0?'var(--red)':'var(--gray-400)'};">$${outstanding.toFixed(0)}</div></div>
      </div>
    </div>
  `;

  html += '<div style="background:var(--white);border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:var(--shadow);"><h3 style="margin-bottom:8px;font-size:1rem;">Bookings this month</h3>';
  if (!inMonth.length) {
    html += '<div style="color:var(--gray-600);font-size:0.9rem;">No bookings.</div>';
  } else {
    inMonth.sort((a,b) => (a.date||'').localeCompare(b.date||''));
    inMonth.forEach(b => {
      const price = Number(b.price)||0;
      const paidBadge = b.paid
        ? `<span style="background:#dfe8d4;color:#4a1942;padding:2px 8px;border-radius:10px;font-size:0.75rem;font-weight:700;">PAID ${b.paymentMethod? '· '+b.paymentMethod:''}</span>`
        : (price > 0 ? `<span style="background:var(--red-light);color:var(--red);padding:2px 8px;border-radius:10px;font-size:0.75rem;font-weight:700;">UNPAID</span>` : `<span style="color:var(--gray-400);font-size:0.8rem;">no price</span>`);
      html += `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--gray-100);">
          <div style="flex:1;min-width:0;">
            <div style="font-weight:600;">${b.date} · ${b.clientName||'Client'}</div>
            <div style="font-size:0.8rem;color:var(--gray-600);">${EVENT_LABELS[b.eventType]||b.eventType} · $${price.toFixed(0)}</div>
          </div>
          <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;">${paidBadge}${!b.paid && price > 0 ? `<button class="modal-btn primary" style="padding:4px 10px;font-size:0.8rem;" onclick="quickMarkPaid('${b.id}')">Paid</button><button class="modal-btn secondary" style="padding:4px 10px;font-size:0.8rem;" onclick="sendInvoice('${b.id}')">Invoice</button>` : ''}<button class="modal-btn secondary" style="padding:4px 10px;font-size:0.8rem;" onclick="openPayment('${b.id}')">Edit</button></div>
        </div>`;
    });
  }
  html += '</div>';

  html += '<div style="background:var(--white);border-radius:12px;padding:12px;box-shadow:var(--shadow);"><h3 style="margin-bottom:8px;font-size:1rem;">By client</h3>';
  const clientRows = Object.entries(byClient).sort((a,b) => b[1].gross - a[1].gross);
  if (!clientRows.length) {
    html += '<div style="color:var(--gray-600);font-size:0.9rem;">-</div>';
  } else {
    clientRows.forEach(([name, s]) => {
      html += `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--gray-100);font-size:0.9rem;">
        <span>${name} <span style="color:var(--gray-600);font-size:0.8rem;">(${s.count})</span></span>
        <span><b>$${s.gross.toFixed(0)}</b> <span style="color:var(--gray-600);font-size:0.8rem;">(${s.paid.toFixed(0)} paid)</span></span>
      </div>`;
    });
  }
  html += '</div>';

  el.innerHTML = html;
}

function openPayment(bookingId) {
  const b = getBookings().find(x => x.id === bookingId);
  if (!b) return;
  _payingBookingId = bookingId;
  document.getElementById('pay-booking-info').textContent = `${b.date} · ${b.clientName||'Client'} · ${EVENT_LABELS[b.eventType]||b.eventType}`;
  document.getElementById('pay-price').value = b.price || '';
  document.getElementById('pay-paid').checked = !!b.paid;
  document.getElementById('pay-method').value = b.paymentMethod || '';
  document.getElementById('pay-date').value = (b.paidDate||'').slice(0,10);
  document.getElementById('pay-notes').value = b.paymentNotes || '';
  document.getElementById('modal-payment').classList.add('open');
}

async function savePayment() {
  if (!_payingBookingId) return;
  const price = parseFloat(document.getElementById('pay-price').value) || 0;
  const paid = document.getElementById('pay-paid').checked;
  const method = document.getElementById('pay-method').value || null;
  const paidDate = document.getElementById('pay-date').value || null;
  const notes = document.getElementById('pay-notes').value || '';
  // If marking paid and no date set, default to today
  const finalDate = paid && !paidDate ? formatDate(new Date()) : paidDate;
  try {
    await DB.updateBooking(_payingBookingId, {
      price, paid, paymentMethod: method, paidDate: finalDate, paymentNotes: notes
    });
    // Update cache
    const b = _cachedBookings.find(x => x.id === _payingBookingId);
    if (b) { b.price = price; b.paid = paid; b.paymentMethod = method; b.paidDate = finalDate; b.paymentNotes = notes; }
    closeModal('modal-payment');
    _payingBookingId = null;
    renderIncome();
  } catch (e) {
    alert('Save failed: ' + e.message);
  }
}

async function quickMarkPaid(bookingId) {
  const b = getBookings().find(x => x.id === bookingId);
  if (!b) return;
  const method = prompt('Payment method? (cash, check, card, venmo, zelle, other)', b.paymentMethod || 'cash');
  if (method === null) return;
  const today = formatDate(new Date());
  try {
    await DB.updateBooking(bookingId, { paid: true, paymentMethod: method || null, paidDate: today });
    const cached = _cachedBookings.find(x => x.id === bookingId);
    if (cached) { cached.paid = true; cached.paymentMethod = method || null; cached.paidDate = today; }
    renderIncome();
  } catch (e) {
    alert('Save failed: ' + e.message);
  }
}

function sendInvoice(bookingId) {
  const b = getBookings().find(x => x.id === bookingId);
  if (!b) return;
  const price = Number(b.price) || 0;
  const service = EVENT_LABELS[b.eventType] || b.eventType || 'Garden care visit';
  const to = b.clientEmail || '';
  const subject = `Invoice from Garden Faery — ${b.date}`;
  const body =
    `Hi ${(b.clientName || '').split(' ')[0] || 'there'},\n\n` +
    `Thanks so much for having me in the garden on ${b.date}. Here is your invoice:\n\n` +
    `  Service:  ${service}\n` +
    `  Date:     ${b.date}\n` +
    `  Amount:   $${price.toFixed(0)}\n\n` +
    `Payment options:\n` +
    `  Venmo:   @gardenfaery\n` +
    `  Zelle:   taya@gardenfaery.love\n` +
    `  Check:   payable to Taya (address on request)\n` +
    `  Cash:    next visit is fine too\n\n` +
    `Just reply to this email if anything looks off or you want to reschedule something.\n\n` +
    `Whimsy,\n` +
    `Taya\n` +
    `Your local Garden Faery. Arcata & Humboldt County.\n` +
    `taya@gardenfaery.love`;
  const mailto = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

function exportIncomeCsv() {
  const inMonth = getBookings().filter(b => b.status !== 'canceled' && (b.date||'').slice(0,7) === incomeViewMonth);
  const rows = [['Date','Client','Service','Price','Paid','Method','Paid Date','Notes']];
  inMonth.sort((a,b) => (a.date||'').localeCompare(b.date||''));
  inMonth.forEach(b => {
    rows.push([
      b.date || '',
      b.clientName || '',
      EVENT_LABELS[b.eventType] || b.eventType || '',
      Number(b.price)||0,
      b.paid ? 'yes' : 'no',
      b.paymentMethod || '',
      (b.paidDate||'').slice(0,10),
      (b.paymentNotes||'').replace(/"/g,'""')
    ]);
  });
  const csv = rows.map(r => r.map(c => `"${String(c)}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type:'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'income-' + incomeViewMonth + '.csv'; a.click();
  URL.revokeObjectURL(url);
}

// --- Week strip ---
function renderWeekStrip() {
  const grid = document.getElementById('week-grid');
  const dayNames = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  const today = new Date(); today.setHours(0,0,0,0);

  // Find Monday of current week
  const weekStart = new Date(viewDate);
  weekStart.setDate(weekStart.getDate() - ((weekStart.getDay() + 6) % 7));

  const bookings = getBookings().filter(b => b.status !== 'canceled');
  let html = '';

  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart);
    d.setDate(d.getDate() + i);
    const ds = formatDate(d);
    const isToday = d.getTime() === today.getTime();
    const isActive = d.getTime() === viewDate.getTime();

    const dayBookings = bookings.filter(b => b.date === ds);
    let dots = '';
    if (dayBookings.some(b => b.eventType === 'morning')) dots += '<span class="dot morning-dot"></span>';
    if (dayBookings.some(b => b.eventType === 'afternoon')) dots += '<span class="dot afternoon-dot"></span>';
    if (dayBookings.some(b => b.eventType === 'monday')) dots += '<span class="dot monday-dot"></span>';
    const dayBlocks = getBlocks().filter(b => b.date === ds);
    if (dayBlocks.length > 0) dots += '<span class="dot blocked-dot"></span>';

    let cls = 'week-day';
    if (isActive) cls += ' active';
    if (isToday) cls += ' today-marker';

    html += '<div class="' + cls + '" onclick="jumpToDate(\'' + ds + '\')">' +
      '<div class="dow">' + dayNames[d.getDay()] + '</div>' +
      '<div class="dom">' + d.getDate() + '</div>' +
      '<div class="dots">' + dots + '</div></div>';
  }
  grid.innerHTML = html;
}

function jumpToDate(ds) {
  const parts = ds.split('-');
  viewDate = new Date(parts[0], parts[1]-1, parts[2]);
  renderAll();
}

function goToday() {
  viewDate = new Date();
  viewDate.setHours(0,0,0,0);
  renderAll();
}

// --- Day view ---
function renderDay() {
  const container = document.getElementById('day-content');
  const ds = formatDate(viewDate);

  const blocks = getBlocks().filter(b => b.date === ds);

  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  const dateLabel = dayNames[viewDate.getDay()] + ', ' + monthNames[viewDate.getMonth()] + ' ' + viewDate.getDate();

  let html = '<div class="day-nav">' +
    '<button class="day-btn" onclick="prevDay()">&#8592;</button>' +
    '<h2>' + dateLabel + '</h2>' +
    '<button class="day-btn" onclick="nextDay()">&#8594;</button></div>';

  if (bookings.length === 0 && blocks.length === 0) {
    const dow = viewDate.getDay();
    if (dow === 0 || dow === 6) {
      html += '<div class="empty-day"><p>Weekend! Enjoy it.</p></div>';
    } else if (dow === 1) {
      html += '<div class="empty-day"><p>Ceramics morning. Open for garden work 1 to 4:30pm.</p></div>';
    } else {
      html += '<div class="empty-day"><p>Nothing booked yet. Wide open!</p></div>';
    }
  } else {
    html += '<div class="timeline">';

    // Sort by time
    const allItems = [];
    bookings.forEach(b => {
      const sortTime = b.eventType === 'morning' ? '09:00' :
                       b.eventType === 'monday' ? '13:00' :
                       b.eventType === 'afternoon' ? '14:30' : '17:00';
      allItems.push({ type: 'booking', data: b, sortTime });
    });
    blocks.forEach(b => {
      allItems.push({ type: 'block', data: b, sortTime: b.startTime || '00:00' });
    });
    allItems.sort((a, b) => a.sortTime.localeCompare(b.sortTime));

    allItems.forEach(item => {
      if (item.type === 'booking') {
        const b = item.data;
        html += '<div class="time-marker">' +
          '<span class="time-label">' + b.time + '</span>' +
          '<span class="time-dot" style="background: var(--' +
            (b.eventType === 'morning' ? 'pollen-gold' : b.eventType === 'afternoon' ? 'petal-pink' : 'spring-sage') +
          ')"></span>' +
          '<div class="booking-card ' + b.eventType + '">' +
          '<h3>' + b.clientName +
            (b.recurringSeriesId ? '<span class="series-badge">' + (b.recurringFrequency || 'recurring') + '</span>' : '') +
          '</h3>' +
          '<div class="booking-meta">' + EVENT_LABELS[b.eventType] + ' (' + EVENT_TIMES[b.eventType] + ')</div>' +
          '<div class="booking-client">' +
            (b.clientPhone ? b.clientPhone : '') +
            (b.clientAddress ? ' &middot; ' + b.clientAddress : '') +
          '</div>' +
          (b.gardenNotes ? '<div class="booking-meta" style="margin-top:6px;font-style:italic;">"' + b.gardenNotes + '"</div>' : '') +
          '<div class="booking-actions">' +
            '<button class="action-btn" onclick="callClient(\'' + phoneAttr(b.clientPhone) + '\')">Call</button>' +
            '<button class="action-btn" onclick="textClient(\'' + phoneAttr(b.clientPhone) + '\')">Text</button>' +
            '<button class="action-btn" onclick="openReschedule(\'' + b.id + '\')">Reschedule</button>' +
            '<button class="action-btn danger" onclick="cancelBooking(\'' + b.id + '\')">Cancel</button>' +

          '</div></div></div>';
      } else {
        const b = item.data;

          '<span class="time-label">' + (b.allDay ? 'all day' : b.startTime) + '</span>' +
          '<span class="time-dot" style="background: var(--gray-400)"></span>' +

          '<div class="booking-meta">' + (b.allDay ? 'All day' : b.startTime + ' to ' + b.endTime) + '</div>' +
          '<div class="booking-actions">' +
            '<button class="action-btn danger" onclick="removeBlock(\'' + b.id + '\')">Remove</button>' +
          '</div></div></div>';
      }
    });

    html += '</div>';
  }

  container.innerHTML = html;
}

// --- Upcoming view ---
let monthViewDate = (() => { const d = new Date(); d.setDate(1); d.setHours(0,0,0,0); return d; })();

function prevMonth() { monthViewDate = new Date(monthViewDate.getFullYear(), monthViewDate.getMonth() - 1, 1); renderMonth(); }
function nextMonth() { monthViewDate = new Date(monthViewDate.getFullYear(), monthViewDate.getMonth() + 1, 1); renderMonth(); }

function renderMonth() {
  const container = document.getElementById('month-content');
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const y = monthViewDate.getFullYear();
  const m = monthViewDate.getMonth();
  const firstDay = new Date(y, m, 1);
  const lastDay = new Date(y, m + 1, 0);
  const startPad = firstDay.getDay();
  const totalDays = lastDay.getDate();
  const today = formatDate(new Date());

  const bookings = getBookings().filter(b => b.status !== 'canceled' && (b.date || '').startsWith(y + '-' + String(m+1).padStart(2,'0')));
  const blocks = getBlocks().filter(b => (b.date || '').startsWith(y + '-' + String(m+1).padStart(2,'0')));

  let html = '<div class="month-nav">' +
    '<button class="day-btn" onclick="prevMonth()">&#8592;</button>' +
    '<h2>' + monthNames[m] + ' ' + y + '</h2>' +
    '<button class="day-btn" onclick="nextMonth()">&#8594;</button></div>';

  html += '<div class="month-grid">';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => { html += '<div class="month-dow">' + d + '</div>'; });

  for (let i = 0; i < startPad; i++) html += '<div class="month-cell empty"></div>';

  for (let d = 1; d <= totalDays; d++) {
    const ds = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    const dayBookings = bookings.filter(b => b.date === ds);
    const dayBlocks = blocks.filter(b => b.date === ds);
    const isToday = ds === today;

    let cell = '<div class="month-cell' + (isToday ? ' today' : '') + '" onclick="jumpToDay(\'' + ds + '\')">';
    cell += '<div class="mc-num">' + d + '</div>';

    const maxShow = 2;
    const items = [];
    dayBookings.forEach(b => {
      const type = b.eventType || 'afternoon';
      const label = (b.clientName || '').split(' ')[0] || '·';
      items.push({cls: type, label: label});
    });
    dayBlocks.forEach(b => items.push({cls: 'blocked', label: b.reason || 'Blocked'}));

    items.slice(0, maxShow).forEach(it => {
      cell += '<div class="mc-evt ' + it.cls + '">' + escapeHtml(it.label) + '</div>';
    });
    if (items.length > maxShow) {
      cell += '<div class="mc-more">+' + (items.length - maxShow) + ' more</div>';
    }
    cell += '</div>';
    html += cell;
  }
  html += '</div>';

  container.innerHTML = html;
}

function jumpToDay(ds) {
  const [y, m, d] = ds.split('-').map(Number);
  viewDate = new Date(y, m - 1, d);
  viewDate.setHours(0,0,0,0);
  switchTab('day');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Safe to drop into onclick="callClient('...')" etc. — strips to digits/+/space/parens/dash
// so any stray quotes or backslashes in source data can't break the handler.
function phoneAttr(s) {
  return String(s == null ? '' : s).replace(/[^\d+\s()-]/g, '');
}

function renderUpcoming() {

    .filter(b => b.date >= today && b.status !== 'canceled')

  let html = '';

  const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  bookings.forEach(b => {
    if (b.date !== lastDate) {

      html += '<div style="font-weight:700; font-size:0.85rem; color:var(--gray-400); margin: 16px 0 8px; text-transform: uppercase;">' + label + '</div>';

    html += '<div class="booking-card ' + b.eventType + '">' +
      '<h3>' + b.clientName +
        (b.recurringSeriesId ? '<span class="series-badge">' + (b.recurringFrequency || 'recurring') + '</span>' : '') +
      '</h3>' +
      '<div class="booking-meta">' + EVENT_LABELS[b.eventType] + ' at ' + b.time + '</div>' +
      '<div class="booking-client">' +
        (b.clientPhone ? b.clientPhone : '') +
        (b.clientAddress ? ' &middot; ' + b.clientAddress : '') +
      '</div>' +
      '<div class="booking-actions">' +
        (phone ? '<button class="action-btn" onclick="callClient(\'' + phoneAttr(phone) + '\')">Call</button>' : '') +
        (phone ? '<button class="action-btn" onclick="textClient(\'' + phoneAttr(phone) + '\')">Text</button>' : '') +
        '<button class="action-btn" onclick="openReschedule(\'' + b.id + '\')">Reschedule</button>' +

// --- Moon-day conflict handling (moved from /moon) ---
// Recurring bookings that fall on moon-day auto-blocks:
//   - within 7 days: auto-cancel, set canceled_by='moon-auto'
//   - beyond 7 days: show as pending so Taya can Keep if she wants
// Keep flips moon_exempt=true and un-cancels if needed.
const MOON_AUTO_BLOCK_TAG = 'moon-auto-block';
const MOON_CONFLICT_BUFFER_DAYS = 7;
let moonConflicts = [];

async function syncMoonConflicts() {
  if (!PB_TOKEN) return;
  try {
    const today = formatDate(new Date());
    const bufferEnd = formatDate(new Date(Date.now() + MOON_CONFLICT_BUFFER_DAYS * 86400000));

    // Moon-block dates (future only)
    const filter = encodeURIComponent('reason = "' + MOON_AUTO_BLOCK_TAG + '"');
    const blocksResp = await fetch(PB_URL + '/api/collections/blocked_times/records?filter=' + filter + '&perPage=500', {
      headers: { 'Authorization': 'Bearer ' + PB_TOKEN },
    });
    if (!blocksResp.ok) throw new Error('blocks ' + blocksResp.status);
    const blocksData = await blocksResp.json();
    const moonDates = new Set((blocksData.items || []).map(b => (b.date || '').slice(0, 10)));

    // Future bookings
    const bkFilter = encodeURIComponent('date >= "' + today + '"');
    const bkResp = await fetch(PB_URL + '/api/collections/bookings/records?filter=' + bkFilter + '&perPage=500&sort=date', {
      headers: { 'Authorization': 'Bearer ' + PB_TOKEN },
    });
    if (!bkResp.ok) throw new Error('bookings ' + bkResp.status);
    const bkData = await bkResp.json();
    const future = (bkData.items || []).map(b => ({
      id: b.id,
      date: (b.date || '').slice(0, 10),
      time: b.time,
      clientName: b.client_name || 'Client',
      status: b.status,
      canceledBy: b.canceled_by,
      moonExempt: !!b.moon_exempt,
      isRecurring: !!b.recurring_series_id,
    }));

    moonConflicts = [];
    for (const b of future) {
      if (!moonDates.has(b.date)) continue;
      const withinBuffer = b.date <= bufferEnd;
      if (b.moonExempt) {
        moonConflicts.push({ booking: b, withinBuffer, isAutoCancelled: false, kept: true });
        continue;
      }
      if (withinBuffer && b.status !== 'canceled') {
        // Auto-cancel
        await fetch(PB_URL + '/api/collections/bookings/records/' + b.id, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + PB_TOKEN },
          body: JSON.stringify({
            status: 'canceled',
            canceled_by: 'moon-auto',
            canceled_at: new Date().toISOString(),
          }),
        });
        b.status = 'canceled';
        b.canceledBy = 'moon-auto';
      }
      moonConflicts.push({
        booking: b,
        withinBuffer,
        isAutoCancelled: b.canceledBy === 'moon-auto' && b.status === 'canceled',
        kept: false,
      });
    }
    renderMoonConflicts();
  } catch (e) {
    console.log('moon conflict sync error:', e);
  }
}

function renderMoonConflicts() {
  const card = document.getElementById('moon-conflicts-card');
  const list = document.getElementById('moon-conflicts-list');
  if (!card || !list) return;
  if (!moonConflicts.length) { card.style.display = 'none'; return; }
  card.style.display = 'block';
  list.innerHTML = moonConflicts.map(c => {
    const b = c.booking;
    const stateLabel = c.kept
      ? '<span style="color:var(--sage);font-size:0.8rem;">kept (you overrode)</span>'
      : c.isAutoCancelled
        ? '<span style="color:var(--red);font-size:0.8rem;">auto-cancelled</span>'
        : (c.withinBuffer
            ? '<span style="color:var(--red);font-size:0.8rem;">cancelling now...</span>'
            : '<span style="color:var(--gray-600);font-size:0.8rem;">pending (auto-cancels 7 days before)</span>');
    const keepBtn = c.kept
      ? '<button class="action-btn danger" onclick="releaseMoonKeep(\'' + b.id + '\')" style="font-size:0.8rem;">Undo keep</button>'
      : '<button class="action-btn" onclick="keepMoonBooking(\'' + b.id + '\')" style="font-size:0.8rem;">Keep</button>';
    const notCanceled = b.status !== 'canceled';
    const extraBtns =
      '<button class="action-btn" onclick="openReschedule(\'' + b.id + '\')" style="font-size:0.8rem;">Reschedule</button>' +
      (notCanceled ? '<button class="action-btn danger" onclick="cancelBooking(\'' + b.id + '\')" style="font-size:0.8rem;">Cancel</button>' : '');
    return '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--gray-100);">' +
      '<div style="flex:1;min-width:0;">' +
        '<div style="font-weight:600;">' + escapeHtml(b.date) + ' ' + escapeHtml(b.time || '') + ' &middot; ' + escapeHtml(b.clientName) + (b.isRecurring ? ' (recurring)' : '') + '</div>' +
        '<div>' + stateLabel + '</div>' +
      '</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;">' + keepBtn + extraBtns + '</div>' +
    '</div>';
  }).join('');
}

async function keepMoonBooking(bookingId) {
  try {
    await fetch(PB_URL + '/api/collections/bookings/records/' + bookingId, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + PB_TOKEN },
      body: JSON.stringify({
        status: 'confirmed',
        canceled_by: null,
        canceled_at: null,
        moon_exempt: true,
      }),
    });
    await refreshData();
    renderAll();
  } catch (e) { alert('Keep failed: ' + e.message); }
}

async function releaseMoonKeep(bookingId) {
  if (!confirm('Undo keep - this booking will be auto-cancelled again if within 7 days.')) return;
  try {
    await fetch(PB_URL + '/api/collections/bookings/records/' + bookingId, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + PB_TOKEN },
      body: JSON.stringify({ moon_exempt: false }),
    });
    await syncMoonConflicts();
  } catch (e) { alert('Undo failed: ' + e.message); }
}

// --- Clients view ---
function renderClients() {
  const container = document.getElementById('clients-content');
  const bookings = getBookings().filter(b => b.status !== 'canceled');

  // Unique clients (merges by shared email / phone / normalized name)
  const clients = groupBookingsByClient(bookings);

  // Compute totals for each client
  clients.forEach(c => {
    c.visits.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    c.count = c.visits.length;
    c.lastVisit = c.visits[0] ? c.visits[0].date : '';
    c.totalCharged = c.visits.reduce((s, v) => s + (Number(v.price) || 0), 0);
    c.totalPaid = c.visits.reduce((s, v) => s + (v.paid ? (Number(v.price) || 0) : 0), 0);
    c.outstanding = c.totalCharged - c.totalPaid;
  });

  // Sort: outstanding balance first, then by visit count
  const sorted = clients.sort((a, b) => {
    if ((b.outstanding > 0) !== (a.outstanding > 0)) return b.outstanding > 0 ? 1 : -1;
    if (b.outstanding !== a.outstanding) return b.outstanding - a.outstanding;
    return b.count - a.count;
  });

  if (sorted.length === 0) {
    container.innerHTML = '<div class="empty-day"><p>No clients yet. They\'ll show up here as bookings come in.</p></div>';
    return;
  }

  const money = n => '$' + (Math.round((Number(n) || 0) * 100) / 100).toFixed(2).replace(/\.00$/, '');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const today = formatDate(new Date());

  let html = '';
  sorted.forEach(c => {
    const borderColor = c.outstanding > 0 ? 'var(--red)' : 'var(--plum)';

    // Header: name, visit count, last visit
    let card = '<div class="booking-card" style="border-left-color:' + borderColor + ';">' +
      '<h3>' + esc(c.name || 'Client') + '</h3>' +
      '<div class="booking-meta">' + c.count + ' visit' + (c.count === 1 ? '' : 's') +
        (c.lastVisit ? ' &middot; Last: ' + esc(c.lastVisit) : '') +
      '</div>';

    // Totals row (charged / paid / outstanding)
    card += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px;font-size:0.8rem;">' +
      '<span style="background:var(--gray-100);color:var(--plum);padding:3px 9px;border-radius:10px;font-weight:700;">' +
        money(c.totalCharged) + ' charged</span>' +
      '<span style="background:#dfe8d4;color:var(--plum);padding:3px 9px;border-radius:10px;font-weight:700;">' +
        money(c.totalPaid) + ' paid</span>' +
      (c.outstanding > 0
        ? '<span style="background:var(--red-light);color:var(--red);padding:3px 9px;border-radius:10px;font-weight:700;">' +
            money(c.outstanding) + ' outstanding</span>'
        : '') +
      '</div>';

    // Contact line
    card += '<div class="booking-client">' +
      (c.phone ? esc(c.phone) : '') +
      (c.phone && c.email ? ' &middot; ' : '') +
      (c.email ? esc(c.email) : '') +
      '</div>';

    // Action buttons
    card += '<div class="booking-actions">' +
      (c.phone ? '<button class="action-btn" onclick="callClient(\'' + esc(c.phone) + '\')">Call</button>' +
                 '<button class="action-btn" onclick="textClient(\'' + esc(c.phone) + '\')">Text</button>' : '') +
      '</div>';

    // Visit history
    card += '<div style="margin-top:12px;border-top:1px solid var(--gray-100);padding-top:10px;">' +
      '<div style="font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--gray-600);margin-bottom:6px;">Visits</div>';

    c.visits.forEach(v => {
      const svc = EVENT_LABELS[v.eventType] || v.eventType || '';
      const price = Number(v.price) || 0;
      const isFuture = v.date > today;

      let badge;
      if (v.paid) {
        const method = v.paymentMethod ? ' &middot; ' + esc(v.paymentMethod) : '';
        const payDate = v.paidDate ? ' &middot; ' + esc((v.paidDate || '').slice(5, 10)) : '';
        badge = '<span style="background:#dfe8d4;color:var(--plum);padding:2px 8px;border-radius:10px;font-size:0.7rem;font-weight:700;white-space:nowrap;">' +
          'PAID' + method + payDate + '</span>';
      } else if (isFuture) {
        badge = '<span style="background:var(--gray-100);color:var(--gray-600);padding:2px 8px;border-radius:10px;font-size:0.7rem;font-weight:700;white-space:nowrap;">UPCOMING</span>';
      } else {
        badge = '<span style="background:var(--red-light);color:var(--red);padding:2px 8px;border-radius:10px;font-size:0.7rem;font-weight:700;white-space:nowrap;">UNPAID</span>';
      }

      card += '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--gray-100);font-size:0.85rem;">' +
        '<div style="min-width:0;flex:1;">' +
          '<div style="font-weight:600;color:var(--plum);">' + esc(v.date) + (v.time ? ' &middot; ' + esc(v.time) : '') + '</div>' +
          '<div style="color:var(--gray-600);font-size:0.78rem;">' + esc(svc) + '</div>' +
        '</div>' +
        '<div style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px;">' +
          '<div style="font-weight:700;color:var(--plum);">' + money(price) + '</div>' +
          badge +
        '</div>' +
      '</div>';
    });

    card += '</div></div>';
    html += card;
  });
  container.innerHTML = html;
}

// Split a full name into first + last on the first space.
// "Anna"                  -> { first: "Anna", last: "" }
// "Anna Peck"             -> { first: "Anna", last: "Peck" }
// "Anna Van Der Berg"     -> { first: "Anna", last: "Van Der Berg" }
function splitName(full) {
  const trimmed = (full || '').trim().replace(/\s+/g, ' ');
  if (!trimmed) return { first: '', last: '' };
  const idx = trimmed.indexOf(' ');
  if (idx === -1) return { first: trimmed, last: '' };
  return { first: trimmed.slice(0, idx), last: trimmed.slice(idx + 1) };
}

// Merge bookings into unique clients. Two bookings are treated as the same
// client if they share any of: email, phone (digits-only), or normalized
// name (lowercase, collapsed whitespace). Union-find so chains merge
// transitively — e.g. booking A shares email with B, B shares phone with C,
// all three become one client. Newest booking's non-empty value wins per
// field; older bookings backfill any still-missing fields.
//
// Returns an array of { key, name, email, phone, address, visits, lastDate }.
function groupBookingsByClient(bookings) {
  const list = bookings.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));

  const parent = list.map((_, i) => i);
  const find = i => { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
  const union = (i, j) => { const ri = find(i), rj = find(j); if (ri !== rj) parent[ri] = rj; };

  const normName  = s => (s || '').toLowerCase().trim().replace(/\s+/g, ' ');
  const normEmail = s => (s || '').toLowerCase().trim();
  const normPhone = s => (s || '').replace(/\D/g, '');

  const byEmail = new Map(), byPhone = new Map(), byName = new Map();
  list.forEach((b, i) => {
    const e = normEmail(b.clientEmail);
    const p = normPhone(b.clientPhone);
    const n = normName(b.clientName);
    if (e)             { if (byEmail.has(e)) union(i, byEmail.get(e)); byEmail.set(e, i); }
    if (p.length >= 7) { if (byPhone.has(p)) union(i, byPhone.get(p)); byPhone.set(p, i); }
    if (n)             { if (byName.has(n))  union(i, byName.get(n));  byName.set(n, i); }
  });

  const groups = new Map();
  list.forEach((b, i) => {
    const root = find(i);
    if (!groups.has(root)) {
      groups.set(root, {
        key: 'c' + root,
        name: '', email: '', phone: '', address: '',
        visits: [],
        lastDate: ''
      });
    }
    const c = groups.get(root);
    c.visits.push(b);
    // Newest-first: first non-empty value wins, older ones only fill blanks.
    if (!c.name    && b.clientName)    c.name    = b.clientName;
    if (!c.email   && b.clientEmail)   c.email   = b.clientEmail;
    if (!c.phone   && b.clientPhone)   c.phone   = b.clientPhone;
    if (!c.address && b.clientAddress) c.address = b.clientAddress;
    if ((b.date || '') > c.lastDate)   c.lastDate = b.date || '';
  });

  return [...groups.values()];
}

function buildExistingClientList() {
  const bookings = (typeof getBookings === 'function' ? getBookings() : [])
    .filter(b => b.status !== 'canceled' && (b.clientName || b.clientEmail || b.clientPhone));
  return groupBookingsByClient(bookings)
    .filter(c => c.name || c.email || c.phone)
    .sort((a, b) => (a.name || '').localeCompare(b.name || ''));
}

// --- Name normalization migration ---
// For each merged client group, pick a canonical "first last" name and
// rewrite every booking in the group that uses a different variation.
// Canonical name preference:
//   1. Names with 2+ whitespace-separated parts (first + last) beat single-
//      word names.
//   2. Among those, longer name wins (more specific).
//   3. Tie break by most-recent booking date.
// Only touches client_name. Does not rewrite email/phone/address (those are
// already backfilled in the merged view, and rewriting them would lose any
// historical record of what was captured at booking time).
function buildNameNormalizationPlan() {
  const bookings = (getBookings() || []).filter(b => b.status !== 'canceled');
  const groups = groupBookingsByClient(bookings);
  const plan = []; // { to, froms: [name...], bookingIds: [id...] }

  for (const g of groups) {
    // Collect all distinct name variations seen in this group
    const variants = new Map();
    for (const v of g.visits) {
      const n = (v.clientName || '').trim().replace(/\s+/g, ' ');
      if (!n) continue;
      if (!variants.has(n)) {
        variants.set(n, { name: n, parts: n.split(' ').length, lastDate: '' });
      }
      const entry = variants.get(n);
      if ((v.date || '') > entry.lastDate) entry.lastDate = v.date || '';
    }
    if (variants.size === 0) continue;

    const ranked = [...variants.values()].sort((a, b) => {
      const aHasLast = a.parts >= 2 ? 1 : 0;
      const bHasLast = b.parts >= 2 ? 1 : 0;
      if (aHasLast !== bHasLast) return bHasLast - aHasLast;
      if (b.name.length !== a.name.length) return b.name.length - a.name.length;
      return (b.lastDate || '').localeCompare(a.lastDate || '');
    });
    const canonical = ranked[0].name;

    // If the winning name has no last name, skip — we refuse to "normalize"
    // onto a first-name-only record because that just masks a missing last
    // name. Taya should edit those bookings by hand (or book the client
    // again with the full name).
    if (ranked[0].parts < 2) continue;

    // Every booking whose name differs from canonical goes in the plan
    const toUpdate = g.visits.filter(v =>
      (v.clientName || '').trim().replace(/\s+/g, ' ') !== canonical
    );
    if (toUpdate.length === 0) continue;

    const froms = [...new Set(toUpdate.map(v => (v.clientName || '').trim() || '(blank)'))];
    plan.push({
      to: canonical,
      froms: froms,
      bookingIds: toUpdate.map(v => v.id)
    });
  }
  return plan;
}

async function runNameCleanup() {
  try { await refreshData(); } catch (_) { /* proceed with cached data */ }
  const plan = buildNameNormalizationPlan();
  if (plan.length === 0) {
    alert('No duplicate names found. Everything is already consistent.');
    return;
  }

  const totalBookings = plan.reduce((s, p) => s + p.bookingIds.length, 0);
  const preview = plan
    .map(p => '  ' + p.froms.join(' / ') + '  =>  ' + p.to + '   (' + p.bookingIds.length + ')')
    .join('\n');
  const msg = 'Normalize ' + totalBookings + ' booking' + (totalBookings === 1 ? '' : 's') +
              ' across ' + plan.length + ' client' + (plan.length === 1 ? '' : 's') + '?\n\n' +
              preview + '\n\n' +
              'The right-hand name will replace the others. ' +
              'Bookings with only a first name are left alone so you can fix them by hand.';
  if (!confirm(msg)) return;

  let updated = 0;
  let failed = 0;
  for (const p of plan) {
    for (const id of p.bookingIds) {
      try {
        await DB.updateBooking(id, { clientName: p.to });
        updated++;
      } catch (err) {
        console.error('Failed to update booking', id, err);
        failed++;
      }
    }
  }

  alert('Updated ' + updated + ' booking' + (updated === 1 ? '' : 's') +
        (failed > 0 ? '. ' + failed + ' failed (see console).' : '.'));
  await refreshData();
  renderAll();
}

function populateExistingClientSelect() {
  const sel = document.getElementById('obo-existing');

  const clients = buildExistingClientList();
  const existingValue = sel.value;
  sel.innerHTML = '<option value="">— new client —</option>' +
    clients.map(c => {
      const label = c.name + (c.email ? ' · ' + c.email : c.phone ? ' · ' + c.phone : '');
      return '<option value="' + escAttr(c.key) + '">' + escAttr(label) + '</option>';
    }).join('');
  // Stash for onPickExistingClient to look up
  sel._clients = clients;
  sel.value = existingValue || '';

function onPickExistingClient() {
  const sel = document.getElementById('obo-existing');
  const key = sel.value;
  if (!key || !sel._clients) return;
  const c = sel._clients.find(x => x.key === key);
  if (!c) return;
  const parts = splitName(c.name);
  document.getElementById('obo-first-name').value = parts.first;
  document.getElementById('obo-last-name').value  = parts.last;
  document.getElementById('obo-email').value   = c.email || '';
  document.getElementById('obo-phone').value   = c.phone || '';

async function saveBlock() {
  const date = document.getElementById('block-date').value;
  const type = document.getElementById('block-type').value;
  const reason = document.getElementById('block-reason').value.trim();

  if (!date) { alert('Pick a date.'); return; }

  const block = {
    id: 'blk_' + Date.now(),
    date: date,
    allDay: type === 'all',
    startTime: type === 'morning' ? '09:00' : type === 'afternoon' ? '14:30' : type === 'custom' ? document.getElementById('block-start').value : null,
    endTime: type === 'morning' ? '14:00' : type === 'afternoon' ? '16:30' : type === 'custom' ? document.getElementById('block-end').value : null,
    reason: reason

    closeModal('modal-block');

}

async function saveOBO() {
  const eventType = document.getElementById('obo-event').value;
  const date = document.getElementById('obo-date').value;
  const firstName = document.getElementById('obo-first-name').value.trim().replace(/\s+/g, ' ');
  const lastName  = document.getElementById('obo-last-name').value.trim().replace(/\s+/g, ' ');
  const name = (firstName + ' ' + lastName).trim();
  const email = document.getElementById('obo-email').value.trim();
  const phone = document.getElementById('obo-phone').value.trim();
  const address = document.getElementById('obo-address').value.trim();
  const notes = document.getElementById('obo-notes').value.trim();
  const recurring = document.getElementById('obo-recurring').value;
  const weeks = parseInt(document.getElementById('obo-weeks').value) || 12;

  if (!date) { alert('Pick a date.'); return; }
  if (!firstName) { alert("Enter the client's first name."); document.getElementById('obo-first-name').focus(); return; }
  if (!lastName)  { alert("Enter the client's last name. Both first and last are required so we can tell clients apart."); document.getElementById('obo-last-name').focus(); return; }

  const seriesId = recurring !== 'none' ? 'series_' + Date.now() : null;
  const interval = recurring === 'biweekly' ? 14 : 7;
  const count = recurring === 'none' ? 1 : weeks;

  // --- Build the list of (date, eventType) slots we plan to book ---
  const targets = [];
  for (let i = 0; i < count; i++) {
    const d = new Date(date + 'T12:00:00');
    d.setDate(d.getDate() + (i * interval));
    targets.push({ date: formatDate(d), eventType: eventType });
  }

  // --- Duplicate prevention ---
  // Refresh first so we catch anything booked from another tab/device.
  // Then match each target slot against existing (non-canceled) bookings
  // for this same client (by lowercase name or email). Covers the two
  // common mistakes: double-tapping "Book It", and re-booking a slot
  // that's already on the calendar.
  try { await refreshData(); } catch (_) { /* offline: fall back to cache */ }
  // Match the same client-merging rules used by the picker: name OR email
  // OR phone (digits-only). Catches dupes even if the existing booking is
  // filed under a different name variation ("Anna" vs "Anna Peck").
  const nameKey  = (name  || '').toLowerCase().trim().replace(/\s+/g, ' ');
  const emailKey = (email || '').toLowerCase().trim();
  const phoneKey = (phone || '').replace(/\D/g, '');
  const existing = (getBookings() || []).filter(b => b.status !== 'canceled');
  const dupes = [];
  const toBook = [];
  for (const t of targets) {
    const hit = existing.find(b => {
      if (b.date !== t.date || b.eventType !== t.eventType) return false;
      const bName  = (b.clientName  || '').toLowerCase().trim().replace(/\s+/g, ' ');
      const bEmail = (b.clientEmail || '').toLowerCase().trim();
      const bPhone = (b.clientPhone || '').replace(/\D/g, '');
      return (nameKey  && bName  === nameKey)
          || (emailKey && bEmail === emailKey)
          || (phoneKey.length >= 7 && bPhone === phoneKey);
    });
    if (hit) dupes.push(t); else toBook.push(t);
  }

  if (dupes.length === targets.length) {
    const when = dupes.length === 1 ? dupes[0].date : dupes.length + ' of those dates';
    alert(name + ' is already booked for ' + EVENT_LABELS[eventType] + ' on ' + when + '. Nothing to add.');
    return;
  }
  if (dupes.length > 0) {
    const msg = dupes.length + ' of ' + targets.length + ' slots are already booked for ' +
                name + ' (' + EVENT_LABELS[eventType] + '). Skip those and book the other ' +
                toBook.length + '?';
    if (!confirm(msg)) return;
  }

  let booked = 0;
  try {
    for (const t of toBook) {
      const booking = {
        id: 'b_' + Date.now() + '_' + booked,
        eventType: t.eventType,
        eventName: EVENT_LABELS[t.eventType],
        date: t.date,
        time: EVENT_TIME_SLOTS[t.eventType],
        clientName: name,
        clientEmail: email,
        clientPhone: phone,
        clientAddress: address,
        gardenNotes: notes,
        status: 'confirmed',
        createdAt: new Date().toISOString(),
        bookedBy: 'admin',
        recurringSeriesId: seriesId,
        recurringFrequency: recurring !== 'none' ? recurring : null
      };
      await DB.saveBooking(booking);
      booked++;
    }

    closeModal('modal-book');

    // Reset recurring fields
    document.getElementById('obo-recurring').value = 'none';
    document.getElementById('obo-weeks-group').style.display = 'none';

    if (booked > 1 || dupes.length > 0) {
      const parts = [];
      if (booked > 0) {
        parts.push('Booked ' + name + ' for ' + booked +
          (recurring !== 'none' ? ' ' + recurring : '') +
          ' visit' + (booked === 1 ? '' : 's') + ' starting ' + date + '.');
      }
      if (dupes.length > 0) {
        parts.push('Skipped ' + dupes.length + ' already-booked slot' + (dupes.length === 1 ? '' : 's') + '.');
      }
      alert(parts.join(' '));
    }
    await refreshData();
    renderAll();
  } catch (err) {
    alert('Could not save booking. Try again.');
  }
}

// --- Reschedule ---
let rescheduleBookingId = null;

function openReschedule(id) {
  rescheduleBookingId = id;
  const bookings = getBookings();
  const b = bookings.find(x => x.id === id);
  if (!b) return;

  document.getElementById('reschedule-info').innerHTML =
    '<div style="padding:10px 0; margin-bottom:12px; border-bottom:1px solid var(--gray-200);">' +
    '<strong>' + b.clientName + '</strong><br>' +
    '<span style="color:var(--gray-600); font-size:0.9rem;">' + b.eventName + ' on ' + b.date + ' at ' + b.time + '</span></div>';

  document.getElementById('reschedule-date').value = b.date;
  document.getElementById('reschedule-slot').value = b.eventType;
  document.getElementById('modal-reschedule').classList.add('open');
}

async function confirmReschedule() {
  if (!rescheduleBookingId) return;
  const newDate = document.getElementById('reschedule-date').value;
  const newSlot = document.getElementById('reschedule-slot').value;
  if (!newDate) { alert('Pick a new date.'); return; }

  try {
    await DB.updateBooking(rescheduleBookingId, {
      date: newDate,
      eventType: newSlot,
      eventName: EVENT_LABELS[newSlot],
      time: EVENT_TIME_SLOTS[newSlot],
      status: 'confirmed',
      rescheduledAt: new Date().toISOString(),
    });
    closeModal('modal-reschedule');
    rescheduleBookingId = null;
    await refreshData();
    renderAll();
  } catch (err) {
    alert('Could not reschedule. Try again.');
  }
}

// --- Helpers ---
function formatDate(date) {
  return date.getFullYear() + '-' +
    String(date.getMonth() + 1).padStart(2, '0') + '-' +
    String(date.getDate()).padStart(2, '0');
}

function renderAll() {
  renderWeekStrip();
  renderTomorrowBanner();
  renderDashboard();
  // Re-render whichever tab is currently visible so date navigation
  // (prevDay/nextDay/goToday/jumpToDate/jumpToDay) and post-save refreshes
  // actually update the content below — previously only the week strip
  // and dashboard refreshed, so the Day/Month/Upcoming/etc. views froze.
  const active = document.querySelector('.tab.active');
  const tab = active ? active.dataset.tab : null;
  if (tab === 'day') renderDay();
  else if (tab === 'month') renderMonth();
  else if (tab === 'upcoming') renderUpcoming();
  else if (tab === 'clients') renderClients();
  else if (tab === 'income') renderIncome();
  else if (tab === 'expenses') renderExpenses();
  else if (tab === 'taxes') renderTaxes();
  else if (tab === 'settings') renderSettings();
}

// --- Tomorrow's schedule banner ---
function renderTomorrowBanner() {
  const banner = document.getElementById('tomorrow-banner');
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  tomorrow.setHours(0,0,0,0);
  const ds = formatDate(tomorrow);
  const dow = tomorrow.getDay();

  const bookings = getBookings().filter(b => b.date === ds && b.status !== 'canceled');
  const blocks = getBlocks().filter(b => b.date === ds);

  // Don't show banner if it's Saturday evening (tomorrow = Sunday) or we're looking at a different day
  if (dow === 0 || dow === 6) {
    banner.style.display = 'none';
    return;
  }

  if (bookings.length === 0 && blocks.length === 0) {
    banner.style.display = 'block';
    banner.innerHTML = '<h3>Tomorrow</h3><div class="tomorrow-empty">Nothing booked. Wide open!</div>';
    return;
  }

  let html = '<h3>Tomorrow</h3>';

  blocks.forEach(b => {
    html += '<div class="tomorrow-item" style="color:var(--gray-600);">' +
      '<div>Blocked: ' + (b.reason || 'Time off') +
        ' (' + (b.allDay ? 'all day' : b.startTime + ' to ' + b.endTime) + ')</div>' +
      '<div class="tomorrow-item-actions">' +
        '<button class="action-btn danger" onclick="removeBlock(\'' + b.id + '\')">Remove</button>' +
      '</div>' +
    '</div>';
  });

  bookings.sort((a, b) => {
    const timeA = a.eventType === 'morning' ? '09:00' : a.eventType === 'monday' ? '13:00' : '14:30';
    const timeB = b.eventType === 'morning' ? '09:00' : b.eventType === 'monday' ? '13:00' : '14:30';
    return timeA.localeCompare(timeB);
  });

  bookings.forEach(b => {
    const phone = b.clientPhone || '';
    html += '<div class="tomorrow-item">' +
      '<div>' + b.time + ' ' + b.clientName + ' (' + EVENT_LABELS[b.eventType] + ')</div>' +
      '<div class="tomorrow-item-actions">' +
        (phone ? '<button class="action-btn" onclick="callClient(\'' + phoneAttr(phone) + '\')">Call</button>' : '') +
        (phone ? '<button class="action-btn" onclick="textClient(\'' + phoneAttr(phone) + '\')">Text</button>' : '') +
        '<button class="action-btn" onclick="openReschedule(\'' + b.id + '\')">Reschedule</button>' +
        '<button class="action-btn danger" onclick="cancelBooking(\'' + b.id + '\')">Cancel</button>' +
      '</div>' +
    '</div>';
  });

  banner.style.display = 'block';
  banner.innerHTML = html;
}

// --- Login ---
const ADMIN_PIN_HASH_KEY = 'gf_admin_pin';
const ADMIN_SESSION_KEY = 'gf_admin_session';

function isLoggedIn() {
  // If PocketBase is configured, check for auth token
  if (PB_URL && PB_TOKEN) return true;
  // For localStorage mode, check session (valid for 24 hours)
  const session = localStorage.getItem(ADMIN_SESSION_KEY);
  if (!session) return false;
  try {
    const s = JSON.parse(session);
    return s.expires > Date.now();
  } catch { return false; }
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-wrap').classList.add('visible');
  refreshData().then(() => renderAll());
}

function togglePinVisibility() {
  const input = document.getElementById('login-pin');
  const btn = document.getElementById('pin-toggle');
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '🙈';
    btn.setAttribute('aria-label', 'Hide PIN');
  } else {
    input.type = 'password';
    btn.textContent = '👁';
    btn.setAttribute('aria-label', 'Show PIN');
  }
}

async function doLogin() {
  const pin = document.getElementById('login-pin').value;
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-error');

  if (!pin) return;
  btn.disabled = true;
  err.style.display = 'none';

  if (PB_URL) {
    // Authenticate with PocketBase admin API
    try {
      const resp = await fetch(PB_URL + '/api/collections/_superusers/auth-with-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ identity: 'taya@gardenfaery.love', password: pin }),
      });
      if (!resp.ok) throw new Error('Auth failed');
      const data = await resp.json();
      PB_TOKEN = data.token;
      showApp();
      return;
    } catch (e) {
      err.style.display = 'block';
      btn.disabled = false;
      return;
    }
  }

  // localStorage mode: first login sets the PIN, subsequent logins check it
  const storedHash = localStorage.getItem(ADMIN_PIN_HASH_KEY);
  const pinHash = await hashPin(pin);

  if (!storedHash) {
    // First time: set the PIN
    localStorage.setItem(ADMIN_PIN_HASH_KEY, pinHash);
    localStorage.setItem(ADMIN_SESSION_KEY, JSON.stringify({ expires: Date.now() + 86400000 }));
    showApp();
  } else if (pinHash === storedHash) {
    localStorage.setItem(ADMIN_SESSION_KEY, JSON.stringify({ expires: Date.now() + 86400000 }));
    showApp();
  } else {
    err.style.display = 'block';
    btn.disabled = false;
  }
}

async function hashPin(pin) {
  // Simple hash using SubtleCrypto (SHA-256)
  const encoder = new TextEncoder();
  const data = encoder.encode('gf_salt_' + pin);
  const hash = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// Allow Enter key to submit
document.getElementById('login-pin').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});

// --- Init ---
// Accept a token handed off from the homepage footer login so Taya doesn't
// have to re-enter her PIN after signing in there.
var _gfHandoff = sessionStorage.getItem('gf_pb_handoff');
if (_gfHandoff) {
  sessionStorage.removeItem('gf_pb_handoff');
  PB_TOKEN = _gfHandoff;
}

if (isLoggedIn()) {
  showApp();
} else {
  document.getElementById('login-screen').style.display = 'flex';
}
