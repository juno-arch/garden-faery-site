<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bookings | Garden Faery Admin</title>
<link rel="apple-touch-icon" href="/icon-admin.png">
<link rel="icon" type="image/png" href="/icon-admin.png">
<meta name="apple-mobile-web-app-title" content="Admin">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --plum: #4a1942;
  --cream: #f8f4ed;
  --petal-pink: #c48bb0;
  --petal-pink-light: #e8d0df;
  --spring-sage: #a3b88c;
  --pollen-gold: #d4c27a;
  --sage-light: #dfe8d4;
  --white: #ffffff;
  --gray-100: #f2efe8;
  --gray-200: #e0dbd3;
  --gray-400: #a89e96;
  --gray-600: #6b5f56;
  --red-light: #f0d4d4;
  --red: #a03020;
  --radius: 12px;
  --shadow: 0 2px 12px rgba(74,25,66,0.08);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Nunito', sans-serif;
  background: var(--cream);
  color: var(--plum);
  min-height: 100vh;
  padding-bottom: 80px;
}
h1, h2, h3 { font-family: 'Lora', serif; font-weight: 400; }

.container { max-width: 520px; margin: 0 auto; padding: 16px; }

/* Top bar */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 0;
  margin-bottom: 8px;
}
.top-bar h1 { font-size: 1.5rem; }

/* Tabs */
.tabs {
  display: flex;
  gap: 4px;
  background: var(--gray-100);
  border-radius: 10px;
  padding: 4px;
  margin-bottom: 16px;
  overflow-x: auto;
}
.tab {
  flex: 1;
  padding: 10px 8px;
  border: none;
  border-radius: 8px;
  background: none;
  font-family: 'Nunito', sans-serif;
  font-weight: 600;
  font-size: 0.85rem;
  color: var(--gray-600);
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
  text-align: center;
}
.tab.active { background: var(--white); color: var(--plum); box-shadow: var(--shadow); }

/* Day view */
.day-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.day-nav h2 {
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 1.1rem;
}
.day-btn {
  background: none;
  border: none;
  font-size: 1.2rem;
  cursor: pointer;
  color: var(--plum);
  padding: 6px 12px;
  border-radius: 8px;
}
.day-btn:hover { background: var(--gray-100); }
.today-btn {
  padding: 6px 14px;
  border-radius: 8px;
  border: 2px solid var(--gray-200);
  background: var(--white);
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 0.8rem;
  color: var(--plum);
  cursor: pointer;
}
.today-btn:hover { border-color: var(--spring-sage); }

/* Timeline */
.timeline {
  position: relative;
  margin-left: 54px;
  border-left: 2px solid var(--gray-200);
  padding-left: 16px;
  min-height: 300px;
}
.time-marker {
  position: relative;
  padding: 4px 0 28px;
}
.time-label {
  position: absolute;
  left: -70px;
  top: 2px;
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--gray-400);
  width: 48px;
  text-align: right;
}
.time-dot {
  position: absolute;
  left: -23px;
  top: 7px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--gray-200);
}

/* Booking card */
.booking-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 14px;
  box-shadow: var(--shadow);
  margin-bottom: 8px;
  border-left: 4px solid var(--spring-sage);
  position: relative;
}
.booking-card.morning { border-left-color: var(--pollen-gold); }
.booking-card.afternoon { border-left-color: var(--petal-pink); }
.booking-card.monday { border-left-color: var(--spring-sage); }
.booking-card.blocked { border-left-color: var(--gray-400); background: var(--gray-100); }
.series-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.7rem;
  font-weight: 700;
  background: var(--petal-pink-light);
  color: var(--plum);
  margin-left: 6px;
}

.booking-card h3 {
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 1rem;
  margin-bottom: 2px;
}
.booking-meta {
  font-size: 0.85rem;
  color: var(--gray-600);
  margin-bottom: 8px;
}
.booking-client {
  font-size: 0.9rem;
  display: flex;
  align-items: center;
  gap: 6px;
}
.booking-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}
.action-btn {
  padding: 6px 14px;
  border-radius: 6px;
  border: 1px solid var(--gray-200);
  background: var(--white);
  font-family: 'Nunito', sans-serif;
  font-weight: 600;
  font-size: 0.8rem;
  color: var(--plum);
  cursor: pointer;
  transition: all 0.15s;
}
.action-btn:hover { border-color: var(--spring-sage); }
.action-btn.danger { color: var(--red); border-color: var(--red-light); }
.action-btn.danger:hover { background: var(--red-light); }

/* Empty state */
.empty-day {
  text-align: center;
  padding: 40px 20px;
  color: var(--gray-400);
}


/* Week view */
.week-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  margin-bottom: 16px;
}
.week-day {
  text-align: center;
  padding: 8px 4px;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.15s;
}
.week-day:hover { background: var(--gray-100); }
.week-day.active { background: var(--sage-light); }
.week-day.today-marker { box-shadow: inset 0 0 0 2px var(--pollen-gold); }
.week-day .dow { font-size: 0.7rem; font-weight: 700; color: var(--gray-400); }
.week-day .dom { font-size: 1.1rem; font-weight: 700; }
.week-day .dots { min-height: 8px; margin-top: 4px; display: flex; justify-content: center; gap: 3px; }
.week-day .dot { width: 6px; height: 6px; border-radius: 50%; }
.dot.morning-dot { background: var(--pollen-gold); }
.dot.afternoon-dot { background: var(--petal-pink); }
.dot.monday-dot { background: var(--spring-sage); }
.dot.blocked-dot { background: var(--gray-400); }

/* Block time modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 100;
  align-items: flex-end;
  justify-content: center;
}
.modal-overlay.open { display: flex; }

/* Receipt thumbnail + lightbox */
.receipt-thumb {
  width: 40px;
  height: 40px;
  border-radius: 6px;
  object-fit: cover;
  cursor: zoom-in;
  border: 1px solid var(--gray-200);
  flex-shrink: 0;
  background: var(--gray-100);
  transition: transform 0.15s;
}
.receipt-thumb:hover { transform: scale(1.05); }
.receipt-lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  z-index: 200;
  align-items: center;
  justify-content: center;
  cursor: zoom-out;
  padding: 20px;
}
.receipt-lightbox.open { display: flex; }
.receipt-lightbox img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 8px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
}
.receipt-lightbox-close {
  position: absolute;
  top: 16px;
  right: 20px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: rgba(255,255,255,0.15);
  color: white;
  font-size: 24px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.receipt-lightbox-close:hover { background: rgba(255,255,255,0.25); }
.modal {
  background: var(--white);
  border-radius: 16px 16px 0 0;
  padding: 24px 20px;
  width: 100%;
  max-width: 520px;
  max-height: 80vh;
  overflow-y: auto;
}
.modal h2 {
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 1.1rem;
  margin-bottom: 16px;
}
.modal .form-group { margin-bottom: 14px; }
.modal label {
  display: block;
  font-weight: 700;
  font-size: 0.85rem;
  margin-bottom: 6px;
}
.modal input, .modal select, .modal textarea {
  width: 100%;
  padding: 10px 12px;
  border: 2px solid var(--gray-200);
  border-radius: 8px;
  font-family: 'Nunito', sans-serif;
  font-size: 0.9rem;
  color: var(--plum);
}
.modal input:focus, .modal select:focus, .modal textarea:focus {
  outline: none;
  border-color: var(--spring-sage);
}
.modal-actions {
  display: flex;
  gap: 8px;
  margin-top: 16px;
}
.modal-btn {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: none;
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 0.95rem;
  cursor: pointer;
}
.modal-btn.primary { background: var(--petal-pink); color: var(--white); }
.modal-btn.secondary { background: var(--gray-100); color: var(--plum); }

/* Bottom action bar */
.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--white);
  border-top: 1px solid var(--gray-200);
  padding: 10px 16px;
  display: flex;
  justify-content: center;
  gap: 12px;
  z-index: 50;
}
.fab {
  padding: 12px 20px;
  border-radius: 24px;
  border: none;
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
}
.fab-primary { background: var(--petal-pink); color: var(--white); }
.fab-secondary { background: var(--sage-light); color: var(--plum); }

/* Month view */
.month-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.month-nav h2 {
  font-size: 1.1rem;
  font-family: 'Lora', serif;
  color: var(--plum);
}
.month-nav .day-btn {
  background: var(--sage-light);
  color: var(--plum);
  border: none;
  width: 36px;
  height: 36px;
  border-radius: 10px;
  font-size: 1.1rem;
  cursor: pointer;
}
.month-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  background: var(--white);
  border-radius: var(--radius);
  padding: 8px;
  box-shadow: var(--shadow);
}
.month-dow {
  text-align: center;
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--gray-600);
  padding: 4px 0;
  letter-spacing: 0.5px;
}
.month-cell {
  min-height: 64px;
  padding: 4px;
  border-radius: 8px;
  background: var(--cream, #faf6ef);
  font-size: 0.75rem;
  color: var(--plum);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  border: 1px solid transparent;
  overflow: hidden;
}
.month-cell.empty { background: transparent; cursor: default; }
.month-cell.today { border-color: var(--spring-sage); background: var(--sage-light); }
.month-cell:not(.empty):hover { border-color: var(--spring-sage); }
.month-cell .mc-num {
  font-weight: 700;
  font-size: 0.85rem;
  margin-bottom: 2px;
}
.month-cell .mc-evt {
  background: var(--petal-pink);
  color: var(--white);
  border-radius: 4px;
  padding: 1px 4px;
  margin-bottom: 2px;
  font-size: 0.65rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.month-cell .mc-evt.morning { background: var(--spring-sage); }
.month-cell .mc-evt.afternoon { background: var(--petal-pink); }
.month-cell .mc-evt.monday { background: #b48ec2; }
.month-cell .mc-evt.blocked { background: var(--gray-400); }
.month-cell .mc-more {
  font-size: 0.6rem;
  color: var(--gray-600);
}
@media (max-width: 480px) {
  .month-cell { min-height: 52px; padding: 3px; font-size: 0.7rem; }
  .month-cell .mc-evt { font-size: 0.55rem; padding: 0 2px; }
  .month-cell .mc-num { font-size: 0.75rem; }
}

/* Login screen */
.login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.login-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 32px 28px;
  box-shadow: var(--shadow);
  width: 100%;
  max-width: 360px;
  text-align: center;
}
.login-card h1 {
  font-size: 1.6rem;
  margin-bottom: 4px;
}
.login-card p {
  color: var(--gray-600);
  font-size: 0.9rem;
  margin-bottom: 24px;
}
.login-card input {
  width: 100%;
  padding: 14px 48px 14px 16px;
  border: 2px solid var(--gray-200);
  border-radius: 10px;
  font-family: 'Nunito', sans-serif;
  font-size: 1rem;
  color: var(--plum);
  text-align: center;
  letter-spacing: 2px;
  margin-bottom: 16px;
  box-sizing: border-box;
}
.pin-wrap { position: relative; }
.pin-toggle {
  position: absolute;
  right: 8px;
  top: 10px;
  background: transparent;
  border: none;
  cursor: pointer;
  font-size: 1.2rem;
  padding: 6px 10px;
  color: var(--gray-600);
  line-height: 1;
}
.pin-toggle:hover { color: var(--plum); }
.login-card input:focus {
  outline: none;
  border-color: var(--spring-sage);
}
.login-card .login-btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: var(--petal-pink);
  color: var(--white);
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 1rem;
  cursor: pointer;
}
.login-card .login-btn:hover { opacity: 0.9; }
.login-card .login-btn:disabled {
  background: var(--gray-200);
  color: var(--gray-400);
  cursor: not-allowed;
}
.login-error {
  color: #a03020;
  font-size: 0.85rem;
  margin-top: 8px;
  display: none;
}
.app-wrap { display: none; }
.app-wrap.visible { display: block; }

/* Tomorrow banner */
.tomorrow-banner {
  background: var(--sage-light);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 16px;
}
.tomorrow-banner h3 {
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--plum);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.tomorrow-banner .tomorrow-item {
  font-size: 0.9rem;
  padding: 6px 0;
  color: var(--plum);
}
.tomorrow-banner .tomorrow-item + .tomorrow-item {
  border-top: 1px solid rgba(74, 41, 72, 0.08);
}
.tomorrow-banner .tomorrow-item-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 6px;
}
.tomorrow-banner .tomorrow-empty {
  font-size: 0.9rem;
  color: var(--gray-600);
  font-style: italic;
}

@media (max-width: 400px) {
  .container { padding: 12px; }
  .timeline { margin-left: 48px; }
  .time-label { left: -62px; width: 42px; font-size: 0.7rem; }
}
</style>
</head>
<body>

<!-- Login screen -->
<div class="login-screen" id="login-screen">
  <div class="login-card">
    <h1>Garden Faery</h1>
    <p>Enter your PIN to open the dashboard.</p>
    <div class="pin-wrap">
      <input type="password" id="login-pin" placeholder="PIN" maxlength="20" autocomplete="off">
      <button type="button" class="pin-toggle" id="pin-toggle" aria-label="Show PIN" onclick="togglePinVisibility()">👁</button>
    </div>
    <button class="login-btn" id="login-btn" onclick="doLogin()">Open Dashboard</button>
    <div class="login-error" id="login-error">Wrong PIN. Try again.</div>
  </div>
</div>

<!-- Main app (hidden until login) -->
<div class="app-wrap" id="app-wrap">
<div class="container">
  <div class="top-bar">
    <h1>My Bookings</h1>
    <button class="today-btn" onclick="goToday()">Today</button>
  </div>

  <!-- Tomorrow's schedule banner -->
  <div class="tomorrow-banner" id="tomorrow-banner" style="display:none;"></div>

  <!-- Week strip -->
  <div class="week-grid" id="week-grid"></div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" data-tab="dashboard" onclick="switchTab('dashboard')">📊</button>
    <button class="tab" data-tab="day" onclick="switchTab('day')">Day</button>
    <button class="tab" data-tab="month" onclick="switchTab('month')">Month</button>
    <button class="tab" data-tab="upcoming" onclick="switchTab('upcoming')">Upcoming</button>
    <button class="tab" data-tab="clients" onclick="switchTab('clients')">Clients</button>
    <button class="tab" data-tab="income" onclick="switchTab('income')">Income</button>
    <button class="tab" data-tab="expenses" onclick="switchTab('expenses')">Expenses</button>
    <button class="tab" data-tab="settings" onclick="switchTab('settings')">⚙️</button>
  </div>

  <!-- Dashboard view -->
  <div class="tab-panel active" id="tab-dashboard">
    <div id="dashboard-content"></div>
  </div>

  <!-- Day view -->
  <div class="tab-panel" id="tab-day" style="display:none;">
    <div id="day-content"></div>
  </div>

  <!-- Month view -->
  <div class="tab-panel" id="tab-month" style="display:none;">
    <div id="month-content"></div>
  </div>

  <!-- Upcoming view -->
  <div class="tab-panel" id="tab-upcoming" style="display:none;">
    <div id="moon-conflicts-card" style="display:none; background:#fff; border:1px solid var(--gray-200); border-radius:12px; padding:16px; margin-bottom:16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <h3 style="margin:0;">🌙 Moon-day conflicts</h3>
        <button class="action-btn" onclick="syncMoonConflicts()" style="font-size:0.8rem;">Refresh</button>
      </div>
      <p style="font-size:0.85rem;color:var(--gray-600);margin-bottom:10px;">Bookings that land on moon-block days. Auto-cancel within 7 days. Tap Keep to override.</p>
      <div id="moon-conflicts-list"></div>
    </div>
    <div id="upcoming-content"></div>
  </div>

  <!-- Clients view -->
  <div class="tab-panel" id="tab-clients" style="display:none;">
    <div id="clients-content"></div>
  </div>

  <!-- Income view -->
  <div class="tab-panel" id="tab-income" style="display:none;">
    <div id="income-content"></div>
  </div>

  <!-- Expenses view -->
  <div class="tab-panel" id="tab-expenses" style="display:none;">
    <div id="expenses-content"></div>
  </div>

  <!-- Settings view -->
  <div class="tab-panel" id="tab-settings" style="display:none;">
    <div id="settings-content"></div>
  </div>
</div>

<!-- Receipt lightbox (click a thumbnail to open) -->
<div class="receipt-lightbox" id="receipt-lightbox" onclick="closeReceiptLightbox()">
  <button class="receipt-lightbox-close" onclick="event.stopPropagation(); closeReceiptLightbox()" aria-label="Close">&times;</button>
  <img id="receipt-lightbox-img" src="" alt="Receipt">
</div>

<!-- Expense modal -->
<div class="modal-overlay" id="modal-expense">
  <div class="modal" style="max-height:90vh;overflow-y:auto;">
    <h2 id="exp-title">New expense</h2>
    <div style="margin-bottom:10px;">
      <button class="modal-btn secondary" style="width:100%;" onclick="document.getElementById('exp-photo').click()">
        📷 Scan a receipt
      </button>
      <input type="file" id="exp-photo" accept="image/*,application/pdf" style="display:none;" onchange="scanReceipt(this)">
      <div id="exp-scan-status" style="font-size:0.8rem;color:var(--gray-600);margin-top:4px;"></div>
    </div>
    <div class="form-group">
      <label>Date</label>
      <input type="date" id="exp-date">
    </div>
    <div class="form-group">
      <label>Amount ($)</label>
      <input type="number" id="exp-amount" step="0.01" min="0" placeholder="0.00">
    </div>
    <div class="form-group">
      <label>Vendor</label>
      <input type="text" id="exp-vendor" placeholder="Home Depot, Bloom Nursery, etc.">
    </div>
    <div class="form-group">
      <label>Category</label>
      <select id="exp-category">
        <option value="">-</option>
        <option value="plants">Plants</option>
        <option value="soil_amendments">Soil / Amendments</option>
        <option value="tools">Tools</option>
        <option value="equipment">Equipment</option>
        <option value="fuel">Fuel</option>
        <option value="vehicle">Vehicle</option>
        <option value="supplies">Supplies</option>
        <option value="marketing">Marketing</option>
        <option value="software">Software</option>
        <option value="professional_services">Professional Services</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="form-group">
      <label>Card / payment</label>
      <select id="exp-card">
        <option value="">-</option>
        <option value="biz_debit">Business debit</option>

<script>
// ============================================
// Garden Faery Admin Dashboard v2.0
// PocketBase backend with localStorage fallback
// ============================================

// --- PocketBase Config ---
const PB_URL = 'https://bookings.gardenfaery.love'; // production PocketBase instance
let PB_TOKEN = ''; // Set after admin login

// ============================================
// DATA LAYER
// ============================================
const DB = {
  _usePB: !!PB_URL,

  async _pb(method, path, body) {
    const opts = {
      method: method,
      headers: { 'Content-Type': 'application/json' },
    };
    if (PB_TOKEN) opts.headers['Authorization'] = 'Bearer ' + PB_TOKEN;
    if (body) opts.body = JSON.stringify(body);
    const resp = await fetch(PB_URL + '/api/collections/' + path, opts);
    if (!resp.ok) throw new Error('PocketBase error: ' + resp.status);
    return resp.json();
  },

  // --- Bookings ---
  async getBookings() {
    if (!this._usePB) {
      try { return JSON.parse(localStorage.getItem('gf_bookings_v1') || '[]'); }
      catch { return []; }
    }
    const data = await this._pb('GET', 'bookings/records?perPage=500&sort=-date');
    return (data.items || []).map(r => ({
      id: r.id,
      eventType: r.event_type,
      eventName: r.event_name,
      date: r.date,
      time: r.time,
      duration: r.duration,
      clientName: r.client_name,
      clientEmail: r.client_email,
      clientPhone: r.client_phone,
      clientAddress: r.client_address,
      gardenNotes: r.garden_notes,
      status: r.status,
      bookedBy: r.booked_by,
      rescheduledAt: r.rescheduled_at,
      canceledAt: r.canceled_at,
      canceledBy: r.canceled_by,
      recurringSeriesId: r.recurring_series_id,
      recurringFrequency: r.recurring_frequency,
      price: r.price,
      paid: r.paid,
      paymentMethod: r.payment_method,
      paidDate: r.paid_date,
      paymentNotes: r.payment_notes,
      createdAt: r.created,
    }));
  },

  async saveBooking(booking) {
    if (!this._usePB) {
      const bookings = await this.getBookings();
      bookings.push(booking);
      localStorage.setItem('gf_bookings_v1', JSON.stringify(bookings));
      return booking;
    }
    const data = await this._pb('POST', 'bookings/records', {
      event_type: booking.eventType,
      event_name: booking.eventName,
      date: booking.date,
      time: booking.time,
      duration: booking.duration,
      client_name: booking.clientName,
      client_email: booking.clientEmail,
      client_phone: booking.clientPhone,
      client_address: booking.clientAddress,
      garden_notes: booking.gardenNotes,
      status: booking.status || 'confirmed',
      booked_by: booking.bookedBy || 'admin',
      recurring_series_id: booking.recurringSeriesId || null,
      recurring_frequency: booking.recurringFrequency || null,
    });
    booking.id = data.id;
    return booking;
  },

  async saveBookings(bookings) {
    if (!this._usePB) {
      localStorage.setItem('gf_bookings_v1', JSON.stringify(bookings));
      return;
    }
    // For PocketBase, batch update each changed record
    for (const b of bookings) {
      if (b._dirty && b.id) {
        await this._pb('PATCH', 'bookings/records/' + b.id, {
          status: b.status,
          canceled_at: b.canceledAt,
        });
      }
    }
  },

  async updateBooking(id, updates) {
    if (!this._usePB) {
      const bookings = await this.getBookings();
      const idx = bookings.findIndex(b => b.id === id);
      if (idx >= 0) {
        Object.assign(bookings[idx], updates);
        localStorage.setItem('gf_bookings_v1', JSON.stringify(bookings));
      }
      return;
    }
    const pbUpdates = {};
    if (updates.date !== undefined) pbUpdates.date = updates.date;
    if (updates.eventType !== undefined) pbUpdates.event_type = updates.eventType;
    if (updates.eventName !== undefined) pbUpdates.event_name = updates.eventName;
    if (updates.time !== undefined) pbUpdates.time = updates.time;
    if (updates.status !== undefined) pbUpdates.status = updates.status;
    if (updates.rescheduledAt !== undefined) pbUpdates.rescheduled_at = updates.rescheduledAt;
    if (updates.price !== undefined) pbUpdates.price = updates.price;
    if (updates.paid !== undefined) pbUpdates.paid = updates.paid;
    if (updates.paymentMethod !== undefined) pbUpdates.payment_method = updates.paymentMethod;
    if (updates.paidDate !== undefined) pbUpdates.paid_date = updates.paidDate;
    if (updates.paymentNotes !== undefined) pbUpdates.payment_notes = updates.paymentNotes;
    return this._pb('PATCH', 'bookings/records/' + id, pbUpdates);
  },

  // --- Blocked times ---
  async getBlocks() {
    if (!this._usePB) {
      try { return JSON.parse(localStorage.getItem('gf_blocks_v1') || '[]'); }
      catch { return []; }
    }
    const data = await this._pb('GET', 'blocked_times/records?perPage=500');
    return (data.items || []).map(r => ({
      id: r.id,
      date: r.date,
      allDay: r.all_day,
      startTime: r.start_time,
      endTime: r.end_time,
      reason: r.reason,
    }));
  },

  async saveBlock(block) {
    if (!this._usePB) {
      const blocks = await this.getBlocks();
      blocks.push(block);
      localStorage.setItem('gf_blocks_v1', JSON.stringify(blocks));
      return block;
    }
    const data = await this._pb('POST', 'blocked_times/records', {
      date: block.date,
      all_day: block.allDay,
      start_time: block.startTime,
      end_time: block.endTime,
      reason: block.reason,
    });
    block.id = data.id;
    return block;
  },

  async removeBlock(id) {
    if (!this._usePB) {
      const blocks = (await this.getBlocks()).filter(b => b.id !== id);
      localStorage.setItem('gf_blocks_v1', JSON.stringify(blocks));
      return;
    }
    await fetch(PB_URL + '/api/collections/blocked_times/records/' + id, {
      method: 'DELETE',
      headers: PB_TOKEN ? { 'Authorization': 'Bearer ' + PB_TOKEN } : {},
    });
  },
};

// --- Sync cache for rendering ---
let _cachedBookings = [];
let _cachedBlocks = [];

async function refreshData() {
  try {
    _cachedBookings = await DB.getBookings();
    _cachedBlocks = await DB.getBlocks();
  } catch (err) {
    console.log('Data refresh error:', err);
  }
}

function getBookings() { return _cachedBookings; }
function getBlocks() { return _cachedBlocks; }

const EVENT_LABELS = {
  morning: 'Morning Garden Care',
  afternoon: 'Afternoon Garden Care',
  monday: 'Monday After Ceramics'
};
const EVENT_TIMES = {
  morning: '9:00am to 2:00pm',
  afternoon: '2:30pm to 4:30pm',
  monday: '1:00pm to 4:30pm'
};
const EVENT_TIME_SLOTS = {
  morning: '9:00am',
  afternoon: '2:30pm',
  monday: '1:00pm'
};

let viewDate = new Date();
viewDate.setHours(0,0,0,0);

// --- Tab switching ---
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.tab-panel').forEach(p => p.style.display = 'none');
  document.getElementById('tab-' + tab).style.display = 'block';
  if (tab === 'dashboard') renderDashboard();
  if (tab === 'day') renderDay();
  if (tab === 'month') renderMonth();
  if (tab === 'upcoming') renderUpcoming();
  if (tab === 'clients') renderClients();
  if (tab === 'income') renderIncome();
  if (tab === 'expenses') renderExpenses();
  if (tab === 'settings') renderSettings();
}

// --- Dashboard (Tier 1 widgets) ---
// Tax reserve % — editable via localStorage, default 27% (covers SE tax + federal + small CA)
function getTaxReservePct() {
  const v = parseFloat(localStorage.getItem('gf_tax_reserve_pct'));
  return (v > 0 && v < 1) ? v : 0.27;
}
function setTaxReservePct(pct) {
  const v = parseFloat(pct);
  if (v > 0 && v < 1) localStorage.setItem('gf_tax_reserve_pct', String(v));
  renderDashboard();
}

async function renderDashboard() {
  await loadExpenses();
  const el = document.getElementById('dashboard-content');
  if (!el) return;

  const bookings = getBookings().filter(b => b.status !== 'canceled');
  const expenses = _cachedExpenses || [];
  const today = formatDate(new Date());
  const year = today.slice(0,4);
  const todayDate = new Date(today + 'T00:00:00');

  // --- YTD totals ---
  const ytdBookings = bookings.filter(b => (b.date||'').startsWith(year) && (b.date||'') <= today);
  const ytdGross = ytdBookings.reduce((s,b) => s + (Number(b.price)||0), 0);
  const ytdPaid  = ytdBookings.filter(b => b.paid).reduce((s,b) => s + (Number(b.price)||0), 0);
  const ytdExpensesBiz = expenses.filter(e => (e.date||'').startsWith(year) && e.onBiz).reduce((s,e) => s + e.amount, 0);
  const ytdNet = ytdGross - ytdExpensesBiz;
  const taxPct = getTaxReservePct();
  const ytdTaxReserve = Math.max(0, ytdNet) * taxPct;

  // --- Outstanding (overdue unpaid, any month) ---
  const overdue = bookings.filter(b => (b.date||'') < today && !b.paid && (Number(b.price)||0) > 0);
  const overdueTotal = overdue.reduce((s,b) => s + (Number(b.price)||0), 0);
  const overdueCount = overdue.length;
  const overdueClients = new Set(overdue.map(b => b.clientEmail || b.clientName)).size;

  // --- Next 30 days projection ---
  const next30End = new Date(todayDate); next30End.setDate(next30End.getDate() + 30);
  const next30EndStr = formatDate(next30End);
  const upcoming = bookings.filter(b => (b.date||'') >= today && (b.date||'') <= next30EndStr);
  const next30Projected = upcoming.reduce((s,b) => s + (Number(b.price)||0), 0);
  const next30Count = upcoming.length;

  // --- 12-month revenue (last 12 including current) ---
  const months = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(todayDate.getFullYear(), todayDate.getMonth() - i, 1);
    months.push({ key: d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'), label: d.toLocaleString('en-US',{month:'short'}), year: d.getFullYear() });
  }
  const monthBuckets = months.map(m => {
    const bs = bookings.filter(b => (b.date||'').slice(0,7) === m.key);
    const paid = bs.filter(b => b.paid).reduce((s,b) => s + (Number(b.price)||0), 0);
    const outstanding = bs.filter(b => !b.paid).reduce((s,b) => s + (Number(b.price)||0), 0);
    return { ...m, paid, outstanding, total: paid + outstanding };
  });
  const maxMonth = Math.max(1, ...monthBuckets.map(m => m.total));

  // --- Top 5 clients YTD ---
  const clientTotals = {};
  ytdBookings.forEach(b => {
    const key = b.clientEmail || b.clientName || 'unknown';
    if (!clientTotals[key]) clientTotals[key] = { name: b.clientName || 'Unknown', email: b.clientEmail || '', gross: 0, visits: 0 };
    clientTotals[key].gross += Number(b.price)||0;
    clientTotals[key].visits += 1;
  });
  const topClients = Object.values(clientTotals).sort((a,b) => b.gross - a.gross).slice(0, 5);

  // --- Render ---
  const fmt = n => '$' + Math.round(n).toLocaleString();
  const netColor = ytdNet >= 0 ? '#6b8f52' : 'var(--red)';

  let html = '';

  // 1. YTD snapshot row
  html += `
    <div style="background:var(--white);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;">
        <h3 style="margin:0;font-size:1rem;">${year} Year-to-Date</h3>
        <span style="font-size:0.75rem;color:var(--gray-600);">as of ${today}</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;">
        <div>
          <div style="font-size:0.7rem;color:var(--gray-600);">Gross</div>
          <div style="font-size:1.15rem;font-weight:700;color:#6b8f52;">${fmt(ytdGross)}</div>
          <div style="font-size:0.68rem;color:var(--gray-400);">${fmt(ytdPaid)} paid</div>
        </div>
        <div>
          <div style="font-size:0.7rem;color:var(--gray-600);">Biz Expenses</div>
          <div style="font-size:1.15rem;font-weight:700;color:var(--red);">${fmt(ytdExpensesBiz)}</div>
          <div style="font-size:0.68rem;color:var(--gray-400);">deductible</div>
        </div>
        <div>
          <div style="font-size:0.7rem;color:var(--gray-600);">Net</div>
          <div style="font-size:1.15rem;font-weight:700;color:${netColor};">${fmt(ytdNet)}</div>
          <div style="font-size:0.68rem;color:var(--gray-400);">gross − biz</div>
        </div>
        <div>
          <div style="font-size:0.7rem;color:var(--gray-600);">Tax Reserve</div>
          <div style="font-size:1.15rem;font-weight:700;color:#c48bb0;">${fmt(ytdTaxReserve)}</div>
          <div style="font-size:0.68rem;color:var(--gray-400);">
            <input type="number" min="10" max="50" step="1" value="${Math.round(taxPct*100)}" onchange="setTaxReservePct(this.value/100)" style="width:36px;padding:1px 2px;font-size:0.68rem;border:1px solid var(--gray-200);border-radius:4px;">% of net
          </div>
        </div>
      </div>
    </div>
  `;

  // 2. 12-month revenue chart
  html += `
    <div style="background:var(--white);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;">
        <h3 style="margin:0;font-size:1rem;">Last 12 Months</h3>
        <span style="font-size:0.75rem;color:var(--gray-600);"><span style="display:inline-block;width:10px;height:10px;background:#6b8f52;border-radius:2px;vertical-align:middle;margin-right:4px;"></span>paid <span style="display:inline-block;width:10px;height:10px;background:#e8b828;border-radius:2px;vertical-align:middle;margin-right:4px;margin-left:10px;"></span>unpaid</span>
      </div>
      <div style="display:flex;align-items:stretch;gap:6px;height:140px;padding:0 4px;border-bottom:1px solid var(--gray-200);">
  `;
  monthBuckets.forEach(m => {
    const totalPct = maxMonth > 0 ? (m.total / maxMonth) * 100 : 0;
    const paidPct = m.total > 0 ? (m.paid / m.total) * 100 : 0;
    const outstandPct = 100 - paidPct;
    html += `
        <div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;min-width:0;">
          <div title="${m.label} ${m.year}: ${fmt(m.paid)} paid + ${fmt(m.outstanding)} unpaid = ${fmt(m.total)}" style="width:100%;height:${totalPct}%;min-height:${m.total>0?'2px':'0'};display:flex;flex-direction:column;justify-content:flex-end;border-radius:3px 3px 0 0;overflow:hidden;">
            <div style="background:#e8b828;height:${outstandPct}%;min-height:${m.outstanding>0?'2px':'0'};"></div>
            <div style="background:#6b8f52;height:${paidPct}%;min-height:${m.paid>0?'2px':'0'};"></div>
          </div>
        </div>
    `;
  });
  html += `</div><div style="display:flex;gap:6px;padding:4px 4px 0;">`;
  monthBuckets.forEach(m => {
    html += `<div style="flex:1;text-align:center;font-size:0.65rem;color:var(--gray-600);">${m.label}</div>`;
  });
  html += `</div></div>`;

  // 3. Outstanding balance card
  html += `
    <div style="background:${overdueTotal>0?'#fff4e5':'var(--white)'};border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);border:${overdueTotal>0?'1px solid #e8b828':'none'};">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <h3 style="margin:0 0 2px;font-size:1rem;">${overdueTotal > 0 ? '💰 You\'re owed' : 'All paid up'}</h3>
          <div style="font-size:0.8rem;color:var(--gray-600);">
            ${overdueTotal > 0
              ? `${overdueCount} past visit${overdueCount===1?'':'s'} across ${overdueClients} client${overdueClients===1?'':'s'}`
              : 'No overdue balances — nice work.'}
          </div>
        </div>
        <div>
          <div style="font-size:1.4rem;font-weight:700;color:${overdueTotal>0?'#c48bb0':'#6b8f52'};text-align:right;">${fmt(overdueTotal)}</div>
          ${overdueTotal > 0 ? '<button class="modal-btn secondary" style="padding:4px 10px;font-size:0.8rem;margin-top:4px;" onclick="switchTab(\'income\')">See list →</button>' : ''}
        </div>
      </div>
    </div>
  `;

  // 4. Next 30 days projection
  html += `
    <div style="background:var(--white);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div>
          <h3 style="margin:0 0 2px;font-size:1rem;">Next 30 days</h3>
          <div style="font-size:0.8rem;color:var(--gray-600);">
            ${next30Count} booking${next30Count===1?'':'s'} scheduled ${next30Count>0?'· expected revenue':''}
          </div>
        </div>
        <div style="font-size:1.4rem;font-weight:700;color:#6b8f52;text-align:right;">${fmt(next30Projected)}</div>
      </div>
    </div>
  `;

  // 6-7. Service mix pie + Expense donut (side-by-side on wider screens)
  // Service mix: aggregate YTD revenue by event type
  const SVC_COLORS = { morning: '#e8b828', afternoon: '#c48bb0', monday: '#a3b88c', other: '#a89e96' };
  const SVC_LABELS = { morning: 'Morning', afternoon: 'Afternoon', monday: 'Monday', other: 'Other' };
  const svcTotals = { morning: 0, afternoon: 0, monday: 0, other: 0 };
  ytdBookings.forEach(b => {
    const k = svcTotals.hasOwnProperty(b.eventType) ? b.eventType : 'other';
    svcTotals[k] += Number(b.price) || 0;
  });
  const svcTotal = Object.values(svcTotals).reduce((s,v) => s+v, 0);
  const svcSlices = svcTotal > 0
    ? Object.entries(svcTotals).filter(([,v]) => v > 0).map(([k,v]) => ({ k, v, pct: (v/svcTotal)*100, color: SVC_COLORS[k], label: SVC_LABELS[k] }))
    : [];

  // Expense categories donut
  const EXP_COLORS = {
    plants: '#6b8f52', soil_amendments: '#8b6b45', tools: '#4a1942', equipment: '#7a3b4e',
    fuel: '#c9553a', vehicle: '#a67c52', supplies: '#8fb0a5', marketing: '#c48bb0',
    software: '#506a6e', professional_services: '#b5c99a', other: '#a89e96'
  };
  const EXP_LABELS = {
    plants: 'Plants', soil_amendments: 'Soil/amend', tools: 'Tools', equipment: 'Equipment',
    fuel: 'Fuel', vehicle: 'Vehicle', supplies: 'Supplies', marketing: 'Marketing',
    software: 'Software', professional_services: 'Pro svcs', other: 'Other'
  };
  const ytdBizExpenses = expenses.filter(e => (e.date||'').startsWith(year) && e.onBiz);
  const expByCategory = {};
  ytdBizExpenses.forEach(e => {
    const k = e.category || 'other';
    expByCategory[k] = (expByCategory[k] || 0) + e.amount;
  });
  const expSlices = ytdExpensesBiz > 0
    ? Object.entries(expByCategory).sort((a,b) => b[1] - a[1]).map(([k,v]) => ({ k, v, pct: (v/ytdExpensesBiz)*100, color: EXP_COLORS[k] || '#a89e96', label: EXP_LABELS[k] || k }))
    : [];

  // Build conic-gradient strings (safe — generator makes no assumptions about slice count)
  const buildConic = slices => {
    if (!slices.length) return 'var(--gray-100)';
    let cursor = 0;
    return 'conic-gradient(' + slices.map(s => {
      const start = cursor;
      cursor += s.pct;
      return `${s.color} ${start.toFixed(2)}% ${cursor.toFixed(2)}%`;
    }).join(', ') + ')';
  };

  const renderSlicesLegend = (slices, valuePrefix = '$') => {
    if (!slices.length) return '<div style="color:var(--gray-600);font-size:0.85rem;">No data yet.</div>';
    return slices.map(s => `
      <div style="display:flex;align-items:center;gap:6px;font-size:0.78rem;margin-bottom:3px;">
        <span style="width:10px;height:10px;border-radius:2px;background:${s.color};flex-shrink:0;"></span>
        <span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${s.label}</span>
        <span style="color:var(--gray-600);font-variant-numeric:tabular-nums;">${valuePrefix}${Math.round(s.v).toLocaleString()} · ${s.pct.toFixed(0)}%</span>
      </div>
    `).join('');
  };

  html += `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:12px;">
      <div style="background:var(--white);border-radius:12px;padding:14px;box-shadow:var(--shadow);">
        <h3 style="margin:0 0 10px;font-size:1rem;">Service mix ${year}</h3>
        <div style="display:flex;gap:14px;align-items:center;">
          <div style="width:100px;height:100px;border-radius:50%;flex-shrink:0;background:${buildConic(svcSlices)};"></div>
          <div style="flex:1;min-width:0;">${renderSlicesLegend(svcSlices)}</div>
        </div>
      </div>
      <div style="background:var(--white);border-radius:12px;padding:14px;box-shadow:var(--shadow);">
        <h3 style="margin:0 0 10px;font-size:1rem;">Expense categories ${year}</h3>
        <div style="display:flex;gap:14px;align-items:center;">
          <div style="width:100px;height:100px;border-radius:50%;flex-shrink:0;background:${buildConic(expSlices)};position:relative;">
            <div style="position:absolute;inset:22px;background:var(--white);border-radius:50%;"></div>
          </div>
          <div style="flex:1;min-width:0;">${renderSlicesLegend(expSlices)}</div>
        </div>
      </div>
    </div>
  `;

  // 8. Net profit trend line (last 12 months)
  const monthNet = monthBuckets.map(m => {
    const expInMo = expenses.filter(e => (e.date||'').slice(0,7) === m.key && e.onBiz).reduce((s,e) => s + e.amount, 0);
    return { ...m, expenses: expInMo, net: m.total - expInMo };
  });
  const netVals = monthNet.map(m => m.net);
  const netMin = Math.min(0, ...netVals);
  const netMax = Math.max(100, ...netVals);
  const netRange = Math.max(1, netMax - netMin);
  const chartW = 600, chartH = 120, padX = 24, padY = 14;
  const plotW = chartW - padX * 2;
  const plotH = chartH - padY * 2;
  const xAt = i => padX + (i / Math.max(1, monthNet.length - 1)) * plotW;
  const yAt = v => padY + plotH - ((v - netMin) / netRange) * plotH;
  const zeroY = yAt(0);
  const pointsStr = monthNet.map((m,i) => xAt(i) + ',' + yAt(m.net)).join(' ');
  const areaPath = 'M' + xAt(0) + ',' + zeroY + ' L' + pointsStr.split(' ').join(' L ') + ' L' + xAt(monthNet.length-1) + ',' + zeroY + ' Z';

  html += `
    <div style="background:var(--white);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;">
        <h3 style="margin:0;font-size:1rem;">Net profit trend</h3>
        <span style="font-size:0.72rem;color:var(--gray-600);">month-over-month (biz expenses subtracted)</span>
      </div>
      <svg viewBox="0 0 ${chartW} ${chartH}" preserveAspectRatio="none" style="width:100%;height:${chartH}px;display:block;">
        <line x1="${padX}" y1="${zeroY}" x2="${chartW - padX}" y2="${zeroY}" stroke="var(--gray-200)" stroke-width="1" stroke-dasharray="3 3"/>
        <path d="${areaPath}" fill="rgba(107,143,82,0.12)" stroke="none"/>
        <polyline points="${pointsStr}" fill="none" stroke="#6b8f52" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
        ${monthNet.map((m,i) => `<circle cx="${xAt(i)}" cy="${yAt(m.net)}" r="3" fill="${m.net>=0?'#6b8f52':'#c9553a'}"><title>${m.label} ${m.year}: ${fmt(m.net)} net</title></circle>`).join('')}
      </svg>
      <div style="display:flex;padding:4px ${padX}px 0;">
        ${monthNet.map(m => `<div style="flex:1;text-align:center;font-size:0.65rem;color:var(--gray-600);">${m.label}</div>`).join('')}
      </div>
    </div>
  `;

  // 5. Top 5 clients YTD
  if (topClients.length > 0) {
    html += `
      <div style="background:var(--white);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);">
        <h3 style="margin:0 0 10px;font-size:1rem;">Top clients ${year}</h3>
    `;
    const topMax = topClients[0].gross || 1;
    topClients.forEach((c, i) => {
      const pct = (c.gross / topMax) * 100;
      html += `
        <div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:${i<topClients.length-1?'1px solid var(--gray-100)':'none'};">
          <div style="flex:1;min-width:0;">
            <div style="font-weight:600;font-size:0.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${c.name}</div>
            <div style="height:4px;background:var(--gray-100);border-radius:2px;margin-top:4px;overflow:hidden;">
              <div style="width:${pct}%;height:100%;background:#c48bb0;"></div>
            </div>
          </div>
          <div style="text-align:right;flex-shrink:0;">
            <div style="font-weight:700;font-size:0.95rem;">${fmt(c.gross)}</div>
            <div style="font-size:0.7rem;color:var(--gray-600);">${c.visits} visit${c.visits===1?'':'s'}</div>
          </div>
        </div>
      `;
    });
    html += `</div>`;
  } else {
    html += `
      <div style="background:var(--white);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);text-align:center;color:var(--gray-600);font-size:0.9rem;">
        No client revenue yet this year.
      </div>
    `;
  }

  el.innerHTML = html;
}

function renderSettings() {
  const el = document.getElementById('settings-content');
  const key = localStorage.getItem('gf_anthropic_key') || '';
  const masked = key ? (key.slice(0,12) + '…' + key.slice(-6)) : '(not set)';
  el.innerHTML = `
    <div style="background:var(--white);border-radius:12px;padding:16px;box-shadow:var(--shadow);">
      <h3 style="margin-bottom:10px;">Receipt scanner</h3>
      <p style="font-size:0.85rem;color:var(--gray-600);margin-bottom:12px;">
        Paste your Anthropic API key here. It saves on this device only - never sent to the server, never committed anywhere.
      </p>
      <div class="form-group">
        <label>Anthropic API key</label>
        <input type="password" id="setting-api-key" placeholder="${masked}" autocomplete="off">
      </div>
      <div style="display:flex;gap:8px;">
        <button class="modal-btn primary" onclick="saveApiKey()">Save</button>
        ${key ? '<button class="modal-btn secondary" onclick="clearApiKey()">Remove</button>' : ''}
      </div>
      <div id="setting-status" style="font-size:0.85rem;margin-top:8px;"></div>
      <p style="font-size:0.75rem;color:var(--gray-400);margin-top:16px;line-height:1.4;">
        Currently: ${masked}<br>
        Scanning a receipt uses Claude's vision API (~$0.01/scan). Set a monthly cap in your Anthropic console.
      </p>
    </div>
  `;
}
function saveApiKey() {
  const v = document.getElementById('setting-api-key').value.trim();
  if (!v) return;
  if (!v.startsWith('sk-ant-')) {
    document.getElementById('setting-status').innerHTML = '<span style="color:var(--red);">Doesn\'t look like an Anthropic key (should start with sk-ant-)</span>';
    return;
  }
  localStorage.setItem('gf_anthropic_key', v);
  document.getElementById('setting-status').innerHTML = '<span style="color:var(--spring-sage,#6b8f52);">Saved ✓</span>';
  setTimeout(renderSettings, 1000);
}
function clearApiKey() {
  if (!confirm('Remove the saved API key from this device?')) return;
  localStorage.removeItem('gf_anthropic_key');
  renderSettings();
}

// --- Expenses ---
let expenseViewMonth = (() => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); })();
let _cachedExpenses = [];
let _editingExpenseId = null;
let _pendingReceiptFile = null;

async function loadExpenses() {
  try {
    const resp = await fetch(PB_URL + '/api/collections/expenses/records?perPage=500&sort=-date', {
      headers: { 'Authorization': PB_TOKEN }
    });
    if (!resp.ok) return;
    const data = await resp.json();
    _cachedExpenses = (data.items || []).map(r => ({
      id: r.id,
      date: (r.date || '').slice(0,10),
      amount: Number(r.amount) || 0,
      vendor: r.vendor || '',
      category: r.category || '',
      card: r.card || '',
      onBiz: r.on_biz_account,
      notes: r.notes || '',
      receipt: r.receipt || '',
      lineItems: r.line_items || null,
      _collection: r.collectionId
    }));
  } catch(e) { console.error(e); }
}

async function renderExpenses() {
  await loadExpenses();
  const el = document.getElementById('expenses-content');
  const all = _cachedExpenses;
  const months = Array.from(new Set(all.map(e => (e.date||'').slice(0,7)).filter(Boolean))).sort().reverse();
  if (!months.includes(expenseViewMonth)) months.unshift(expenseViewMonth);

  const inMonth = all.filter(e => (e.date||'').slice(0,7) === expenseViewMonth);
  const total = inMonth.reduce((s,e) => s + e.amount, 0);
  const bizTotal = inMonth.filter(e => e.onBiz).reduce((s,e) => s + e.amount, 0);
  const personalTotal = total - bizTotal;

  // Income for same month (P&L)
  const incomeMonth = getBookings().filter(b => b.status !== 'canceled' && (b.date||'').slice(0,7) === expenseViewMonth);
  const gross = incomeMonth.reduce((s,b) => s + (Number(b.price)||0), 0);
  const net = gross - total;

  const monthOpts = months.map(m => `<option value="${m}"${m===expenseViewMonth?' selected':''}>${m}</option>`).join('');

  let html = `
    <div style="background:var(--white);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;">
        <select onchange="expenseViewMonth=this.value;renderExpenses()" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--gray-200);">${monthOpts}</select>
        <button class="modal-btn primary" style="padding:8px 12px;" onclick="openExpenseModal()">+ Add</button>
        <button class="modal-btn secondary" style="padding:8px 12px;" onclick="exportExpenseCsv()">CSV</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;">
        <div><div style="font-size:0.7rem;color:var(--gray-600);">Income</div><div style="font-size:1.05rem;font-weight:700;">$${gross.toFixed(0)}</div></div>
        <div><div style="font-size:0.7rem;color:var(--gray-600);">Expenses</div><div style="font-size:1.05rem;font-weight:700;color:var(--red);">$${total.toFixed(0)}</div></div>
        <div><div style="font-size:0.7rem;color:var(--gray-600);">Net</div><div style="font-size:1.05rem;font-weight:700;color:${net>=0?'#6b8f52':'var(--red)'};">$${net.toFixed(0)}</div></div>
        <div><div style="font-size:0.7rem;color:var(--gray-600);">Biz / Personal</div><div style="font-size:0.85rem;font-weight:700;">$${bizTotal.toFixed(0)} / $${personalTotal.toFixed(0)}</div></div>
      </div>
    </div>
  `;

  html += '<div style="background:var(--white);border-radius:12px;padding:12px;box-shadow:var(--shadow);"><h3 style="margin-bottom:8px;font-size:1rem;">Expenses this month</h3>';
  if (!inMonth.length) {
    html += '<div style="color:var(--gray-600);font-size:0.9rem;">No expenses logged.</div>';
  } else {
    inMonth.sort((a,b) => (b.date||'').localeCompare(a.date||''));
    inMonth.forEach(e => {
      const bizTag = e.onBiz
        ? `<span style="background:#dfe8d4;color:#4a1942;padding:2px 6px;border-radius:8px;font-size:0.7rem;font-weight:700;">BIZ</span>`
        : `<span style="background:var(--gray-100);color:var(--gray-600);padding:2px 6px;border-radius:8px;font-size:0.7rem;font-weight:700;">personal</span>`;
      const cardLabel = (e.card||'').replace('_',' ');
      const thumb = e.receipt && e._collection && e.id
        ? `<img class="receipt-thumb" src="${receiptUrl(e)}" alt="Receipt thumbnail" onclick="openReceiptLightbox('${receiptUrl(e)}')" loading="lazy">`
        : '';
      html += `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--gray-100);gap:10px;">
          ${thumb}
          <div style="flex:1;min-width:0;">
            <div style="font-weight:600;">${e.date} · ${e.vendor || 'Unknown vendor'}</div>
            <div style="font-size:0.8rem;color:var(--gray-600);">${e.category||'-'} ${cardLabel?'· '+cardLabel:''} ${bizTag}</div>
          </div>
          <div style="display:flex;gap:8px;align-items:center;">
            <div style="font-weight:700;">$${e.amount.toFixed(2)}</div>
            <button class="modal-btn secondary" style="padding:4px 10px;font-size:0.8rem;" onclick="openExpenseModal('${e.id}')">Edit</button>
          </div>
        </div>`;
    });
  }
  html += '</div>';
  el.innerHTML = html;
}

function openExpenseModal(id) {
  _editingExpenseId = id || null;
  _pendingReceiptFile = null;
  const e = id ? _cachedExpenses.find(x => x.id === id) : null;
  document.getElementById('exp-title').textContent = e ? 'Edit expense' : 'New expense';
  document.getElementById('exp-date').value = e ? e.date : formatDate(new Date());
  document.getElementById('exp-amount').value = e ? e.amount : '';
  document.getElementById('exp-vendor').value = e ? e.vendor : '';
  document.getElementById('exp-category').value = e ? e.category : '';
  document.getElementById('exp-card').value = e ? e.card : '';
  document.getElementById('exp-biz').checked = e ? !!e.onBiz : false;
  document.getElementById('exp-notes').value = e ? e.notes : '';
  document.getElementById('exp-scan-status').textContent = '';
  document.getElementById('exp-line-items').innerHTML = (e && e.lineItems) ? renderLineItems(e.lineItems) : '';
  document.getElementById('exp-photo').value = '';
  document.getElementById('modal-expense').classList.add('open');
}

function closeExpenseModal() {
  document.getElementById('modal-expense').classList.remove('open');
  _editingExpenseId = null;
  _pendingReceiptFile = null;
}

function renderLineItems(items) {
  if (!Array.isArray(items) || !items.length) return '';
  let h = '<div style="margin-top:4px;padding:8px;background:var(--gray-100);border-radius:8px;"><b>Line items:</b>';
  items.forEach(i => { h += `<div>${i.description || ''} - $${Number(i.amount||0).toFixed(2)}</div>`; });
  h += '</div>';
  return h;
}

async function saveExpense() {
  const body = {
    date: document.getElementById('exp-date').value,
    amount: parseFloat(document.getElementById('exp-amount').value) || 0,
    vendor: document.getElementById('exp-vendor').value,
    category: document.getElementById('exp-category').value || null,
    card: document.getElementById('exp-card').value || null,
    on_biz_account: document.getElementById('exp-biz').checked,
    notes: document.getElementById('exp-notes').value
  };
  if (!body.date || !body.amount) { alert('Date and amount are required.'); return; }

  try {
    let id = _editingExpenseId;
    if (_pendingReceiptFile) {
      // Use multipart so we can include the file
      const fd = new FormData();
      Object.entries(body).forEach(([k,v]) => fd.append(k, v == null ? '' : (typeof v === 'boolean' ? String(v) : v)));
      fd.append('receipt', _pendingReceiptFile);
      const url = PB_URL + '/api/collections/expenses/records' + (id ? '/'+id : '');
      const r = await fetch(url, {
        method: id ? 'PATCH' : 'POST',
        headers: { 'Authorization': PB_TOKEN },
        body: fd
      });
      if (!r.ok) throw new Error(await r.text());
    } else {
      const url = PB_URL + '/api/collections/expenses/records' + (id ? '/'+id : '');
      const r = await fetch(url, {
        method: id ? 'PATCH' : 'POST',
        headers: { 'Content-Type':'application/json', 'Authorization': PB_TOKEN },
        body: JSON.stringify(body)
      });
      if (!r.ok) throw new Error(await r.text());
    }
    closeExpenseModal();
    renderExpenses();
  } catch (e) {
    alert('Save failed: ' + e.message);
  }
}

function exportExpenseCsv() {
  const inMonth = _cachedExpenses.filter(e => (e.date||'').slice(0,7) === expenseViewMonth);
  const rows = [['Date','Vendor','Amount','Category','Card','On Biz','Notes']];
  inMonth.sort((a,b) => (a.date||'').localeCompare(b.date||''));
  inMonth.forEach(e => {
    rows.push([e.date, e.vendor, e.amount.toFixed(2), e.category, e.card, e.onBiz?'yes':'no', (e.notes||'').replace(/"/g,'""')]);
  });
  const csv = rows.map(r => r.map(c => `"${String(c||'')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type:'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'expenses-' + expenseViewMonth + '.csv'; a.click();
  URL.revokeObjectURL(url);
}

// --- Receipt helpers (URL + lightbox) ---
function receiptUrl(e) {
  if (!e || !e.receipt || !e._collection || !e.id) return '';
  return PB_URL + '/api/files/' + e._collection + '/' + e.id + '/' + encodeURIComponent(e.receipt);
}
function openReceiptLightbox(url) {
  const lb = document.getElementById('receipt-lightbox');
  const img = document.getElementById('receipt-lightbox-img');
  if (!lb || !img || !url) return;
  img.src = url;
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeReceiptLightbox() {
  const lb = document.getElementById('receipt-lightbox');
  if (!lb) return;
  lb.classList.remove('open');
  document.body.style.overflow = '';
}
// Close lightbox on Esc
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const lb = document.getElementById('receipt-lightbox');
    if (lb && lb.classList.contains('open')) closeReceiptLightbox();
  }
});

// --- Receipt OCR via Claude Vision API ---
// Downscale an image File to JPEG base64, capped at maxLongSide pixels and given quality.
// Returns { b64, mediaType }. Falls back to raw bytes if canvas/decoding fails.
async function downscaleImageToBase64(file, maxLongSide, quality) {
  const rawBytesToB64 = async () => {
    const buf = await file.arrayBuffer();
    return {
      b64: btoa(Array.from(new Uint8Array(buf)).map(b => String.fromCharCode(b)).join('')),
      mediaType: file.type || 'image/jpeg'
    };
  };
  try {
    const url = URL.createObjectURL(file);
    const img = await new Promise((resolve, reject) => {
      const i = new Image();
      i.onload = () => resolve(i);
      i.onerror = reject;
      i.src = url;
    });
    const longSide = Math.max(img.naturalWidth, img.naturalHeight);
    const scale = longSide > maxLongSide ? maxLongSide / longSide : 1;
    const w = Math.round(img.naturalWidth * scale);
    const h = Math.round(img.naturalHeight * scale);
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(url);
    const dataUrl = canvas.toDataURL('image/jpeg', quality);
    // Strip "data:image/jpeg;base64,"
    const b64 = dataUrl.split(',')[1] || '';
    // Approx size check: base64 is ~4/3 of bytes. Cap at 4.5 MB raw => ~6 MB b64.
    const approxBytes = Math.floor(b64.length * 3 / 4);
    if (approxBytes > 4_500_000 && quality > 0.6) {
      // Re-encode at lower quality
      const dataUrl2 = canvas.toDataURL('image/jpeg', 0.65);
      return { b64: dataUrl2.split(',')[1] || '', mediaType: 'image/jpeg' };
    }
    return { b64, mediaType: 'image/jpeg' };
  } catch (e) {
    return await rawBytesToB64();
  }
}

// Static system prompt — cached to skip re-tokenizing on repeat scans.
// Prompt caching requires the block to be ~1024+ tokens for Haiku; this one is ~1.4k.
const RECEIPT_SYSTEM_PROMPT = `You are an expense-logging assistant for Garden Faery, a sole-proprietor gardening business in Arcata and Humboldt County, California. Taya (the owner) is scanning a receipt to log an expense.

Your job is to extract the receipt's details and call the record_receipt tool once with the best-fit values. Never respond in prose — always call the tool.

Category guidance (pick ONE):
- plants: seeds, starts, bare-root stock, live plants, cuttings
- soil_amendments: compost, mulch, bagged soil, fertilizer, worm castings, lime, gypsum
- tools: hand tools (trowels, pruners, shears, loppers, hori-hori, weeders)
- equipment: larger items — wheelbarrows, tarps, stakes, trellis, raised-bed lumber, hardware cloth
- fuel: gasoline, diesel, propane
- vehicle: oil change, tires, registration, repair, insurance — anything car-related that isn't fuel
- supplies: gloves, trash bags, twine, zip ties, markers, flagging tape, stakes under $20
- marketing: flyers, signs, ads, business cards, website costs
- software: subscriptions (Cal.com, Canva, hosting, domain)
- professional_services: accountant, lawyer, contractor, photographer
- other: anything that doesn't fit above

Common local vendors and how to read them:
- Mad River Gardens, Miller Farms, Pierson Garden Shop, Humboldt Bay Homes: plants or soil_amendments depending on item
- Ace Hardware, Home Depot: usually equipment or tools; read line items
- Chevron, 76, Shell, Costco gas: fuel
- Les Schwab: vehicle
- Costco, Safeway, WinCo (if buying supplies vs groceries): supplies if it's flagging tape, trash bags, buckets; otherwise flag as on_biz_hint=false

Date format: ALWAYS YYYY-MM-DD. If receipt shows "3/15/26" convert to "2026-03-15". If year is 2-digit assume 2000s.

Amount: the grand total, pre or post-tax depending on what's printed at the bottom — use the final total paid. Subtotal and tax go in their own fields if visible.

on_biz_hint: true for gardening-ish purchases, false for clear personal (groceries, restaurants, clothing, personal pharmacy), null if you genuinely can't tell.

confidence: 0.9+ for clear receipts, 0.7 for partial damage or smudges, 0.4-0.6 for hard reads. If below 0.6, briefly note what's unclear in the "notes" field.

Call the tool exactly once. Do not include any text alongside the tool call.`;

async function scanReceipt(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  _pendingReceiptFile = file;
  const key = localStorage.getItem('gf_anthropic_key');
  const status = document.getElementById('exp-scan-status');
  if (!key) {
    status.innerHTML = '<span style="color:var(--red);">Receipt attached. Set Anthropic API key in ⚙️ Settings to auto-extract fields.</span>';
    return;
  }
  if (file.type === 'application/pdf') {
    status.innerHTML = 'PDF attached (auto-scan only works on images right now - enter details manually).';
    return;
  }
  status.textContent = '📷 Scanning…';

  // Do downscale and API-payload prep in parallel-ish (downscale is the slow CPU part).
  const downscalePromise = downscaleImageToBase64(file, 1800, 0.85);

  try {
    const { b64, mediaType } = await downscalePromise;

    // Build request with prompt caching on the static system prompt + tool definition.
    // Cache hits save ~90% on tokens for the cached block and speed up response.
    const body = {
      model: 'claude-haiku-4-5-20251001',
      max_tokens: 1024,
      system: [
        { type: 'text', text: RECEIPT_SYSTEM_PROMPT, cache_control: { type: 'ephemeral' } }
      ],
      tools: [RECEIPT_TOOL],
      tool_choice: { type: 'tool', name: 'record_receipt' },
      messages: [{
        role: 'user',
        content: [
          { type: 'image', source: { type: 'base64', media_type: mediaType, data: b64 } },
          { type: 'text', text: 'Scan this receipt and call record_receipt.' }
        ]
      }]
    };

    const parsed = await _callReceiptAPI(key, body, 2); // up to 2 attempts

    if (!parsed) return; // error already shown by _callReceiptAPI

    // Populate form
    if (parsed.date) document.getElementById('exp-date').value = parsed.date;
    if (parsed.vendor) document.getElementById('exp-vendor').value = parsed.vendor;
    if (parsed.amount != null) document.getElementById('exp-amount').value = parsed.amount;
    if (parsed.category) document.getElementById('exp-category').value = parsed.category;
    if (Array.isArray(parsed.line_items)) document.getElementById('exp-line-items').innerHTML = renderLineItems(parsed.line_items);
    // Auto-set biz/personal if model is confident enough
    const bizCheckbox = document.getElementById('exp-on-biz');
    if (bizCheckbox && parsed.on_biz_hint !== null && parsed.on_biz_hint !== undefined) {
      bizCheckbox.checked = !!parsed.on_biz_hint;
    }
    // Merge notes if any
    if (parsed.notes) {
      const notesEl = document.getElementById('exp-notes');
      if (notesEl && !notesEl.value) notesEl.value = parsed.notes;
    }

    const conf = typeof parsed.confidence === 'number' ? parsed.confidence : 0.85;
    const confLabel = conf >= 0.85 ? '' : conf >= 0.6 ? ' (moderate confidence - double-check fields)' : ' (low confidence - verify carefully)';
    status.innerHTML = '<span style="color:#6b8f52;">Scanned ✓' + confLabel + ' - review and adjust before saving.</span>';
  } catch (e) {
    status.innerHTML = '<span style="color:var(--red);">Scan error: ' + e.message + '</span>';
  }
}

// Single API call with timeout and retry. Returns parsed tool input, or null on unrecoverable failure.
async function _callReceiptAPI(key, body, maxAttempts) {
  const status = document.getElementById('exp-scan-status');
  let lastErr = '';
  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 30_000); // 30s timeout
    try {
      const resp = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        signal: controller.signal,
        headers: {
          'x-api-key': key,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
          'content-type': 'application/json'
        },
        body: JSON.stringify(body)
      });
      clearTimeout(timeoutId);
      if (!resp.ok) {
        const err = await resp.text();
        // Retry on 5xx or 429; fail fast on 4xx
        if ((resp.status >= 500 || resp.status === 429) && attempt < maxAttempts) {
          lastErr = resp.status + ' ' + err.slice(0,100);
          await new Promise(r => setTimeout(r, 600 * attempt)); // backoff
          continue;
        }
        status.innerHTML = '<span style="color:var(--red);">Scan failed: ' + err.slice(0,200) + '</span>';
        return null;
      }
      const data = await resp.json();
      // Find the tool_use block
      const toolBlock = (data.content || []).find(b => b.type === 'tool_use' && b.name === 'record_receipt');
      if (!toolBlock) {
        // Model returned text instead of tool call — rare with tool_choice forcing, but handle it
        const textBlock = (data.content || []).find(b => b.type === 'text');
        status.innerHTML = '<span style="color:var(--red);">Model did not call the tool. ' + ((textBlock?.text || '').slice(0,120)) + '</span>';
        return null;
      }
      return toolBlock.input;
    } catch (e) {
      clearTimeout(timeoutId);
      lastErr = e.name === 'AbortError' ? 'timed out' : e.message;
      if (attempt < maxAttempts) {
        await new Promise(r => setTimeout(r, 600 * attempt));
        continue;
      }
      status.innerHTML = '<span style="color:var(--red);">Scan error: ' + lastErr + '</span>';
      return null;
    }
  }
  return null;
}

// --- Income tab ---
let incomeViewMonth = (() => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); })();
let _payingBookingId = null;

function renderIncome() {
  const el = document.getElementById('income-content');
  const all = getBookings().filter(b => b.status !== 'canceled');
  const today = formatDate(new Date());
  // Pull all months that have bookings
  const months = Array.from(new Set(all.map(b => (b.date||'').slice(0,7)).filter(Boolean))).sort().reverse();
  if (!months.includes(incomeViewMonth)) months.unshift(incomeViewMonth);

  // --- Overall outstanding balance (all past visits, any month) ---
  const overdue = all.filter(b => (b.date||'') < today && !b.paid && (Number(b.price)||0) > 0);
  const overdueTotal = overdue.reduce((s,b) => s + (Number(b.price)||0), 0);
  const overdueByClient = {};
  overdue.forEach(b => {
    const k = b.clientName || 'Unknown';
    if (!overdueByClient[k]) overdueByClient[k] = { count: 0, total: 0, oldest: b.date };
    overdueByClient[k].count++;
    overdueByClient[k].total += Number(b.price)||0;
    if ((b.date||'') < overdueByClient[k].oldest) overdueByClient[k].oldest = b.date;
  });

  const inMonth = all.filter(b => (b.date||'').slice(0,7) === incomeViewMonth);
  const gross = inMonth.reduce((s,b) => s + (Number(b.price)||0), 0);
  const paid  = inMonth.filter(b => b.paid).reduce((s,b) => s + (Number(b.price)||0), 0);
  const outstanding = gross - paid;

  // Per-client breakdown for the month
  const byClient = {};
  inMonth.forEach(b => {
    const k = b.clientName || 'Unknown';
    if (!byClient[k]) byClient[k] = { count:0, gross:0, paid:0 };
    byClient[k].count++;
    byClient[k].gross += Number(b.price)||0;
    if (b.paid) byClient[k].paid += Number(b.price)||0;
  });

  const monthOpts = months.map(m => `<option value="${m}"${m===incomeViewMonth?' selected':''}>${m}</option>`).join('');

  // Outstanding balance card — shown only if money is actually owed.
  let html = '';
  if (overdueTotal > 0) {
    const clientRows = Object.entries(overdueByClient)
      .sort((a,b) => b[1].total - a[1].total)
      .map(([name, info]) => {
        const visits = info.count + ' visit' + (info.count === 1 ? '' : 's');
        return '<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:0.9rem;">' +
          '<span>' + escapeHtml(name) + ' <span style="color:var(--gray-600);font-size:0.8rem;">· ' + visits + ' · oldest ' + escapeHtml(info.oldest) + '</span></span>' +
          '<span style="font-weight:700;">$' + info.total.toFixed(0) + '</span>' +
        '</div>';
      }).join('');
    html += '<div class="card" style="background:#fff5f3;border:1px solid var(--red-light);border-radius:12px;padding:14px;margin-bottom:12px;">' +
      '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;">' +
        '<h3 style="margin:0;color:var(--red);">You\'re owed</h3>' +
        '<div style="font-size:1.6rem;font-weight:700;color:var(--red);">$' + overdueTotal.toFixed(0) + '</div>' +
      '</div>' +
      '<div style="font-size:0.8rem;color:var(--gray-600);margin-bottom:8px;">Past visits without a payment on file.</div>' +
      clientRows +
    '</div>';
  }

  html += `
    <div class="card" style="background:var(--white);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;">
        <select onchange="incomeViewMonth=this.value;renderIncome()" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--gray-200);">${monthOpts}</select>
        <button class="modal-btn secondary" style="padding:8px 12px;" onclick="exportIncomeCsv()">CSV</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;">
        <div><div style="font-size:0.75rem;color:var(--gray-600);">Gross</div><div style="font-size:1.3rem;font-weight:700;">$${gross.toFixed(0)}</div></div>
        <div><div style="font-size:0.75rem;color:var(--gray-600);">Paid</div><div style="font-size:1.3rem;font-weight:700;color:var(--spring-sage,#6b8f52);">$${paid.toFixed(0)}</div></div>
        <div><div style="font-size:0.75rem;color:var(--gray-600);">Outstanding</div><div style="font-size:1.3rem;font-weight:700;color:${outstanding>0?'var(--red)':'var(--gray-400)'};">$${outstanding.toFixed(0)}</div></div>
      </div>
    </div>
  `;

  html += '<div style="background:var(--white);border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:var(--shadow);"><h3 style="margin-bottom:8px;font-size:1rem;">Bookings this month</h3>';
  if (!inMonth.length) {
    html += '<div style="color:var(--gray-600);font-size:0.9rem;">No bookings.</div>';
  } else {
    inMonth.sort((a,b) => (a.date||'').localeCompare(b.date||''));
    inMonth.forEach(b => {
      const price = Number(b.price)||0;
      const paidBadge = b.paid
        ? `<span style="background:#dfe8d4;color:#4a1942;padding:2px 8px;border-radius:10px;font-size:0.75rem;font-weight:700;">PAID ${b.paymentMethod? '· '+b.paymentMethod:''}</span>`
        : (price > 0 ? `<span style="background:var(--red-light);color:var(--red);padding:2px 8px;border-radius:10px;font-size:0.75rem;font-weight:700;">UNPAID</span>` : `<span style="color:var(--gray-400);font-size:0.8rem;">no price</span>`);
      html += `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--gray-100);">
          <div style="flex:1;min-width:0;">
            <div style="font-weight:600;">${b.date} · ${b.clientName||'Client'}</div>
            <div style="font-size:0.8rem;color:var(--gray-600);">${EVENT_LABELS[b.eventType]||b.eventType} · $${price.toFixed(0)}</div>
          </div>
          <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;">${paidBadge}${!b.paid && price > 0 ? `<button class="modal-btn primary" style="padding:4px 10px;font-size:0.8rem;" onclick="quickMarkPaid('${b.id}')">Paid</button><button class="modal-btn secondary" style="padding:4px 10px;font-size:0.8rem;" onclick="sendInvoice('${b.id}')">Invoice</button>` : ''}<button class="modal-btn secondary" style="padding:4px 10px;font-size:0.8rem;" onclick="openPayment('${b.id}')">Edit</button></div>
        </div>`;
    });
  }
  html += '</div>';

  html += '<div style="background:var(--white);border-radius:12px;padding:12px;box-shadow:var(--shadow);"><h3 style="margin-bottom:8px;font-size:1rem;">By client</h3>';
  const clientRows = Object.entries(byClient).sort((a,b) => b[1].gross - a[1].gross);
  if (!clientRows.length) {
    html += '<div style="color:var(--gray-600);font-size:0.9rem;">-</div>';
  } else {
    clientRows.forEach(([name, s]) => {
      html += `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--gray-100);font-size:0.9rem;">
        <span>${name} <span style="color:var(--gray-600);font-size:0.8rem;">(${s.count})</span></span>
        <span><b>$${s.gross.toFixed(0)}</b> <span style="color:var(--gray-600);font-size:0.8rem;">(${s.paid.toFixed(0)} paid)</span></span>
      </div>`;
    });
  }
  html += '</div>';

  el.innerHTML = html;
}

function openPayment(bookingId) {
  const b = getBookings().find(x => x.id === bookingId);
  if (!b) return;
  _payingBookingId = bookingId;
  document.getElementById('pay-booking-info').textContent = `${b.date} · ${b.clientName||'Client'} · ${EVENT_LABELS[b.eventType]||b.eventType}`;
  document.getElementById('pay-price').value = b.price || '';
  document.getElementById('pay-paid').checked = !!b.paid;
  document.getElementById('pay-method').value = b.paymentMethod || '';
  document.getElementById('pay-date').value = (b.paidDate||'').slice(0,10);
  document.getElementById('pay-notes').value = b.paymentNotes || '';
  document.getElementById('modal-payment').classList.add('open');
}

async function savePayment() {
  if (!_payingBookingId) return;
  const price = parseFloat(document.getElementById('pay-price').value) || 0;
  const paid = document.getElementById('pay-paid').checked;
  const method = document.getElementById('pay-method').value || null;
  const paidDate = document.getElementById('pay-date').value || null;
  const notes = document.getElementById('pay-notes').value || '';
  // If marking paid and no date set, default to today
  const finalDate = paid && !paidDate ? formatDate(new Date()) : paidDate;
  try {
    await DB.updateBooking(_payingBookingId, {
      price, paid, paymentMethod: method, paidDate: finalDate, paymentNotes: notes
    });
    // Update cache
    const b = _cachedBookings.find(x => x.id === _payingBookingId);
    if (b) { b.price = price; b.paid = paid; b.paymentMethod = method; b.paidDate = finalDate; b.paymentNotes = notes; }
    closeModal('modal-payment');
    _payingBookingId = null;
    renderIncome();
  } catch (e) {
    alert('Save failed: ' + e.message);
  }
}

async function quickMarkPaid(bookingId) {
  const b = getBookings().find(x => x.id === bookingId);
  if (!b) return;
  const method = prompt('Payment method? (cash, check, card, venmo, zelle, other)', b.paymentMethod || 'cash');
  if (method === null) return;
  const today = formatDate(new Date());
  try {
    await DB.updateBooking(bookingId, { paid: true, paymentMethod: method || null, paidDate: today });
    const cached = _cachedBookings.find(x => x.id === bookingId);
    if (cached) { cached.paid = true; cached.paymentMethod = method || null; cached.paidDate = today; }
    renderIncome();
  } catch (e) {
    alert('Save failed: ' + e.message);
  }
}

function sendInvoice(bookingId) {
  const b = getBookings().find(x => x.id === bookingId);
  if (!b) return;
  const price = Number(b.price) || 0;
  const service = EVENT_LABELS[b.eventType] || b.eventType || 'Garden care visit';
  const to = b.clientEmail || '';
  const subject = `Invoice from Garden Faery — ${b.date}`;
  const body =
    `Hi ${(b.clientName || '').split(' ')[0] || 'there'},\n\n` +
    `Thanks so much for having me in the garden on ${b.date}. Here is your invoice:\n\n` +
    `  Service:  ${service}\n` +
    `  Date:     ${b.date}\n` +
    `  Amount:   $${price.toFixed(0)}\n\n` +
    `Payment options:\n` +
    `  Venmo:   @gardenfaery\n` +
    `  Zelle:   taya@gardenfaery.love\n` +
    `  Check:   payable to Taya (address on request)\n` +
    `  Cash:    next visit is fine too\n\n` +
    `Just reply to this email if anything looks off or you want to reschedule something.\n\n` +
    `Whimsy,\n` +
    `Taya\n` +
    `Your local Garden Faery. Arcata & Humboldt County.\n` +
    `taya@gardenfaery.love`;
  const mailto = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  window.location.href = mailto;
}

function exportIncomeCsv() {
  const inMonth = getBookings().filter(b => b.status !== 'canceled' && (b.date||'').slice(0,7) === incomeViewMonth);
  const rows = [['Date','Client','Service','Price','Paid','Method','Paid Date','Notes']];
  inMonth.sort((a,b) => (a.date||'').localeCompare(b.date||''));
  inMonth.forEach(b => {
    rows.push([
      b.date || '',
      b.clientName || '',
      EVENT_LABELS[b.eventType] || b.eventType || '',
      Number(b.price)||0,
      b.paid ? 'yes' : 'no',
      b.paymentMethod || '',
      (b.paidDate||'').slice(0,10),
      (b.paymentNotes||'').replace(/"/g,'""')
    ]);
  });
  const csv = rows.map(r => r.map(c => `"${String(c)}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type:'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'income-' + incomeViewMonth + '.csv'; a.click();
  URL.revokeObjectURL(url);
}
