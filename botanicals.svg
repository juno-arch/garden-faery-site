<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Line-art botanicals. Use via <svg class="botanical"><use href="botanicals.svg#leaf-fern"/></svg>.
       All strokes use currentColor; size via .botanical / .botanical--lg / etc. -->

  <symbol id="leaf-simple" viewBox="0 0 48 48">
    <path d="M24 6 C 12 14, 8 30, 24 42 C 40 30, 36 14, 24 6 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M24 10 L 24 40" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M24 18 L 18 20 M24 22 L 16 25 M24 26 L 17 30 M24 30 L 19 34" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
    <path d="M24 18 L 30 20 M24 22 L 32 25 M24 26 L 31 30 M24 30 L 29 34" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
  </symbol>

  <symbol id="leaf-fern" viewBox="0 0 48 48">
    <path d="M24 44 C 24 34, 24 18, 24 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Pairs of lobes along the stem -->
    <g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
      <path d="M24 10 Q 18 8, 14 12"/>
      <path d="M24 10 Q 30 8, 34 12"/>
      <path d="M24 16 Q 16 14, 10 19"/>
      <path d="M24 16 Q 32 14, 38 19"/>
      <path d="M24 22 Q 15 21, 8 26"/>
      <path d="M24 22 Q 33 21, 40 26"/>
      <path d="M24 28 Q 16 28, 10 32"/>
      <path d="M24 28 Q 32 28, 38 32"/>
      <path d="M24 34 Q 19 35, 15 38"/>
      <path d="M24 34 Q 29 35, 33 38"/>
    </g>
  </symbol>

  <symbol id="leaf-trefoil" viewBox="0 0 48 48">
    <path d="M24 36 L 24 44" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Three heart-shaped leaflets -->
    <path d="M24 36 C 18 30, 10 30, 10 22 C 10 16, 16 12, 20 16 C 22 18, 24 22, 24 28 Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M24 36 C 30 30, 38 30, 38 22 C 38 16, 32 12, 28 16 C 26 18, 24 22, 24 28 Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M24 28 C 18 24, 18 14, 24 8 C 30 14, 30 24, 24 28 Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
  </symbol>

  <symbol id="flower-daisy" viewBox="0 0 48 48">
    <!-- 8 petals around center -->
    <g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
      <ellipse cx="24" cy="10" rx="3.5" ry="7"/>
      <ellipse cx="24" cy="38" rx="3.5" ry="7"/>
      <ellipse cx="10" cy="24" rx="7" ry="3.5"/>
      <ellipse cx="38" cy="24" rx="7" ry="3.5"/>
      <ellipse cx="14" cy="14" rx="3.5" ry="7" transform="rotate(-45 14 14)"/>
      <ellipse cx="34" cy="14" rx="3.5" ry="7" transform="rotate(45 34 14)"/>
      <ellipse cx="14" cy="34" rx="3.5" ry="7" transform="rotate(45 14 34)"/>
      <ellipse cx="34" cy="34" rx="3.5" ry="7" transform="rotate(-45 34 34)"/>
    </g>
    <circle cx="24" cy="24" r="3.5" fill="currentColor" opacity="0.85"/>
  </symbol>

  <symbol id="flower-rosebud" viewBox="0 0 48 48">
    <path d="M24 46 C 24 40, 24 30, 24 22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M20 36 Q 14 34, 12 30" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M28 34 Q 34 32, 36 28" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <!-- Bud with layered petals -->
    <path d="M14 20 C 14 10, 20 4, 24 4 C 28 4, 34 10, 34 20 C 34 26, 30 30, 24 30 C 18 30, 14 26, 14 20 Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M18 18 C 18 12, 22 8, 24 8 C 26 8, 30 12, 30 18 C 30 22, 28 25, 24 25 C 20 25, 18 22, 18 18 Z" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.7"/>
    <path d="M22 16 C 22 13, 24 11, 24 11 C 24 11, 26 13, 26 16 C 26 19, 25 20, 24 20 C 23 20, 22 19, 22 16 Z" fill="none" stroke="currentColor" stroke-width="1"/>
  </symbol>

  <symbol id="flower-cluster" viewBox="0 0 48 48">
    <!-- A little bouquet: three small flowers with leaves -->
    <g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
      <path d="M16 46 L 16 28"/>
      <path d="M24 46 L 24 22"/>
      <path d="M32 46 L 32 30"/>
      <path d="M20 38 Q 14 36, 12 40"/>
      <path d="M28 38 Q 34 36, 36 40"/>
    </g>
    <!-- Flower 1 -->
    <g transform="translate(16 24)">
      <circle cx="0" cy="-3" r="3" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <circle cx="-3" cy="1" r="3" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <circle cx="3" cy="1" r="3" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <circle cx="0" cy="0" r="1.3" fill="currentColor"/>
    </g>
    <!-- Flower 2 (bigger, center) -->
    <g transform="translate(24 18)">
      <circle cx="0" cy="-4" r="3.5" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <circle cx="-4" cy="1" r="3.5" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <circle cx="4" cy="1" r="3.5" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <circle cx="0" cy="4" r="3.5" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <circle cx="0" cy="0" r="1.6" fill="currentColor"/>
    </g>
    <!-- Flower 3 -->
    <g transform="translate(32 26)">
      <circle cx="0" cy="-3" r="3" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <circle cx="-3" cy="1" r="3" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <circle cx="3" cy="1" r="3" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <circle cx="0" cy="0" r="1.3" fill="currentColor"/>
    </g>
  </symbol>

  <symbol id="vine-divider" viewBox="0 0 200 32">
    <!-- Horizontal divider: vine with leaves and two small flowers -->
    <path d="M10 16 Q 40 8, 70 16 T 130 16 T 190 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Leaves along the vine -->
    <path d="M40 10 Q 36 4, 44 6 Q 46 8, 40 10 Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M70 22 Q 66 28, 74 26 Q 76 24, 70 22 Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M130 10 Q 126 4, 134 6 Q 136 8, 130 10 Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M160 22 Q 156 28, 164 26 Q 166 24, 160 22 Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
    <!-- Two little flowers -->
    <g transform="translate(100 16)">
      <circle cx="0" cy="-4" r="2.5" fill="none" stroke="currentColor" stroke-width="1.1"/>
      <circle cx="-4" cy="1" r="2.5" fill="none" stroke="currentColor" stroke-width="1.1"/>
      <circle cx="4" cy="1" r="2.5" fill="none" stroke="currentColor" stroke-width="1.1"/>
      <circle cx="0" cy="3" r="2.5" fill="none" stroke="currentColor" stroke-width="1.1"/>
      <circle cx="0" cy="0" r="1.2" fill="currentColor"/>
    </g>
    <g transform="translate(20 16)">
      <circle cx="0" cy="-2.5" r="1.8" fill="none" stroke="currentColor" stroke-width="1"/>
      <circle cx="-2.5" cy="0.5" r="1.8" fill="none" stroke="currentColor" stroke-width="1"/>
      <circle cx="2.5" cy="0.5" r="1.8" fill="none" stroke="currentColor" stroke-width="1"/>
      <circle cx="0" cy="0" r="0.9" fill="currentColor"/>
    </g>
    <g transform="translate(180 16)">
      <circle cx="0" cy="-2.5" r="1.8" fill="none" stroke="currentColor" stroke-width="1"/>
      <circle cx="-2.5" cy="0.5" r="1.8" fill="none" stroke="currentColor" stroke-width="1"/>
      <circle cx="2.5" cy="0.5" r="1.8" fill="none" stroke="currentColor" stroke-width="1"/>
      <circle cx="0" cy="0" r="0.9" fill="currentColor"/>
    </g>
  </symbol>

  <symbol id="seedling" viewBox="0 0 48 48">
    <!-- Ground line -->
    <path d="M8 38 L 40 38" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity="0.8"/>
    <path d="M12 40 L 16 40 M32 40 L 36 40" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    <!-- Stem -->
    <path d="M24 38 C 24 30, 24 22, 24 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Two cotyledon leaves -->
    <path d="M24 22 C 16 20, 10 24, 14 28 C 18 28, 22 26, 24 22 Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M24 22 C 32 20, 38 24, 34 28 C 30 28, 26 26, 24 22 Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
    <!-- Top new growth bud -->
    <path d="M24 16 C 22 13, 22 10, 24 9 C 26 10, 26 13, 24 16 Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
  </symbol>

  <symbol id="vine-spiral" viewBox="0 0 48 48">
    <!-- A curling tendril corner ornament -->
    <path d="M4 4 C 20 4, 28 12, 28 20 C 28 28, 20 32, 14 28 C 10 25, 12 20, 18 20 C 22 20, 24 23, 22 25" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M28 12 Q 32 8, 36 10 Q 34 14, 30 14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
    <path d="M28 22 Q 34 20, 38 24 Q 34 26, 30 26" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
  </symbol>
</svg>
