  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --text-primary: #4a1942;
      --text-secondary: rgba(74, 25, 66, 0.6);
      --font-heading: 'Elsie Swash Caps', serif;
      --font-body: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --bg: #f8f4ed;
      --accent-1: #c48bb0;
      --accent-2: #a3b88c;
      --highlight: #d4c27a;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text-primary);
      line-height: 1.6;
    }

    h1, h2, h3, h4 {
      font-family: var(--font-heading);
      color: var(--text-primary);
      line-height: 1.2;
    }

    .site-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 54px;
      background: var(--bg);
      border-bottom: 2px solid var(--accent-1);
    }

    .nav-logo {
      font-family: var(--font-heading);
      font-size: 22px;
      font-weight: 900;
      color: var(--text-primary);
      text-decoration: none;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      gap: 6px;
    }

    .nav-links a {
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      text-decoration: none;
      padding: 6px 14px;
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }

    .nav-links a:hover {
      color: var(--text-primary);
    }

    .nav-links a.active {
      color: var(--text-primary);
      border-bottom-color: var(--accent-1);
    }

    @media (max-width: 480px) {
      .site-nav {
        padding: 0 16px;
      }
      .nav-logo {
        font-size: 18px;
      }
      .nav-links a {
        font-size: 12px;
        padding: 6px 8px;
      }
      .nav-links {
        gap: 0;
      }
    }

    footer {
      text-align: center;
      padding: 20px 20px 24px;
      font-size: 14px;
      font-weight: 600;
      color: var(--accent-1);
      background: var(--text-primary);
    }

    footer a {
      color: var(--accent-1);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    .page-content {
      max-width: 620px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .page-title {
      font-size: 36px;
      font-weight: 900;
      margin-bottom: 4px;
    }

    .gallery-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 20px;
      font-style: italic;
    }

    .gallery-subtitle a {
      color: var(--accent-1);
      text-decoration: none;
      font-style: normal;
      font-weight: 600;
    }

    .gallery-subtitle a:hover {
      text-decoration: underline;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (min-width: 500px) {
      .gallery-grid {
        grid-template-columns: 1fr 1fr 1fr;
      }
    }

    .gallery-item {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 1/1;
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      transition: transform 0.3s;
    }

    .gallery-item:hover {
      transform: scale(1.03);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .gallery-item .caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(74, 25, 66, 0.7));
      color: white;
      font-size: 11px;
      padding: 20px 10px 8px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .gallery-item:hover .caption {
      opacity: 1;
    }

    .gallery-empty {
      grid-column: 1 / -1;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      color: var(--accent-1);
      font-size: 14px;
      font-style: italic;
      border: 1px dashed rgba(74, 25, 66, 0.15);
    }
  </style>
</head>

  <script>
    // Seasonal colors
    (function applySeason() {
      var month = new Date().getMonth();
      var root = document.documentElement;
      var palettes = {
        spring: { bg: '#f8f4ed', a1: '#c48bb0', a2: '#a3b88c', hl: '#d4c27a' },
        summer: { bg: '#faf6f1', a1: '#e8b828', a2: '#b5c99a', hl: '#7b2d6e' },
        autumn: { bg: '#faf3ea', a1: '#d4943a', a2: '#a67c52', hl: '#7a3b4e' },
        winter: { bg: '#f5f3f0', a1: '#8fb0a5', a2: '#506a6e', hl: '#c4b5a0' }
      };
      var p;
      if (month >= 2 && month <= 4) p = palettes.spring;
      else if (month >= 5 && month <= 7) p = palettes.summer;
      else if (month >= 8 && month <= 10) p = palettes.autumn;
      else p = palettes.winter;
      root.style.setProperty('--bg', p.bg);
      root.style.setProperty('--accent-1', p.a1);
      root.style.setProperty('--accent-2', p.a2);
      root.style.setProperty('--highlight', p.hl);
    })();

    // Gallery
    var galleryPhotos = [
      { src: 'gallery/taya.jpg', alt: 'Taya, the Garden Faery', caption: '' },
      { src: 'gallery/img_1306.jpg', alt: 'Garden beds and greenery', caption: '' },
      { src: 'gallery/img_0537.jpg', alt: 'Garden work', caption: '' },
      { src: 'gallery/farm.jpg', alt: 'The farm', caption: '' }
    ];
    var instagramHandle = '';

    (function buildGallery() {
      var grid = document.getElementById('gallery-grid');
      var follow = document.getElementById('gallery-follow');
      if (instagramHandle) {
        follow.innerHTML = 'follow along <a href="https://instagram.com/' + instagramHandle + '" target="_blank" rel="noopener">@' + instagramHandle + '</a>';
      }
      if (galleryPhotos.length === 0) {
        grid.innerHTML = '<div class="gallery-empty">more magic coming soon</div>';
        return;
      }
      galleryPhotos.forEach(function(photo) {
        var item = document.createElement('div');
        item.className = 'gallery-item';
        var img = document.createElement('img');
        img.src = photo.src;
        img.alt = photo.alt || '';
        img.loading = 'lazy';
        item.appendChild(img);
        if (photo.caption) {
          var cap = document.createElement('div');
          cap.className = 'caption';
          cap.textContent = photo.caption;
          item.appendChild(cap);
        }
        grid.appendChild(item);
      });
    })();
  </script>
