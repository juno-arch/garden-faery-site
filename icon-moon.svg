<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <mask id="crescent">
      <rect width="512" height="512" fill="white"/>
      <circle cx="320" cy="246" r="180" fill="black"/>
    </mask>
    <radialGradient id="drop" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffb3c7"/>
      <stop offset="60%" stop-color="#ff6e8c"/>
      <stop offset="100%" stop-color="#c12e52"/>
    </radialGradient>
    <radialGradient id="moonFill" cx="35%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#e9d8ff"/>
      <stop offset="100%" stop-color="#b58bff"/>
    </radialGradient>
  </defs>
  <!-- Waxing crescent (bulge left, opens right) -->
  <circle cx="256" cy="256" r="210" fill="url(#moonFill)" mask="url(#crescent)"/>
  <!-- Blood drop nestled in the crescent's inner curve -->
  <path d="
    M 340 260
    C 368 302, 378 336, 360 362
    C 340 390, 300 390, 286 366
    C 270 340, 290 302, 318 268
    C 324 260, 334 258, 340 260 Z"
    fill="url(#drop)"/>
  <!-- Highlight on the drop -->
  <ellipse cx="312" cy="320" rx="8" ry="16" fill="#ffe2ec" opacity="0.55" transform="rotate(-18 312 320)"/>
</svg>
