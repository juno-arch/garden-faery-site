<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4a1942">
<title>Garden Faery — Invoice</title>
<meta name="description" content="Your Garden Faery invoice.">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --plum: #4a1942;
  --cream: #f8f4ed;
  --petal-pink: #c48bb0;
  --spring-sage: #a3b88c;
  --pollen-gold: #d4c27a;
  --white: #ffffff;
  --gray-100: #f2efe8;
  --gray-200: #e0dbd3;
  --gray-400: #a89e96;
  --gray-600: #6b5f56;
  --red: #a03020;
  --green: #0a7a3a;
  --radius: 12px;
  --shadow: 0 2px 12px rgba(74,25,66,0.08);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--cream);
  color: var(--plum);
  min-height: 100vh;
  padding: 24px 16px 80px;
  line-height: 1.5;
}
.wrap { max-width: 720px; margin: 0 auto; }
.brand { font-family: 'Fraunces', serif; font-weight: 500; font-size: 1.5rem; margin-bottom: 18px; text-align: center; }
.brand a { color: var(--plum); text-decoration: none; }
.card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 26px 26px 22px;
  box-shadow: var(--shadow);
  margin-bottom: 14px;
}
.head {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 18px;
  flex-wrap: wrap;
  padding-bottom: 18px; border-bottom: 1px solid var(--gray-200); margin-bottom: 18px;
}
.head h1 {
  font-family: 'Fraunces', serif; font-weight: 500; font-size: 1.6rem;
}
.muted { color: var(--gray-600); font-size: 0.88rem; }
.pill {
  display: inline-block; padding: 3px 11px; border-radius: 99px;
  font-size: 0.75rem; font-weight: 600; text-transform: capitalize;
}
.pill.draft { background: #f0f0f0; color: #555; }
.pill.sent, .pill.viewed { background: #dbeafe; color: #0a5a8a; }
.pill.viewed { background: #fef0c4; color: #7a5a00; }
.pill.paid { background: #dcefe2; color: var(--green); }
.pill.overdue { background: #fde2e2; color: var(--red); }
.pill.void { background: #e8e8e8; color: #666; }
.from-to { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 16px; }
.from-to h3 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.55; margin-bottom: 6px; }
table.items { width: 100%; border-collapse: collapse; margin-bottom: 16px; font-size: 0.93rem; }
table.items th, table.items td { padding: 9px 6px; text-align: left; }
table.items th { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gray-600); border-bottom: 1px solid var(--gray-200); }
table.items td { border-bottom: 1px solid var(--gray-100); }
table.items td.r, table.items th.r { text-align: right; }
.totals { margin-left: auto; max-width: 280px; font-size: 0.95rem; }
.totals .row { display: flex; justify-content: space-between; padding: 4px 0; }
.totals .row.grand { border-top: 1px solid var(--gray-200); margin-top: 6px; padding-top: 8px; font-weight: 600; font-size: 1.15rem; color: var(--plum); }
.notes { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--gray-200); font-size: 0.88rem; color: var(--gray-600); white-space: pre-wrap; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.btn {
  padding: 13px 22px; border: none; border-radius: 8px;
  font-family: inherit; font-size: 1rem; font-weight: 600; cursor: pointer;
  background: var(--plum); color: var(--white);
}
.btn:hover { background: #5a1f54; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn.secondary { background: var(--white); color: var(--plum); border: 2px solid var(--plum); }
.btn.secondary:hover { background: var(--cream); }
.paid-banner {
  background: #dcefe2; color: var(--green); padding: 14px 18px; border-radius: 8px;
  font-weight: 600; text-align: center; margin-bottom: 16px;
}
.err { color: var(--red); margin: 12px 0; }
.foot { text-align: center; font-size: 0.78rem; color: var(--gray-600); margin-top: 22px; }
.foot a { color: var(--plum); }

@media (max-width: 540px) {
  .from-to { grid-template-columns: 1fr; }
  .head h1 { font-size: 1.3rem; }
  .totals { max-width: 100%; }
}

@media print {
  body { background: #fff; padding: 0; }
  .brand { display: none; }
  .actions, .foot { display: none; }
  .card { box-shadow: none; border: 1px solid #ccc; }
}
</style>
</head>
<body>
<div class="wrap">
  <div id="root"><div class="card"><p class="muted">Loading invoice…</p></div></div>
</div>

<script>
const PB_URL = 'https://bookings.gardenfaery.love';
const TOKEN = new URLSearchParams(location.search).get('t') || '';

async function loadInvoice() {
  if (!TOKEN) { showErr('Missing invoice link.'); return; }
  try {
    const res = await fetch(PB_URL + '/api/invoice/view?token=' + encodeURIComponent(TOKEN));
    const data = await res.json();
    if (!data.ok) { showErr(data.error || 'Could not load invoice.'); return; }
    render(data);
  } catch (err) { showErr('Network error: ' + err.message); }
}

function fmt(c) { return '$' + ((c || 0) / 100).toFixed(2); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render(inv) {
  const today = new Date().toISOString().slice(0, 10);
  let status = inv.status;
  if (['sent','viewed','partial'].includes(status) && inv.due_date && inv.due_date < today) status = 'overdue';

  const lineRows = (inv.line_items || []).map(it =>
    '<tr><td>' + esc(it.description) + '</td>' +
    '<td class="r">' + (it.qty || 0) + '</td>' +
    '<td class="r">' + fmt(it.unit_cents) + '</td>' +
    '<td class="r">' + fmt(it.line_cents) + '</td></tr>'
  ).join('');

  const rawBalance = (inv.total_cents || 0) - (inv.paid_cents || 0);
  const overpaid = rawBalance < 0;
  const balance = overpaid ? 0 : rawBalance;
  const isPaid = status === 'paid';
  const isVoid = status === 'void';
  const canPay = !isPaid && !isVoid && balance > 0;
  const cardTotal = Math.round(balance * 1.03);
  const cardFee = cardTotal - balance;

  document.getElementById('root').innerHTML =
    (isPaid ? '<div class="paid-banner">Paid in full on ' + (inv.paid_at || '') + '. Thank you!</div>' : '') +
    (isVoid ? '<div class="paid-banner" style="background:#e8e8e8;color:#666;">This invoice has been voided.</div>' : '') +
    '<div class="card">' +
      '<div style="text-align:center;margin-bottom:18px;"><img src="invoice-logo.png" alt="Garden Faery" style="height:64px;width:auto;"></div>' +
      '<div class="head">' +
        '<div>' +
          '<h1>Invoice ' + esc(inv.number) + '</h1>' +
          '<div class="muted">Issued ' + esc(inv.issue_date || '') + (inv.due_date ? ' &middot; Due ' + esc(inv.due_date) : '') + '</div>' +
        '</div>' +
        '<span class="pill ' + status + '">' + status + '</span>' +
      '</div>' +

      '<div class="from-to">' +
        '<div>' +
          '<h3>From</h3>' +
          '<div><strong>Garden Faery</strong></div>' +
          '<div class="muted">Bayside, CA</div>' +
          '<div class="muted">hello@gardenfaery.love</div>' +
        '</div>' +
        '<div>' +
          '<h3>Bill to</h3>' +
          '<div><strong>' + esc(inv.client_name || '—') + '</strong></div>' +
          (inv.client_email ? '<div class="muted">' + esc(inv.client_email) + '</div>' : '') +
          (inv.client_address ? '<div class="muted">' + esc(inv.client_address) + '</div>' : '') +
        '</div>' +
      '</div>' +

      '<table class="items">' +
        '<thead><tr><th>Description</th><th class="r">Qty</th><th class="r">Unit</th><th class="r">Total</th></tr></thead>' +
        '<tbody>' + lineRows + '</tbody>' +
      '</table>' +

      '<div class="totals">' +
        '<div class="row"><span>Subtotal</span><span>' + fmt(inv.subtotal_cents) + '</span></div>' +
        ((inv.discount_cents > 0) ? '<div class="row"><span>' + (inv.coupon_code ? 'Code ' + esc(inv.coupon_code) : 'Discount') + '</span><span>&minus;' + fmt(inv.discount_cents) + '</span></div>' : '') +
        ((inv.tax_cents > 0) ? '<div class="row"><span>Tax (' + (inv.tax_pct || 0) + '%)</span><span>' + fmt(inv.tax_cents) + '</span></div>' : '') +
        '<div class="row grand"><span>Total</span><span>' + fmt(inv.total_cents) + '</span></div>' +
        (inv.paid_cents > 0 && !isPaid ? '<div class="row"><span>Paid</span><span>&minus;' + fmt(inv.paid_cents) + '</span></div><div class="row grand"><span>Balance</span><span>' + (overpaid ? 'Paid' : fmt(balance)) + '</span></div>' + (overpaid ? '<div class="row"><span></span><span style="font-size:0.82rem;color:#666;">Overpayment on record &mdash; please contact us.</span></div>' : '') : '') +
      '</div>' +

      (inv.notes ? '<div class="notes">' + esc(inv.notes) + '</div>' : '') +
      (inv.terms ? '<div class="notes" style="font-style:italic;">Terms: ' + esc(inv.terms) + '</div>' : '') +

      '<div class="actions">' +
        (canPay ? '<button class="btn" onclick="payInvoice(\'bank\')" id="pay-bank">Pay by bank — ' + fmt(balance) + '</button>' : '') +
        (canPay ? '<button class="btn secondary" onclick="payInvoice(\'card\')" id="pay-card">Pay by card — ' + fmt(cardTotal) + '</button>' : '') +
        '<button class="btn secondary" onclick="window.print()">Print / Save PDF</button>' +
      '</div>' +
      (canPay
        ? '<p style="margin-top:14px;font-size:0.82rem;color:#666;line-height:1.45;text-align:center;">' +
          'Pay by <strong>bank (ACH), cash, or check</strong> for <strong>no fee</strong>. ' +
          'Card payments include a <strong>3% processing fee</strong> (+' + fmt(cardFee) + '), for a card total of <strong>' + fmt(cardTotal) + '</strong>.' +
          '</p>'
        : '') +
    '</div>' +
    '<div class="foot">Questions? Reply to your invoice email or write to <a href="mailto:hello@gardenfaery.love">hello@gardenfaery.love</a>.</div>';
}

async function payInvoice(method) {
  method = method === 'card' ? 'card' : 'bank';
  const btn = document.getElementById(method === 'card' ? 'pay-card' : 'pay-bank');
  const orig = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Opening checkout…'; }
  try {
    const res = await fetch(PB_URL + '/api/invoice/pay', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: TOKEN, method: method }),
    });
    const data = await res.json();
    if (!data.ok || !data.url) {
      if (btn) { btn.disabled = false; btn.textContent = orig; }
      alert('Could not start checkout: ' + (data.error || 'unknown'));
      return;
    }
    location.href = data.url;
  } catch (err) {
    if (btn) { btn.disabled = false; btn.textContent = orig; }
    alert('Network error: ' + err.message);
  }
}

function showErr(msg) {
  document.getElementById('root').innerHTML = '<div class="card"><p class="err">' + esc(msg) + '</p></div>';
}

loadInvoice();
</script>
</body>
</html>
