<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moon Cycle | Garden Faery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --plum: #4a1942;
  --cream: #f8f4ed;
  --petal-pink: #c48bb0;
  --petal-pink-light: #e8d0df;
  --pollen-gold: #d4c27a;
  --sage: #a3b88c;
  --white: #ffffff;
  --gray-100: #f2efe8;
  --gray-200: #e0dbd3;
  --gray-400: #a89e96;
  --gray-600: #6b5f56;
  --red-light: #f0d4d4;
  --red: #a03020;
  --moon: #8a6b9e;
  --moon-light: #d5c6df;
  --radius: 12px;
  --shadow: 0 2px 12px rgba(74,25,66,0.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Nunito',sans-serif; background:var(--cream); color:var(--plum); min-height:100vh; padding-bottom:60px; }
h1,h2,h3 { font-family:'Lora',serif; font-weight:400; }
.container { max-width:560px; margin:0 auto; padding:16px; }
.top-bar { display:flex; align-items:center; justify-content:space-between; padding:16px 0 8px; }
.top-bar h1 { font-size:1.5rem; }
.btn { padding:10px 16px; border:none; border-radius:10px; background:var(--plum); color:var(--white); font-family:'Nunito',sans-serif; font-weight:600; cursor:pointer; font-size:0.9rem; }
.btn.secondary { background:var(--gray-200); color:var(--plum); }
.btn.danger { background:var(--red-light); color:var(--red); }
.btn:disabled { opacity:0.5; cursor:not-allowed; }
.card { background:var(--white); border-radius:var(--radius); padding:16px; margin-bottom:12px; box-shadow:var(--shadow); }
.card h3 { font-size:1.1rem; margin-bottom:10px; }
.row { display:flex; gap:8px; align-items:center; }
.row.wrap { flex-wrap:wrap; }
.stat { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--gray-100); }
.stat:last-child { border-bottom:none; }
.stat .label { color:var(--gray-600); font-size:0.9rem; }
.stat .value { font-weight:700; }
label { display:block; font-size:0.85rem; color:var(--gray-600); margin-bottom:4px; }
input[type=date], input[type=password], input[type=text] {
  width:100%; padding:10px 12px; border:1px solid var(--gray-200); border-radius:10px;
  font-family:'Nunito',sans-serif; font-size:0.95rem; background:var(--white); color:var(--plum);
}
.form-field { margin-bottom:10px; flex:1; }

/* Login */
#login { max-width:360px; margin:80px auto; padding:24px; }
#login .card { text-align:center; }
#login-error { color:var(--red); font-size:0.85rem; margin-top:8px; display:none; }

/* Calendar */
.cal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.cal-header h3 { font-size:1.05rem; }
.cal-nav { display:flex; gap:4px; }
.cal-nav button { background:var(--gray-100); border:none; border-radius:8px; width:30px; height:30px; font-weight:700; color:var(--plum); cursor:pointer; font-size:1rem; }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.cal-dow { text-align:center; font-size:0.7rem; color:var(--gray-600); font-weight:700; padding:4px 0; }
.cal-day { aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:8px; font-size:0.85rem; background:var(--gray-100); position:relative; }
.cal-day.muted { color:var(--gray-400); background:transparent; }
.cal-day.today { outline:2px solid var(--plum); font-weight:700; }
.cal-day.period { background:var(--red-light); color:var(--red); font-weight:700; }
.cal-day.projected { background:repeating-linear-gradient(45deg,var(--red-light),var(--red-light) 4px,var(--cream) 4px,var(--cream) 8px); color:var(--red); font-weight:700; }
.cal-day.fertile { background:var(--pollen-gold); color:var(--plum); font-weight:700; }
.cal-day .mark { font-size:0.6rem; position:absolute; bottom:2px; }

/* Period list */
.period-item { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--gray-100); font-size:0.9rem; }
.period-item:last-child { border-bottom:none; }
.period-item .dates { color:var(--plum); }
.period-item .len { color:var(--gray-600); font-size:0.8rem; }
.period-item .del { background:none; border:none; color:var(--red); cursor:pointer; font-size:0.85rem; }

.legend { display:flex; flex-wrap:wrap; gap:10px; font-size:0.75rem; color:var(--gray-600); margin-top:8px; }
.legend span { display:flex; align-items:center; gap:4px; }
.legend .sw { width:12px; height:12px; border-radius:3px; display:inline-block; }

.sync-status { font-size:0.8rem; color:var(--gray-600); margin-top:8px; }
.sync-status.ok { color:var(--sage); }
.sync-status.err { color:var(--red); }
</style>
</head>
<body>

<!-- Login -->
<div id="login" style="display:none;">
  <div class="card">
    <h2 style="margin-bottom:16px;">🌙 Moon Cycle</h2>
    <div class="form-field" style="text-align:left;">
      <label>Password</label>
      <input type="password" id="login-pass" onkeypress="if(event.key==='Enter') doLogin()">
    </div>
    <button class="btn" id="login-btn" onclick="doLogin()" style="width:100%;">Sign in</button>
    <div id="login-error">Login failed</div>
  </div>
</div>

<!-- App -->
<div id="app" class="container" style="display:none;">
  <div class="top-bar">
    <h1>🌙 Moon Cycle</h1>
    <button class="btn secondary" onclick="logout()">Exit</button>
  </div>

  <!-- Current cycle stats -->
  <div class="card">
    <h3>Current cycle</h3>
    <div class="stat"><span class="label">Last period started</span><span class="value" id="s-last">—</span></div>
    <div class="stat"><span class="label">Cycle day (today)</span><span class="value" id="s-day">—</span></div>
    <div class="stat"><span class="label">Avg cycle length</span><span class="value" id="s-avg">—</span></div>
    <div class="stat"><span class="label">Avg period length</span><span class="value" id="s-plen">—</span></div>
    <div class="stat"><span class="label">Next projected</span><span class="value" id="s-next">—</span></div>
    <div class="stat"><span class="label">Fertile day (day 14)</span><span class="value" id="s-fertile">—</span></div>
    <div id="sync-status" class="sync-status">—</div>
  </div>

  <!-- Calendar -->
  <div class="card">
    <div class="cal-header">
      <h3 id="cal-title">—</h3>
      <div class="cal-nav">
        <button onclick="calPrev()">‹</button>
        <button onclick="calToday()">•</button>
        <button onclick="calNext()">›</button>
      </div>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="legend">
      <span><span class="sw" style="background:var(--red-light);"></span>Period</span>
      <span><span class="sw" style="background:repeating-linear-gradient(45deg,var(--red-light),var(--red-light) 4px,var(--cream) 4px,var(--cream) 8px);"></span>Projected</span>
      <span><span class="sw" style="background:var(--pollen-gold);"></span>Fertile (day 14)</span>
    </div>
  </div>

  <!-- Log new period -->
  <div class="card">
    <h3>Log a period</h3>
    <div class="row wrap">
      <div class="form-field"><label>Start</label><input type="date" id="f-start"></div>
      <div class="form-field"><label>End (optional)</label><input type="date" id="f-end"></div>
    </div>
    <button class="btn" onclick="addPeriod()">Save period</button>
  </div>

  <!-- History -->
  <div class="card">
    <h3>History</h3>
    <div id="period-list"></div>
  </div>
</div>

<script>
const PB_URL = 'https://bookings.gardenfaery.love';
let PB_TOKEN = sessionStorage.getItem('moon_token') || '';
let periods = []; // [{id, start, end}]
let calDate = new Date(); // month being viewed
const AUTO_BLOCK_TAG = 'Moon days';

// --- Login ---
async function doLogin() {
  const pass = document.getElementById('login-pass').value;
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-error');
  if (!pass) return;
  btn.disabled = true; err.style.display = 'none';
  try {
    const r = await fetch(PB_URL + '/api/collections/_superusers/auth-with-password', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ identity:'taya@gardenfaery.love', password: pass })
    });
    if (!r.ok) throw new Error('auth failed');
    const d = await r.json();
    PB_TOKEN = d.token;
    sessionStorage.setItem('moon_token', PB_TOKEN);
    showApp();
  } catch (e) {
    err.style.display = 'block';
    btn.disabled = false;
  }
}

function logout() {
  sessionStorage.removeItem('moon_token');
  PB_TOKEN = '';
  location.reload();
}

async function pb(path, opts={}) {
  const r = await fetch(PB_URL + path, {
    ...opts,
    headers: {
      'Content-Type':'application/json',
      'Authorization': PB_TOKEN,
      ...(opts.headers||{})
    }
  });
  if (r.status === 401) { logout(); throw new Error('unauth'); }
  return r;
}

async function showApp() {
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('f-start').value = todayStr();
  await loadPeriods();
  render();
  syncAutoBlocks();
}

// --- Data ---
async function loadPeriods() {
  const r = await pb('/api/collections/cycle_periods/records?sort=-start_date&perPage=200');
  const d = await r.json();
  periods = (d.items||[]).map(p => ({
    id: p.id,
    start: p.start_date.slice(0,10),
    end: p.end_date ? p.end_date.slice(0,10) : ''
  })).sort((a,b) => a.start.localeCompare(b.start));
}

async function addPeriod() {
  const s = document.getElementById('f-start').value;
  const e = document.getElementById('f-end').value;
  if (!s) return alert('Start date required');
  const body = { start_date: s + ' 00:00:00.000Z' };
  if (e) body.end_date = e + ' 00:00:00.000Z';
  const r = await pb('/api/collections/cycle_periods/records', { method:'POST', body: JSON.stringify(body) });
  if (!r.ok) { alert('Save failed: ' + await r.text()); return; }
  document.getElementById('f-end').value = '';
  await loadPeriods();
  render();
  syncAutoBlocks();
}

async function deletePeriod(id) {
  if (!confirm('Delete this period?')) return;
  const r = await pb('/api/collections/cycle_periods/records/' + id, { method:'DELETE' });
  if (!r.ok) { alert('Delete failed'); return; }
  await loadPeriods();
  render();
  syncAutoBlocks();
}

// --- Date math ---
function todayStr() {
  const d = new Date(); d.setHours(0,0,0,0);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function parseDate(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function dateStr(d) { return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysBetween(a, b) { return Math.round((parseDate(b) - parseDate(a)) / 86400000); }

// rolling average cycle length using last N starts
function avgCycle(n=6) {
  if (periods.length < 2) return 28;
  const recent = periods.slice(-n-1);
  const gaps = [];
  for (let i=1; i<recent.length; i++) gaps.push(daysBetween(recent[i-1].start, recent[i].start));
  return Math.round(gaps.reduce((a,b)=>a+b,0) / gaps.length);
}

function avgPeriodLen() {
  const withEnd = periods.filter(p => p.end);
  if (!withEnd.length) return 6;
  const lens = withEnd.map(p => daysBetween(p.start, p.end) + 1);
  return Math.round(lens.reduce((a,b)=>a+b,0) / lens.length);
}

function projectedStarts(count=6) {
  if (!periods.length) return [];
  const avg = avgCycle();
  const last = parseDate(periods[periods.length-1].start);
  const out = [];
  let cur = addDays(last, avg);
  // If the most recent logged period hasn't happened yet according to data,
  // project forward from actual last start regardless.
  for (let i=0; i<count; i++) {
    out.push(dateStr(cur));
    cur = addDays(cur, avg);
  }
  return out;
}

// --- Render ---
function render() {
  const avg = avgCycle();
  const plen = avgPeriodLen();
  const last = periods.length ? periods[periods.length-1] : null;
  const today = todayStr();

  document.getElementById('s-last').textContent = last ? last.start : '—';
  document.getElementById('s-day').textContent = last ? (daysBetween(last.start, today) + 1) : '—';
  document.getElementById('s-avg').textContent = avg + ' days';
  document.getElementById('s-plen').textContent = plen + ' days';

  const proj = projectedStarts(1);
  document.getElementById('s-next').textContent = proj[0] || '—';
  if (last) {
    const fertile = dateStr(addDays(parseDate(last.start), 13));
    document.getElementById('s-fertile').textContent = fertile;
  }

  renderList();
  renderCal();
}

function renderList() {
  const el = document.getElementById('period-list');
  if (!periods.length) { el.innerHTML = '<div style="color:var(--gray-600);font-size:0.9rem;">No periods logged yet.</div>'; return; }
  const recent = [...periods].reverse().slice(0, 12);
  el.innerHTML = recent.map(p => {
    const len = p.end ? (daysBetween(p.start, p.end) + 1) + ' days' : 'ongoing';
    return '<div class="period-item">' +
      '<div><div class="dates">' + p.start + (p.end ? ' → ' + p.end : '') + '</div>' +
      '<div class="len">' + len + '</div></div>' +
      '<button class="del" onclick="deletePeriod(\'' + p.id + '\')">Delete</button>' +
    '</div>';
  }).join('');
}

function renderCal() {
  const y = calDate.getFullYear();
  const m = calDate.getMonth();
  const monthName = calDate.toLocaleString('en-US', { month:'long', year:'numeric' });
  document.getElementById('cal-title').textContent = monthName;

  const first = new Date(y, m, 1);
  const startDow = first.getDay(); // 0=Sun
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const prevDays = new Date(y, m, 0).getDate();

  // Build sets
  const periodDays = new Set();
  periods.forEach(p => {
    if (!p.end) { periodDays.add(p.start); return; }
    let d = parseDate(p.start); const e = parseDate(p.end);
    while (d <= e) { periodDays.add(dateStr(d)); d = addDays(d,1); }
  });
  const projected = new Set();
  const fertile = new Set();
  const plen = avgPeriodLen();
  projectedStarts(6).forEach(s => {
    const d = parseDate(s);
    for (let i=0; i<plen; i++) projected.add(dateStr(addDays(d,i)));
  });
  // fertile = day 14 of cycle from each actual + projected start
  const starts = [...periods.map(p=>p.start), ...projectedStarts(6)];
  starts.forEach(s => { fertile.add(dateStr(addDays(parseDate(s), 13))); });

  const today = todayStr();
  const dows = ['S','M','T','W','T','F','S'];
  let html = dows.map(d => '<div class="cal-dow">'+d+'</div>').join('');

  // prev month pad
  for (let i = startDow-1; i >= 0; i--) {
    html += '<div class="cal-day muted">' + (prevDays - i) + '</div>';
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    let cls = 'cal-day';
    if (ds === today) cls += ' today';
    if (periodDays.has(ds)) cls += ' period';
    else if (projected.has(ds)) cls += ' projected';
    else if (fertile.has(ds)) cls += ' fertile';
    html += '<div class="'+cls+'">'+d+'</div>';
  }
  // trailing pad to fill grid
  const total = startDow + daysInMonth;
  const trail = (7 - (total % 7)) % 7;
  for (let i = 1; i <= trail; i++) html += '<div class="cal-day muted">'+i+'</div>';

  document.getElementById('cal-grid').innerHTML = html;
}

function calPrev() { calDate = new Date(calDate.getFullYear(), calDate.getMonth()-1, 1); renderCal(); }
function calNext() { calDate = new Date(calDate.getFullYear(), calDate.getMonth()+1, 1); renderCal(); }
function calToday() { calDate = new Date(); renderCal(); }

// --- Auto-block sync ---
// For the next 6 projected periods, block: (start - 1 day), start, start + 1 day (3 days each)
// Tags blocks with reason = AUTO_BLOCK_TAG so we can reconcile without touching manual blocks.
async function syncAutoBlocks() {
  const status = document.getElementById('sync-status');
  status.className = 'sync-status';
  status.textContent = 'Syncing auto-blocks…';
  try {
    // desired block dates
    const wanted = new Set();
    projectedStarts(6).forEach(s => {
      const d = parseDate(s);
      wanted.add(dateStr(addDays(d,-1)));
      wanted.add(dateStr(d));
      wanted.add(dateStr(addDays(d,1)));
    });

    // existing auto blocks
    const filter = encodeURIComponent('reason = "' + AUTO_BLOCK_TAG + '"');
    const r = await pb('/api/collections/blocked_times/records?filter=' + filter + '&perPage=500');
    const d = await r.json();
    const existing = {}; // date -> id
    (d.items||[]).forEach(b => { existing[b.date ? b.date.slice(0,10) : ''] = b.id; });

    // create missing
    let added = 0, removed = 0;
    for (const ds of wanted) {
      if (!existing[ds]) {
        const body = { date: ds, allDay: true, reason: AUTO_BLOCK_TAG };
        const cr = await pb('/api/collections/blocked_times/records', { method:'POST', body: JSON.stringify(body) });
        if (cr.ok) added++;
      }
    }
    // remove auto blocks not in wanted (only future ones, keep history)
    const today = todayStr();
    for (const ds in existing) {
      if (ds >= today && !wanted.has(ds)) {
        const dr = await pb('/api/collections/blocked_times/records/' + existing[ds], { method:'DELETE' });
        if (dr.ok) removed++;
      }
    }
    status.className = 'sync-status ok';
    status.textContent = 'Auto-block synced (+' + added + ' / -' + removed + ')';
  } catch (e) {
    status.className = 'sync-status err';
    status.textContent = 'Sync error: ' + e.message;
  }
}

// --- Boot ---
(async () => {
  if (PB_TOKEN) {
    // verify token still valid
    try {
      const r = await pb('/api/collections/cycle_periods/records?perPage=1');
      if (r.ok) { showApp(); return; }
    } catch(e) {}
  }
  document.getElementById('login').style.display = 'block';
})();
</script>
</body>
</html>
