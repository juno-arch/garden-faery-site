<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#5a1230">
<title>Thanks · Garden Faery</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  --plum: #4a1942;
  --cream: #f8f4ed;
  --spring-sage: #a3b88c;
  --white: #ffffff;
  --gray-600: #6b5f56;
  --shadow: 0 2px 12px rgba(74,25,66,0.08);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--cream);
  color: var(--plum);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  line-height: 1.5;
}
.card {
  background: var(--white);
  border-radius: 12px;
  padding: 36px 28px;
  box-shadow: var(--shadow);
  max-width: 440px;
  text-align: center;
}
.icon {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: var(--spring-sage);
  color: var(--white);
  font-size: 2.2rem;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 18px;
}
h1 {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 1.6rem;
  margin-bottom: 12px;
}
p { color: var(--gray-600); margin-bottom: 20px; }
.actions { display: flex; flex-direction: column; gap: 10px; }
.actions a {
  display: block;
  padding: 12px 16px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: 600;
  font-size: 0.95rem;
}
.actions a.primary { background: var(--plum); color: var(--white); }
.actions a.secondary { background: transparent; color: var(--plum); border: 1px solid #e0dbd3; }
.actions a:hover { opacity: 0.9; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">✓</div>
  <h1>Thank you!</h1>
  <p>Your payment is on its way. You'll get an emailed receipt shortly. Garden Faery's books update automatically.</p>
  <div class="actions">
    <a class="primary" href="/pay.html">Pay another visit</a>
    <a class="secondary" href="/">Back to gardenfaery.love</a>
  </div>
</div>
</body>
</html>
