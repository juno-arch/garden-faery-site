<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4a1942">
<title>What clients say · Garden Faery</title>
<meta name="description" content="What Garden Faery clients say about their gardens.">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="shared.css?v=2026-05-02b">
<style>
:root {
  --plum: #4a1942;
  --cream: #f8f4ed;
  --petal-pink: #c48bb0;
  --spring-sage: #a3b88c;
  --white: #ffffff;
  --gray-200: #e0dbd3;
  --gray-600: #6b5f56;
  --gold: #d4a017;
  --radius: 12px;
  --shadow: 0 2px 12px rgba(74,25,66,0.08);
}
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--cream);
  color: var(--plum);
  line-height: 1.6;
}
.reviews-wrap { max-width: 760px; margin: 0 auto; padding: 36px 18px 72px; }
.reviews-wrap h1 {
  font-family: 'Fraunces', serif; font-weight: 500; font-size: 2rem;
  margin-bottom: 6px;
}
.reviews-wrap .summary {
  color: var(--gray-600); margin-bottom: 28px;
  display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap;
}
.avg { color: var(--gold); font-size: 1.15rem; letter-spacing: 2px; }
.review-card {
  background: var(--white); border-radius: var(--radius);
  padding: 18px 20px; margin-bottom: 14px; box-shadow: var(--shadow);
}
.review-stars { color: var(--gold); font-size: 0.95rem; letter-spacing: 2px; margin-bottom: 6px; }
.review-title { font-weight: 600; font-size: 1.05rem; margin-bottom: 4px; }
.review-body { font-size: 0.98rem; white-space: pre-wrap; margin-bottom: 8px; }
.review-attrib { color: var(--gray-600); font-size: 0.85rem; }
.empty { color: var(--gray-600); text-align: center; padding: 40px 0; }
.cta {
  margin-top: 36px; text-align: center;
  background: var(--white); padding: 24px; border-radius: var(--radius); box-shadow: var(--shadow);
}
.cta h3 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 1.3rem; margin-bottom: 8px; }
.cta a {
  display: inline-block; margin-top: 10px;
  background: var(--plum); color: var(--white);
  padding: 12px 22px; border-radius: 8px;
  text-decoration: none; font-weight: 600;
}
</style>
</head>
<body>

<!-- Site header is added by shared.js or marketing template; for now keep minimal. -->
<header style="background:var(--white);padding:16px 20px;box-shadow:0 1px 4px rgba(74,25,66,0.05);">
  <div style="max-width:1000px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;">
    <a href="/" style="font-family:'Fraunces',serif;font-weight:500;font-size:1.25rem;color:var(--plum);text-decoration:none;">Garden Faery</a>
    <nav style="display:flex;gap:18px;font-size:0.9rem;">
      <a href="/about.html" style="color:var(--plum);text-decoration:none;">About Me</a>
      <a href="/book.html" style="color:var(--plum);text-decoration:none;">Book a visit</a>
    </nav>
  </div>
</header>

<main class="reviews-wrap">
  <h1>What clients say</h1>
  <div class="summary" id="summary"><span>Loading…</span></div>
  <div id="list"></div>
  <div class="cta">
    <h3>Want one of these visits?</h3>
    <p style="color:var(--gray-600);">Spring + summer slots fill up fast.</p>
    <a href="/book.html">Book a visit</a>
  </div>
</main>

<script>
const PB_URL = 'https://bookings.gardenfaery.love';

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function stars(n) {
  n = Math.max(0, Math.min(5, Math.round(Number(n) || 0)));
  return '★★★★★'.slice(0, n) + '☆☆☆☆☆'.slice(0, 5 - n);
}
function niceDate(iso) {
  if (!iso) return '';
  // Validate as YYYY-MM-DD before parsing so niceDate only ever returns
  // controlled, safe text (no raw API value leaks through the fallback).
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso));
  if (!m) return '';
  const dt = new Date(iso + 'T12:00:00');
  if (isNaN(dt.getTime())) return m[1] + '-' + m[2];
  return dt.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
}

async function load() {
  try {
    const r = await fetch(PB_URL + '/api/reviews/public?limit=100');
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'load failed');

    const list = document.getElementById('list');
    const summary = document.getElementById('summary');

    if (d.count === 0) {
      summary.innerHTML = '<span>No reviews yet — be the first.</span>';
      list.innerHTML = '<div class="empty">When clients leave a few words, they\'ll show up here.</div>';
      return;
    }

    const avg = Number(d.average_rating) || 0;
    summary.innerHTML =
      '<span class="avg">' + stars(avg) + '</span>' +
      '<span>' + avg.toFixed(1) + ' average</span>' +
      '<span style="opacity:0.4;">·</span>' +
      '<span>' + d.count + ' review' + (d.count === 1 ? '' : 's') + '</span>';

    // schema.org AggregateRating
    const aggregate = {
      '@context': 'https://schema.org',
      '@type': 'LocalBusiness',
      'name': 'Garden Faery',
      'url': 'https://gardenfaery.love',
      'aggregateRating': {
        '@type': 'AggregateRating',
        'ratingValue': String(avg),
        'reviewCount': String(d.count),
      },
      'review': (d.reviews || []).map(rv => ({
        '@type': 'Review',
        'reviewRating': { '@type': 'Rating', 'ratingValue': String(rv.rating), 'bestRating': '5' },
        'author': { '@type': 'Person', 'name': rv.display_name },
        'reviewBody': rv.body,
        'datePublished': rv.published_at || rv.visit_date || '',
      })),
    };
    const s = document.createElement('script');
    s.type = 'application/ld+json';
    // Escape '<' so a review body can't break out of the JSON-LD block with a
    // closing script tag (defense in depth — textContent already blocks breakout).
    s.textContent = JSON.stringify(aggregate).replace(/</g, '\\u003c');
    document.head.appendChild(s);

    list.innerHTML = (d.reviews || []).map(rv =>
      '<article class="review-card">' +
        '<div class="review-stars">' + stars(rv.rating) + '</div>' +
        (rv.title ? '<div class="review-title">' + esc(rv.title) + '</div>' : '') +
        '<div class="review-body">' + esc(rv.body) + '</div>' +
        '<div class="review-attrib">— ' + esc(rv.display_name) +
          (rv.visit_date ? ' &middot; ' + niceDate(rv.visit_date) : '') +
        '</div>' +
      '</article>'
    ).join('');
  } catch (err) {
    document.getElementById('summary').textContent = '';
    document.getElementById('list').innerHTML = '<div class="empty">Could not load reviews right now.</div>';
    console.error(err);
  }
}

load();
</script>
</body>
</html>
